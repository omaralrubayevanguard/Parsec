<!doctype html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec · Tooltips</title>
<style>
/* ---------- tokens: two themes (rename to the app's own, e.g. Ivory / Graphite) ---------- */
:root,[data-th="light"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--warn:#AD7210;--bad:#C0503F;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="dark"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--warn:#E2A84C;--bad:#EC7F6C;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Inter","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* ---------- the frame (prefix ip- so the drawn visuals' classes can't collide) ---------- */
.ip-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.ip-bar h1{margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;font:500 19px/24px var(--serif)}
.ip-bar h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ip-jump{display:flex;gap:2px;flex-wrap:wrap} .ip-jump a{padding:4px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);text-decoration:none} .ip-jump a:hover{background:var(--fill)}
.ip-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.ip-seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)} .ip-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.ip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--sans)}
.ip-btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .ip-btn em{font-style:normal;opacity:.7;font-size:11px}
.ip-btn:focus-visible,.ip-opt:focus-visible,.ip-seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ip-wrap{max-width:1500px;margin:0 auto;padding:18px 16px 120px}
.ip-now{margin:0 0 20px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)} .ip-now h2{margin:0 0 8px;font:500 15px/1 var(--serif)}
.ip-lead{margin:0 2px 18px;color:var(--ink2)}
.ip-sec{margin:0 0 26px;scroll-margin-top:64px} .ip-sec h2{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font:500 22px/28px var(--serif)} .ip-sec h2 small{font:400 12.5px var(--sans);color:var(--ink3)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px} @media (max-width:980px){.ip-grid{grid-template-columns:1fr}}
.ip-idea{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.ip-idea.picked{box-shadow:0 0 0 1.5px var(--accl),var(--shadow)}
.ip-idea h3{margin:0;font:600 15px/20px var(--sans)} .ip-idea header p{margin:3px 0 0;font-size:12.5px;line-height:17px;color:var(--ink3)}
.ip-vis{position:relative;min-height:96px;padding:12px;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;overflow:hidden}
.ip-hint{position:absolute;left:8px;bottom:8px;z-index:5;padding:3px 8px;border-radius:7px;background:var(--raised);box-shadow:var(--shadow);font-size:11px;color:var(--ink3);pointer-events:none}
.ip-vis.ip-has .ip-hint,.ip-vis.ip-skip .ip-hint,.ip-vis:not(.ip-has) .ip-replay{display:none}
.ip-vis.ip-skip>*:not(.ip-replay){opacity:.45}
.ip-replay{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;z-index:5;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink3);font-size:11px}
.ip-ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px}
.ip-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:16px;color:var(--ink2)}
.ip-opt:hover{background:var(--fill)} .ip-opt i{width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.ip-opt b{display:block;font-weight:500;color:var(--ink)} .ip-opt small{display:block;font-size:11.5px;color:var(--ink3)}
.ip-opt[aria-pressed="true"]{background:var(--acct)} .ip-opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
#ip-picks{position:fixed;z-index:85;right:16px;top:62px;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#ip-picks[hidden]{display:none}
#ip-picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);white-space:pre-wrap}
#ip-picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font-size:13px;resize:vertical;outline:none}
.ip-ph{display:flex;align-items:center;font:500 18px/1 var(--serif)} .ip-ph b{flex:1;font-weight:500} .ip-ph button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.ip-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise)}
@media (max-width:640px){ .ip-grid{grid-template-columns:1fr} #ip-picks{left:16px;right:16px;width:auto} .ip-bar h1 small{display:none} }

/* ---------- the drawn visuals: prefix v- · animate with [data-step] on .ip-vis ---------- */
.v-btn{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12px/1 var(--sans);transition:background .2s,color .2s}
.v-tip{position:absolute;left:12px;top:48px;padding:6px 9px;border-radius:7px;background:var(--primary);color:var(--onprimary);font-size:12px;font-weight:500;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s}
.v-cur{position:absolute;left:150px;top:70px;width:14px;height:14px;pointer-events:none;transition:left .6s cubic-bezier(.2,.75,.25,1),top .6s cubic-bezier(.2,.75,.25,1)}
.v-cur::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,64% 94%,44% 66%,80% 66%);background:var(--ink)}
.v-cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.3)}
.ip-s-point .v-cur{left:44px;top:18px}
[data-step="show"] .v-tip,[data-step="click"] .v-tip{opacity:1;transform:none}
[data-step="click"] .v-cur::after{animation:v-ripple .45s ease-out}
[data-step="done"] .v-btn.v-target{background:var(--primary);color:var(--onprimary)}
[data-opt="card"] .v-tip{background:var(--raised);color:var(--ink);box-shadow:var(--raise)}   /* each option shows its own outcome */
[data-opt="quiet"] .v-tip{background:var(--acct);color:var(--ink)}
@keyframes v-ripple{0%{opacity:.35;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.v-cur,.v-tip{transition:none}.v-cur::after{animation:none!important}}
</style>
</head>
<body>
<div class="ip-bar"><h1>Parsec <small>Tooltips · text and styling</small></h1><nav class="ip-jump" id="ip-jump"></nav>
<div class="ip-seg" role="group" aria-label="Theme"><button data-th="light" aria-pressed="true">Light</button><button data-th="dark" aria-pressed="false">Dark</button></div>
<button class="ip-btn pri" id="ip-open">Your picks <em id="ip-n"></em></button></div>
<main class="ip-wrap">
<section class="ip-now"><h2>How it looks now</h2><p style="margin:0;color:var(--ink2)">Crops or counts of the current state go here — 1–2 lines, no essay.</p></section>
<p class="ip-lead" id="ip-lead"></p>
<div id="ip-secs"></div>
</main>
<div id="ip-picks" hidden></div>
<script>
/* ---------- the content: groups → ideas → options (Skip is added to each) ---------- */
var APP = 'Parsec', TOPIC = 'Tooltips', KEY = 'ip-parsec-tooltips';   /* KEY: unique per mock-up */
var IDEAS = [
  { group: 'One look', items: [
    { k: 'look', t: 'One tooltip, the same everywhere', why: 'Today: the browser’s grey box on most things.',
      vis: '<span class="v-btn v-target">Copy RO number</span><span class="v-tip">Copy RO number · C</span><span class="v-cur"></span>',
      steps: [['idle', 900], ['point', 700], ['show', 1100], ['click', 500], ['done', 1400]],
      opts: [['ink', 'A · Ink', 'dark on light, light on dark'], ['card', 'B · Card', 'like the Time Log’s tip now'], ['quiet', 'C · Quiet', 'a tinted box, no shadow']] }
  ]}
];
/* ---------- the page ---------- */
var D = document, $ = function (s, r) { return (r || D).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || D).querySelectorAll(s)); };
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var V = { th: 'light', open: false, v: {}, note: '' };
try { var sv = JSON.parse(localStorage.getItem(KEY) || '{}'); if (sv.v) V.v = sv.v; if (sv.note) V.note = sv.note; if (sv.th) V.th = sv.th; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: V.v, note: V.note, th: V.th })); } catch (e) {} }
var total = IDEAS.reduce(function (a, g) { return a + g.items.length; }, 0);
$('#ip-lead').textContent = total + ' idea' + (total === 1 ? '' : 's') + ' for the ' + TOPIC.toLowerCase() + ' — pick an option on each, or Skip, then copy Your picks into the chat.';
$('#ip-jump').innerHTML = IDEAS.map(function (g, i) { return '<a href="#ip-s' + i + '">' + esc(g.group) + '</a>'; }).join('');
$('#ip-secs').innerHTML = IDEAS.map(function (g, i) {
  return '<section class="ip-sec" id="ip-s' + i + '"><h2>' + esc(g.group) + ' <small>' + g.items.length + ' idea' + (g.items.length > 1 ? 's' : '') + '</small></h2><div class="ip-grid">' + g.items.map(function (it) {
    var o = it.opts.concat([['skip', 'Skip', '']]);
    return '<article class="ip-idea" data-k="' + it.k + '"><header><h3>' + esc(it.t) + '</h3><p>' + esc(it.why) + '</p></header><div class="ip-vis" data-step="' + (it.steps ? it.steps[0][0] : '') + '">' + it.vis + (it.steps ? '<span class="ip-hint">Pick an option to see it play</span><button class="ip-replay" aria-label="Play it again" title="Play it again">↻</button>' : '') + '</div><div class="ip-ol">' +
      o.map(function (x) { return '<button class="ip-opt" data-k="' + it.k + '" data-v="' + x[0] + '" aria-pressed="false"><i></i><span><b>' + esc(x[1]) + '</b>' + (x[2] ? '<small>' + esc(x[2]) + '</small>' : '') + '</span></button>'; }).join('') + '</div></article>';
  }).join('') + '</div></section>';
}).join('');
/* ---------- the animations: still until you pick an option — then that option plays once and holds its result (↻ plays it again) ---------- */
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function find(k) { var r = null; IDEAS.forEach(function (g) { g.items.forEach(function (it) { if (it.k === k) r = it; }); }); return r; }
function mark(vis, it, n) { it.steps.forEach(function (s, j) { vis.classList.toggle('ip-s-' + s[0], j <= n); }); vis.dataset.step = it.steps[n][0]; }   /* data-step = this step · .ip-s-<name> = every step reached */
function rest(vis, it, end) { clearTimeout(vis._t); if (it.steps) mark(vis, it, end ? it.steps.length - 1 : 0); }
function play(vis, it) {
  clearTimeout(vis._t); if (!it.steps) return;
  if (RM) { rest(vis, it, 1); return; }   /* reduced motion: the end state, still */
  var i = 0; (function next() { var s = it.steps[i]; mark(vis, it, i); i++; if (i < it.steps.length) vis._t = setTimeout(next, s[1]); })();
}
function setOpt(vis, v) { if (v && v !== 'skip') vis.dataset.opt = v; else delete vis.dataset.opt; vis.classList.toggle('ip-has', !!v && v !== 'skip'); vis.classList.toggle('ip-skip', v === 'skip'); }
$$('.ip-vis').forEach(function (vis) { var k = vis.closest('.ip-idea').dataset.k, it = find(k), v = V.v[k]; setOpt(vis, v); rest(vis, it, v && v !== 'skip'); });   /* saved picks show their result, still */
/* ---------- Your picks ---------- */
function pkText() {
  var L = [APP + ' · ' + TOPIC + ' — my picks'];
  IDEAS.forEach(function (g) { var rows = []; g.items.forEach(function (it) { var v = V.v[it.k]; if (!v) return; var o = it.opts.filter(function (x) { return x[0] === v; })[0]; rows.push('· ' + it.t + ': ' + (v === 'skip' ? 'skip' : o ? o[1] : v)); }); if (rows.length) { L.push(g.group + ':'); L = L.concat(rows); } });
  var left = total - Object.keys(V.v).length; if (left) L.push('(not picked yet: ' + left + ')');
  if (V.note.trim()) L.push('Notes: ' + V.note.trim());
  return L.join('\n');
}
function sync() {
  D.documentElement.setAttribute('data-th', V.th);
  $$('.ip-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.th === V.th)); });
  $$('.ip-opt').forEach(function (b) { b.setAttribute('aria-pressed', String(V.v[b.dataset.k] === b.dataset.v)); });
  $$('.ip-idea').forEach(function (a) { a.classList.toggle('picked', !!V.v[a.dataset.k]); });
  var n = Object.keys(V.v).length; $('#ip-n').textContent = n ? n + '/' + total : '';
}
function draw() {
  var w = $('#ip-picks'); w.hidden = !V.open; if (!V.open) return;
  var ta = $('#ip-note'); if (ta && D.activeElement === ta) { $('#ip-picks pre').textContent = pkText(); return; }
  w.innerHTML = '<div class="ip-ph"><b>Your picks</b><button data-pk="x" aria-label="Close">✕</button></div><pre>' + esc(pkText()) + '</pre><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)">Anything else<textarea id="ip-note" placeholder="Anything to add or change">' + esc(V.note) + '</textarea></label><button class="ip-btn pri" data-pk="copy" style="justify-content:center;height:34px">Copy for the chat</button>';
}
function toast(m) { var t = $('.ip-toast'); if (t) t.remove(); t = D.createElement('div'); t.className = 'ip-toast'; t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function () { t.remove(); }, 2600); }
function copy(tx) {
  var fb = function () { var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try { D.execCommand('copy'); toast('Copied — paste it in the chat.'); } catch (e) { toast('Select the text and copy it.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Copied — paste it in the chat.'); }, fb); else fb();
}
D.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('.ip-seg button'))) { V.th = b.dataset.th; save(); sync(); return; }
  if (t.closest('#ip-open')) { V.open = !V.open; draw(); return; }
  if ((b = t.closest('[data-pk]'))) { if (b.dataset.pk === 'x') { V.open = false; draw(); } else copy(pkText()); return; }
  if ((b = t.closest('.ip-replay'))) { var vis = b.closest('.ip-vis'); play(vis, find(vis.closest('.ip-idea').dataset.k)); return; }
  if ((b = t.closest('.ip-opt'))) { var k = b.dataset.k, v = b.dataset.v; if (V.v[k] === v) delete V.v[k]; else V.v[k] = v; save(); sync(); draw();
    var vs = $('.ip-idea[data-k="' + k + '"] .ip-vis'), it = find(k), nv = V.v[k]; setOpt(vs, nv); if (nv && nv !== 'skip') play(vs, it); else rest(vs, it, 0); }
});
D.addEventListener('input', function (ev) { if (ev.target.id === 'ip-note') { V.note = ev.target.value; save(); var p = $('#ip-picks pre'); if (p) p.textContent = pkText(); } });
D.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.open) { V.open = false; draw(); } });
sync();
</script>
</body>
</html>

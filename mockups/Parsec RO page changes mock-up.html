<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec RO page changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{all:unset;cursor:pointer;height:26px;line-height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)} .chips button[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Parsec · RO page — the Time tab in colors with edits in place, icons, the operation header, tab actions, the theme switch, sample trucks (mock-up) */
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 110px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mu{font-size:12px;color:var(--ink3)}
/* reason colors */
:root{--r-diag:#3D6FD9;--r-rep:#3A8C60;--r-insp:#6C69C8;--r-test:#1F8A9A;--r-switch:#8D897F;--r-eod:#5E6B7A;--r-lunch:#8A7A9B;--r-wparts:#AD7210;--r-wappr:#2F8795;--r-wtech:#A24C8F;--r-wfm:#C0662F;--r-done:#23764A;
  --j-op:#2F8795;--j-diag:#3D6FD9;--j-pm:#6C69C8;--j-warr:#AD7210;--j-cb:#C0503F;--j-sub:#857F75;--j-rec:#A24C8F}
[data-th="graphite"],[data-th="black"]{--r-diag:#7FA2F5;--r-rep:#5BBE8B;--r-insp:#9E9DF0;--r-test:#58B3C0;--r-switch:#8D897F;--r-eod:#9AA6B4;--r-lunch:#B7A6C9;--r-wparts:#E2A84C;--r-wappr:#58B3C0;--r-wtech:#D88AC6;--r-wfm:#EE9A63;--r-done:#5BBE8B;
  --j-op:#58B3C0;--j-diag:#7FA2F5;--j-pm:#9E9DF0;--j-warr:#E2A84C;--j-cb:#EC7F6C;--j-sub:#A8A398;--j-rec:#D88AC6}
/* the frame: sidebar + RO page */
.fr{border-radius:18px;background:var(--panel);box-shadow:var(--raise);overflow:hidden;min-width:0;display:grid;grid-template-columns:190px minmax(0,1fr);min-height:860px}
.sb{display:flex;flex-direction:column;gap:2px;padding:14px 10px 12px;box-shadow:inset -1px 0 0 var(--hair);background:var(--canvas);min-width:0}
.sb .rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .sb .rl-b svg{width:18px;height:18px} .sb .rl-b svg circle{fill:var(--ink)} .sb .rl-b svg .o{fill:var(--ink3)} .sb .rl-b svg .c{fill:#22c55e}
.sb .ri{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--ink2)} .sb .ri .ic{width:16px;height:16px} .sb .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.sb .ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.sb .clk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 4px;font-size:12.5px} .sb .clk i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none} .sb .clk small{display:block;font-size:11px;color:var(--ink3)}
.sb .grow{flex:1}
.thm{margin:6px 2px 6px;padding:4px;border-radius:12px;background:var(--fill);box-shadow:inset 0 1px 2px rgba(0,0,0,.07),inset 0 0 0 1px var(--hair);display:flex;gap:2px}
.thm.col{flex-direction:column}
.thm button{all:unset;cursor:pointer;flex:1;height:30px;display:grid;place-items:center;border-radius:9px;color:var(--ink3);position:relative}
.thm button:hover{color:var(--ink)}
.thm button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.08)}
.thm .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);overflow:hidden;display:block;position:relative}
.thm .sw::after{content:"";position:absolute;right:0;top:0;bottom:0;width:50%}
.thm .sw.iv{background:#F2F0EA} .thm .sw.iv::after{background:#86643A}
.thm .sw.gr{background:#151514} .thm .sw.gr::after{background:#D1B184}
.thm .sw.wh{background:#fff} .thm .sw.wh::after{background:#245cdb}
.thm .sw.bk{background:#0b0d10} .thm .sw.bk::after{background:#8aafff}
.thm .ic{width:15px;height:15px}
.thm .lb{font-size:11px;margin-left:6px}
.thm.size{margin-top:0}
.thm.size button{font-size:11.5px;font-weight:500}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;font-size:13px} .me .av{width:26px;height:26px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font:600 10px/1 var(--sans);color:var(--ink2)} .me small{display:block;font-size:11px;color:var(--ink3)}
.sb.mini{width:58px}
/* the RO page */
.pg2{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;box-shadow:inset 0 -1px 0 var(--hair);font-size:13px;color:var(--ink3)}
.top b{color:var(--ink);font-family:var(--mono);font-weight:600;font-size:12.5px}
.top .tt{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-family:var(--mono);font-size:12px;color:var(--ink2)} .top .tt b{font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 244px;min-height:0;flex:1}
.mid{padding:16px 18px 40px;min-width:0;display:flex;flex-direction:column;gap:10px}
.rr{padding:14px 14px 30px;box-shadow:inset 1px 0 0 var(--hair);display:flex;flex-direction:column;gap:12px;min-width:0}
.hh{display:flex;align-items:center;gap:8px} .hh h3{margin:0;font:500 19px/1 var(--serif)} .hh .n{font-size:12px;color:var(--ink3)}
/* icon buttons */
.ib{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;min-width:28px;padding:0 6px;border-radius:8px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.ib:hover{background:var(--fill);color:var(--ink)} .ib .ic{width:15px;height:15px}
.ib.on{background:var(--sel);color:var(--ink)}
.ib.dng:hover{color:var(--bad);background:var(--bad-t)}
.ib[data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:40;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--canvas);font:500 11.5px/1.3 var(--sans);white-space:nowrap;pointer-events:none}
.ib.w .lw{display:inline}
.ib .lw{display:none}
.iw .ib .lw{display:inline}
@container ropg (min-width:1100px){ .wide .ib .lw{display:inline} }
.lnk{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:7px;font-size:12.5px;color:var(--ink3)} .lnk:hover{background:var(--fill);color:var(--ink)}
/* the operation */
.op{border-radius:12px}
.oh{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 6px 0 10px;border-radius:12px;background:var(--fill);cursor:pointer}
.oh > *{flex:none}
.oh .tl{flex:1 1 auto}
.op.shut .oh{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.oh .cb{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--border);background:var(--raised)}
.oh .sd{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--ink3)}
.oh .sd.w{box-shadow:inset 0 0 0 1.6px var(--r-wparts)} .oh .sd.g{background:var(--good);box-shadow:none}
.oh .no{font-size:12.5px;color:var(--ink3);text-align:center}
.oh .tl{font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oh .no{width:14px}
.oh .hrs{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.oh .bar{width:38px;height:4px;border-radius:2px;background:var(--hair);position:relative;overflow:hidden} .oh .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:2px}
.oh .tav{width:22px;height:22px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font:600 9.5px/1 var(--sans);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair)}
.dd{position:relative;display:inline-flex}
.jt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 6px 0 7px;border-radius:6px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--hair);font:600 10.5px/1 var(--sans);letter-spacing:.04em;color:var(--ink2)}
.jt i{width:7px;height:7px;border-radius:50%;background:var(--jc,var(--ink3))} .jt .ic{width:11px;height:11px;color:var(--ink3)}
.jt.neu i{background:var(--ink3)}
.stp{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 9px;border-radius:999px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:12.5px;font-weight:500;white-space:nowrap}
.stp i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--sc,var(--ink3))} .stp i.f{background:var(--sc);box-shadow:none} .stp .ic{width:12px;height:12px;color:var(--ink3)}
.code{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--warn-t);color:var(--warn);font:600 10.5px/1 var(--mono)}
.menu{position:absolute;z-index:30;top:calc(100% + 4px);right:0;min-width:200px;padding:5px;border-radius:12px;background:var(--raised);box-shadow:var(--raise)}
.menu.l{left:0;right:auto}
.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:8px;font-size:13px;white-space:nowrap}
.menu button:hover{background:var(--fill)} .menu button[aria-pressed="true"]{background:var(--sel);font-weight:500}
.menu button i{width:8px;height:8px;border-radius:50%;flex:none} .menu .sep{height:1px;margin:4px 6px;background:var(--hair)} .menu .dng{color:var(--bad)}
.menu .mh{padding:5px 9px 6px;font-size:11.5px;color:var(--ink3)}
.ob{padding:10px 4px 6px 30px;display:flex;flex-direction:column;gap:12px}
.clock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:16px 18px;border-radius:14px;background:var(--raised);box-shadow:var(--shadow)}
.clock .big{font:500 30px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums} .clock small{display:block;font-size:12px;color:var(--ink3);margin-top:4px}
.clock .play{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--onprimary);display:grid;place-items:center} .clock .play .ic{width:15px;height:15px;fill:currentColor}
.clock .pb{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--hair);position:relative} .clock .pb i{position:absolute;left:0;top:0;bottom:0;width:78%;border-radius:2px;background:var(--ink2)}

function toast(m, undo){ var t = $('.toast'); if(t) t.remove(); t = D.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = '<span>' + esc(m) + '</span>' + (undo ? '<button data-x="undo">' + ic('undo') + 'Undo</button>' : ''); D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.remove(); }, 3400); }

D.addEventListener('click', function(e){
  var t = e.target, b;
  if((b = t.closest('[data-view]'))){ V.view = b.getAttribute('data-view'); V.menu = null; draw(); return; }
  if((b = t.closest('.mk button[data-th]'))){ V.th = b.getAttribute('data-th'); draw(); return; }

    if(c[5]){ V.P[k][v2] = V.P[k][v2] ? 0 : 1; } else V.P[k] = v2;

    return; }

  if((b = t.closest('[data-st]'))){ var q2 = b.getAttribute('data-st').split(':'); V.st[q2[0]] = q2.slice(1).join(':'); V.menu = null; draw(); return; }
  if((b = t.closest('[data-rs]'))){ var q3 = b.getAttribute('data-rs').split(':'), p0 = byId(q3[0]); if(p0){ snap(); p0[q3[1] === 's' ? 'sr' : 'er'] = q3.slice(2).join(':'); } V.menu = null; draw(); toast('Reason changed.', 1); return; }
  if((b = t.closest('[data-x]'))){ var x = b.getAttribute('data-x');
    if(x === 'm'){ e.stopPropagation(); var m = b.getAttribute('data-m'); V.menu = V.menu === m ? null : m; draw(); return; }
    if(x === 'tog'){ if(t.closest('.dd,.cb')) return; var o = b.getAttribute('data-o'); V.open[o] = !V.open[o]; V.menu = null; draw(); return; }
    if(x === 'toast'){ V.menu = null; draw(); toast(b.getAttribute('data-t')); return; }
    if(x === 'mini'){ V.mini = !V.mini; draw(); return; }
    if(x === 'tm'){ var q4 = b.getAttribute('data-tm').split(':'); V.editT = { id: q4[0], f: q4[1] }; V.menu = null; draw(); return; }
    if(x === 'pen'){ V.editP = b.getAttribute('data-p'); draw(); return; }
    if(x === 'alled'){ V.allEdit = !V.allEdit; draw(); if(!V.allEdit) toast('Punches saved.'); return; }

    if(x === 'pfok'){ var f = b.closest('[data-pf]'), p2 = byId(f.getAttribute('data-pf')); if(!p2) return; snap(); ['s', 'e', 'sr', 'er'].forEach(function(k2){ var el = f.querySelector('[data-pfi="' + k2 + '"]'); if(el) p2[k2] = el.value; }); var nw = p2.isNew; delete p2.isNew; V.editP = null; draw(); toast(nw ? 'Time entry added — ' + dur(p2) + '.' : 'Punch saved.', 1); return; }
    if(x === 'del'){ var id = b.getAttribute('data-p'); if(V.P.tDel === 'ask' && !V.allEdit){ V.askDel = id; draw(); } else delP(id); return; }
    if(x === 'askyes'){ delP(b.getAttribute('data-p')); return; }

    if(x === 'undo'){ if(V.undo){ T = JSON.parse(V.undo); V.undo = null; V.editT = null; V.editP = null; draw(); toast('Undone.'); } return; }

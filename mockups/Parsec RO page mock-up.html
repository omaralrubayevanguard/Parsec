<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec RO page</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

/* the RO page */
.mk .seg button:disabled,.btn:disabled{opacity:.4;cursor:default}
.pg{position:relative;height:calc(100vh - 53px);overflow:auto;background:var(--panel)}
.tb0{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;height:50px;padding:0 20px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--hair);font-size:13px;color:var(--ink3)}
.crumb{display:flex;align-items:center;gap:6px} .crumb i{font-style:normal;color:var(--ink4)} .crumb b{color:var(--ink);font-weight:500}
.ib0{all:unset;cursor:pointer;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink2)} .ib0:hover{background:var(--fill)}
.q{display:inline-flex;align-items:center;gap:5px;margin-left:10px} .q b{color:var(--ink);font-weight:600} .sep{width:1px;height:18px;background:var(--hair);margin:0 6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:0;min-height:calc(100% - 50px)}
.cols.three{grid-template-columns:290px minmax(0,1fr) 300px}
.col{container-type:inline-size;min-width:0;display:flex;flex-direction:column;gap:16px;padding:20px 22px 40px;min-height:100%}
.col.cM{padding:22px 34px 40px}
.col.cR{box-shadow:inset 1px 0 0 var(--hair);background:var(--panel)}
.col.cL{box-shadow:inset -1px 0 0 var(--hair)}
.col.empty{background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--fill) 70%,transparent) 10px 20px)}
.drop-hint{margin:auto;padding:18px;border:1.5px dashed var(--border);border-radius:12px;font-size:12.5px;color:var(--ink3);text-align:center}
/* a block, and its tools while you arrange */
.blk{position:relative;border-radius:14px;transition:box-shadow .16s var(--ease),opacity .16s}
.editing .blk:hover{box-shadow:0 0 0 1.5px var(--acc),0 0 0 6px color-mix(in srgb,var(--acc) 14%,transparent)}
.blk.new::before{content:"NEW";position:absolute;z-index:3;left:-6px;top:-8px;font:700 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acc);color:var(--onprimary);pointer-events:none}
.blk.lift{opacity:.35}
.blk.moved{animation:mv .5s var(--ease)}
@keyframes mv{0%{box-shadow:0 0 0 2px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.bt{position:absolute;z-index:6;right:8px;top:-15px;display:none;align-items:center;gap:2px;height:30px;padding:0 4px 0 2px;border-radius:9px;background:var(--raised);box-shadow:0 0 0 1px var(--border),0 6px 16px -6px rgba(0,0,0,.3);font-size:12px}
.editing .blk:hover > .bt,.editing .blk:focus-within > .bt{display:flex}
.bt b{font-weight:600;margin:0 6px 0 2px;color:var(--ink2);white-space:nowrap}
.bt button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink2)} .bt button:hover{background:var(--fill);color:var(--ink)} .bt button:disabled{opacity:.3;cursor:default;background:none}
.bt button:focus-visible{outline:2px solid var(--acc)}
.grip{cursor:grab;width:22px;height:24px;display:grid;place-items:center;color:var(--ink3)} .grip:active{cursor:grabbing}
.dmark{height:3px;margin:-9px 0 -10px;border-radius:2px;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.dragging .col{outline:1.5px dashed color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:-6px}
/* shared bits */
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair);font:600 8.5px/1 var(--sans);flex:none;margin-right:6px;vertical-align:middle}
.lk{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)} .lk:hover{color:var(--ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--fill);font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap} .tag.w{background:var(--warn-t);color:var(--warn)}
.age{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;font:600 11px/1 var(--mono);background:var(--fill);color:var(--ink2);white-space:nowrap} .age.b{background:var(--bad-t);color:var(--bad)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.none{margin:4px 0;font-size:12.5px;color:var(--ink3)}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink4)} .dt.wt{background:var(--warn)}
.st{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:13px;font-weight:500;color:var(--ink)} .st span{color:var(--ink3);font-weight:400} .st .ic{width:12px;height:12px;color:var(--ink3)}
.st.sm{height:28px;font-size:12.5px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px} .sec-h h3{margin:0;font:500 19px/24px var(--serif);letter-spacing:-.01em} .sec-h .n{font-size:13px;color:var(--ink3)}
.cd{border-radius:14px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden}
.cd-h{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;box-shadow:inset 0 -1px 0 var(--hair);font-size:13.5px} .cd-h small{font-size:12px;color:var(--ink3)}
.cd-b{padding:10px 14px 12px}
/* band */
.bd{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:end;gap:14px;padding:20px 22px 0;border-radius:18px;background:linear-gradient(180deg,var(--panel),var(--fill));box-shadow:inset 0 0 0 1px var(--hair)}
.bd.sm{grid-template-columns:minmax(0,1fr) 130px;padding-bottom:0} .bd.off{grid-template-columns:1fr;padding-bottom:0}
.bd-t{padding-bottom:18px;min-width:0}
.eb{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink3)} .eb i{font-style:normal;color:var(--ink4)} .eb .mono{color:var(--ink2)}
.bd h2{margin:6px 0 4px;font:500 32px/38px var(--serif);letter-spacing:-.02em} .sub{font-size:14px;color:var(--ink2)}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px} .who{font-size:13px;color:var(--ink3)}
.bd-p{position:relative;line-height:0;align-self:end} .bd-p img{width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.bd-p.small{align-self:center;margin-bottom:16px}
.cam{all:unset;cursor:pointer;position:absolute;right:0;bottom:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--border),0 2px 8px -2px rgba(0,0,0,.3)}
@container (max-width:640px){.bd{grid-template-columns:minmax(0,1fr) 190px}.bd h2{font-size:27px;line-height:32px}.st span{display:none}}
@container (max-width:440px){.st span{display:none}.bd{grid-template-columns:1fr;padding:14px 16px 0}.bd-p{order:-1;max-width:220px;justify-self:center}.bd.sm .bd-p{max-width:120px}.bd h2{font-size:23px;line-height:28px}.bd-t{padding-bottom:14px}.srow{margin-top:10px}}
/* stages */
.sg-h{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink3);margin-bottom:10px} .sg-h b{color:var(--ink);font-weight:600} .sg-h small{font-size:12.5px;color:var(--ink2)}
.sg-b{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px} .sg-b span{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-b i{height:4px;border-radius:2px;background:var(--hair)} .sg-b .d i{background:var(--ink2)} .sg-b .n i{background:repeating-linear-gradient(90deg,var(--warn) 0 6px,transparent 6px 9px)}
@container (max-width:440px){.sg-b span{font-size:10px}.sg-h small{flex-basis:100%}}
/* operations */
.op{display:grid;grid-template-columns:16px 16px minmax(0,1fr) auto auto 128px 22px;align-items:center;gap:10px;min-height:42px;padding:0 12px;margin:0 -10px;border-radius:10px;font-size:14px}
.op.on{background:var(--sel)} .op b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3)} .os.pt{box-shadow:inset 0 0 0 2px var(--warn)}
.on1{font:500 12.5px/1 var(--mono);color:var(--ink3)}
.nt{font-size:12.5px;color:var(--ink3)} .op:not(:has(.nt)) .ty{grid-column:5}
.ty{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font:600 10px/1 var(--mono);letter-spacing:.04em;background:var(--fill);color:var(--ink2)} .ty::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)} .ty.dg::before{background:#6b5bd2} .ty.wa::before{background:var(--warn)}
.hb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)} .hb .bar{flex:1;height:4px;border-radius:2px;background:var(--hair);overflow:hidden} .hb .bar i{display:block;height:100%;background:var(--ink2)}
.opx{padding:10px 0 14px 34px;display:flex;flex-direction:column;gap:12px}
.opx-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink2)} .opx-t > span:first-child{margin-right:4px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--border);font-size:12px;color:var(--ink3)} .chip.ok{box-shadow:none;background:var(--fill);color:var(--ink2)}
.tm{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px 16px;padding:18px 20px;border-radius:14px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--hair)}
.tm-a b{display:block;font-size:30px;font-weight:500;letter-spacing:-.01em} .tm-a small{font-size:12.5px;color:var(--ink3)}
.play{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--onprimary)}
.tm-bar{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--hair);position:relative} .tm-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:2px} .tm-bar::after{content:"";position:absolute;right:0;top:-4px;width:2px;height:12px;background:var(--ink)}
.tm-n{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .tm-n span{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink3)} .tm-n b{font-size:20px;font-weight:500;color:var(--ink)} .tm-n b small{font-size:12px;color:var(--ink3)} .tm-n .w{color:var(--warn)} .tm-n .g{color:var(--good)}
.tb{display:flex;gap:22px;box-shadow:inset 0 -1px 0 var(--hair)} .tb button{all:unset;cursor:pointer;padding:8px 0;font-size:13.5px;color:var(--ink2)} .tb button i{font-style:normal;font-size:12px;color:var(--ink3)} .tb button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--ink)}
.tb-b{display:flex;gap:18px;flex-wrap:wrap}
.tg3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px} .tg3 > .sec:first-child{grid-column:1 / -1}
.sec{border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);padding:10px 12px 12px;min-width:0}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:13px} .sh b{font-weight:600} .sh small{font-size:11.5px;color:var(--ink3)}
.nl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px;padding:6px 0;box-shadow:inset 0 -1px 0 var(--hair);font-size:12.5px;color:var(--ink2)} .nl small{font-size:11px;color:var(--ink4)}
.in{width:100%;height:34px;margin-top:8px;padding:0 10px;border:0;border-radius:8px;background:var(--fill);font:400 13px/1 var(--sans);color:var(--ink);outline:none}
.pu{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;font-size:12.5px;color:var(--ink2)} .pu .dm{color:var(--ink3);margin-right:6px} .pu small{grid-column:1 / -1;font-size:11.5px;color:var(--ink3)}
@container (max-width:560px){.op{grid-template-columns:16px minmax(0,1fr) auto 22px;margin:0}.op .os,.op .nt,.op .hb{display:none}.op:not(:has(.nt)) .ty{grid-column:auto}.opx{padding-left:0}.tm-n{grid-template-columns:repeat(2,1fr)}.tm-a b{font-size:24px}.tg3{grid-template-columns:1fr}.opx-t > span:first-child{display:none}}
/* activity */

    return card("Warranty claim", "Op 2 · WARR", '<div class="wa"><span class="tag w">Not filed</span><span>Needs: failed part photo · cause · correction</span></div><div class="row"><button class="btn sm">Start the claim</button></div>'); } },
  customer: { n: "Customer", src: "RO list", d: "Who to call, and their other open ROs", r: function(){
    return card("Customer", "", '<div class="cu"><b>Prairie Line Trucking</b><small>Dale Harmon · dispatch · (336) 555-0142</small></div><div class="hr"><span class="mono">RO-37301</span><span><b>Unit T-290 · Working</b><small>Coolant leak at water pump</small></span></div>'); } }
};
var ORDER = ["band", "stages", "ops", "activity", "next", "schedule", "people", "vehicle", "paperwork", "money", "blocker", "parts", "photos", "history", "estimate", "timeline", "readiness", "inbox", "dtc", "warranty", "customer"];
var PRE = {
  today: { n: "As today", L: [], M: ["band", "stages", "ops", "activity"], R: ["next", "schedule", "people", "vehicle", "paperwork", "money"] },
  work: { n: "Work first", L: [], M: ["stages", "ops", "parts", "activity"], R: ["band", "next", "blocker", "people", "schedule", "vehicle", "money"] },
  three: { n: "Three columns", L: ["band", "vehicle", "people", "schedule", "history"], M: ["stages", "ops", "activity"], R: ["next", "blocker", "parts", "photos", "money"] },
  desk: { n: "Writer’s desk", L: [], M: ["band", "blocker", "estimate", "ops", "inbox"], R: ["next", "customer", "people", "schedule", "money", "paperwork"] }
};
var COLS = [["L", "Left"], ["M", "Middle"], ["R", "Right"]];
var V = { pre: "today", C: null, opv: "tabs", pic: "big", edit: true, note: "", hist: [], drawer: false, picks: false };
function setPre(k){ V.pre = k; V.C = { L: PRE[k].L.slice(), M: PRE[k].M.slice(), R: PRE[k].R.slice() }; }
setPre("today");
function where(k){ for(var c in V.C) if(V.C[c].indexOf(k) > -1) return c; return null; }
function snap(){ V.hist.push(JSON.stringify({ C: V.C, pre: V.pre, opv: V.opv, pic: V.pic })); if(V.hist.length > 40) V.hist.shift(); }
function undo(){ var h = V.hist.pop(); if(!h) return; var x = JSON.parse(h); V.C = x.C; V.pre = x.pre; V.opv = x.opv; V.pic = x.pic; draw(); toast("Undone"); }
function place(k, col, i){ snap(); for(var c in V.C){ var j = V.C[c].indexOf(k); if(j > -1) V.C[c].splice(j, 1); } if(col){ var L = V.C[col]; L.splice(i == null || i > L.length ? L.length : i, 0, k); } V.pre = null; draw(); }

/* ---------- drawing ---------- */
function tools(k, c, i){
  var L = V.C[c], ci = "LMR".indexOf(c);
  return '<div class="bt" role="toolbar" aria-label="' + esc(B[k].n) + '"><span class="grip" draggable="true" data-drag="' + k + '" title="Drag to move">' + ic("grip", 14) + '</span><b>' + esc(B[k].n) + "</b>"
    + '<button data-mv="L" data-k="' + k + '" title="To the column on the left"' + (ci === 0 ? " disabled" : "") + '>' + ic("chevL", 13) + "</button>"
    + '<button data-mv="U" data-k="' + k + '" title="Up"' + (i === 0 ? " disabled" : "") + '>' + ic("chevU", 13) + "</button>"
    + '<button data-mv="D" data-k="' + k + '" title="Down"' + (i === L.length - 1 ? " disabled" : "") + '>' + ic("chevD", 13) + "</button>"
    + '<button data-mv="R" data-k="' + k + '" title="To the column on the right"' + (ci === 2 ? " disabled" : "") + '>' + ic("chevR", 13) + "</button>"
    + '<button data-mv="X" data-k="' + k + '" title="Take it off the page">' + ic("x", 13) + "</button></div>"; }
function col(c){
  var L = V.C[c], show = L.length || c === "M" || D.body.classList.contains("dragging");
  if(!show) return "";
  return '<div class="col c' + c + (L.length ? "" : " empty") + '" data-col="' + c + '">' + L.map(function(k, i){ return '<div class="blk' + (B[k].now ? "" : " new") + '" data-k="' + k + '">' + (V.edit ? tools(k, c, i) : "") + B[k].r() + "</div>"; }).join("") + (L.length ? "" : '<div class="drop-hint">Drop a block here</div>') + "</div>"; }
function topbar(){
  return '<div class="tb0"><span class="crumb">RO list<i>/</i><b class="mono">RO-37218</b></span><button class="ib0" title="Previous">' + ic("chevU", 14) + '</button><button class="ib0" title="Next">' + ic("chevD", 14) + '</button><small>10 of 20</small><span class="sp"></span><span class="q">' + ic("clock", 14) + '<b class="mono">1.50</b> / 2.70 h</span><span class="q">' + ic("parts", 14) + '<b class="mono">0</b> / 2</span><span class="q">' + ic("clip", 14) + '<b class="mono">0</b></span><i class="sep"></i><button class="ib0">' + ic("link", 14) + '</button><button class="ib0">' + ic("print", 14) + '</button><button class="ib0">' + ic("more", 14) + "</button></div>"; }
function page(){
  var n = (V.C.L.length ? 1 : 0) + 2, three = V.C.L.length || (V.drawer && false);
  return topbar() + '<div class="cols' + (V.C.L.length || D.body.classList.contains("dragging") ? " three" : "") + (V.edit ? " editing" : "") + '">' + col("L") + col("M") + col("R") + "</div>"; }
function drawerHtml(){
  if(!V.drawer) return "";
  var row = function(k){ var w = where(k); return '<div class="dr-r' + (B[k].now ? "" : " new") + '"><div class="dr-t"><b>' + esc(B[k].n) + "</b>" + (B[k].now ? "" : '<span class="nw">New</span>') + "<small>" + esc(B[k].d) + (B[k].src ? " · from " + esc(B[k].src) : "") + '</small></div><div class="seg sm">' + COLS.map(function(c){ return '<button data-put="' + c[0] + '" data-k="' + k + '" aria-pressed="' + (w === c[0]) + '">' + c[1] + "</button>"; }).join("") + '<button data-put="" data-k="' + k + '" aria-pressed="' + (!w) + '">Off</button></div></div>'; };
  return '<aside class="dr" aria-label="Blocks"><div class="dr-h"><b>Blocks</b><small>Put each one where you want it</small><button class="x" data-dr="x" aria-label="Close">' + ic("x", 15) + '</button></div><div class="dr-g">On the RO page today</div>' + ORDER.filter(function(k){ return B[k].now; }).map(row).join("") + '<div class="dr-g">New — carried over from other pages</div>' + ORDER.filter(function(k){ return !B[k].now; }).map(row).join("") + "</aside>"; }
function draw(){
  var y = $("#pg") ? $("#pg").scrollTop : 0;
  $("#pg").innerHTML = page();
  $("#drw").innerHTML = drawerHtml();
  $("#pg").scrollTop = y;
  sync(); if(V.picks) pkDraw();
}
function sync(){
  $$("[data-pre]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-pre") === V.pre); });
  $$("[data-opv]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-opv") === V.opv); });
  $$("[data-pic]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-pic") === V.pic); });
  var th = D.documentElement.getAttribute("data-th"); $$("button[data-th]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-th") === th); });
  $("#edt").setAttribute("aria-pressed", V.edit); $("#blk-open").setAttribute("aria-pressed", V.drawer);
  $("#und").disabled = !V.hist.length;
}
function toast(m){ var t = $(".toast"); if(t) t.remove(); t = D.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = "<span>" + m + "</span>"; D.body.appendChild(t); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.remove(); }, 2600); }

/* ---------- your picks ---------- */
var OPV = { tabs: "Tabs — Time, Parts, Notes, Files (as today)", together: "Notes, time and parts together (like the Technician page)" };
var PIC = { big: "Big, in the band (as today)", small: "Small, beside the name", off: "No picture" };
function nm(L){ return L.length ? L.map(function(k){ return B[k].n; }).join(", ") : "—"; }
function pkText(){
  var on = [].concat(V.C.L, V.C.M, V.C.R), added = on.filter(function(k){ return !B[k].now; }), gone = ORDER.filter(function(k){ return B[k].now && on.indexOf(k) < 0; });
  return "Parsec · RO page — my picks\n· Started from: " + (V.pre ? PRE[V.pre].n : "my own layout") + "\n"
    + (V.C.L.length ? "· Left column: " + nm(V.C.L) + "\n" : "") + "· Middle: " + nm(V.C.M) + "\n· Right: " + nm(V.C.R) + "\n"
    + "· New blocks: " + (added.length ? added.map(function(k){ return B[k].n + " (" + { L: "left", M: "middle", R: "right" }[where(k)] + ")"; }).join(", ") : "none") + "\n"
    + "· Taken off: " + nm(gone) + "\n· An open operation shows: " + OPV[V.opv] + "\n· Truck picture: " + PIC[V.pic]
    + (V.note.trim() ? "\n· Notes: " + V.note.trim() : ""); }
function pkDraw(){ var w = $("#picks"); w.hidden = !V.picks; if(!V.picks) return;
  w.innerHTML = '<div class="pk-h"><b>Your picks</b><button class="x" data-pk="x" aria-label="Close">' + ic("x", 15) + "</button></div><pre>" + esc(pkText()) + '</pre><textarea id="pk-note" placeholder="Anything else to move, add or change?">' + esc(V.note) + '</textarea><button class="btn pri" data-pk="copy">' + ic("copy", 14) + "Copy — paste it in the chat</button>"; }

/* ---------- doing things ---------- */
D.addEventListener("click", function(e){
  var t = e.target, b;
  if((b = t.closest("[data-pre]"))){ snap(); setPre(b.getAttribute("data-pre")); draw(); return; }
  if((b = t.closest("[data-opv]"))){ snap(); V.opv = b.getAttribute("data-opv"); draw(); return; }
  if((b = t.closest("[data-pic]"))){ snap(); V.pic = b.getAttribute("data-pic"); draw(); return; }
  if((b = t.closest("button[data-th]"))){ D.documentElement.setAttribute("data-th", b.getAttribute("data-th")); sync(); return; }
  if((b = t.closest("#edt"))){ V.edit = !V.edit; draw(); return; }
  if((b = t.closest("#und"))){ undo(); return; }
  if((b = t.closest("#blk-open")) || t.closest("[data-dr]")){ V.drawer = !V.drawer && !t.closest("[data-dr]"); draw(); return; }
  if((b = t.closest("#pk-open"))){ V.picks = !V.picks; pkDraw(); return; }
  if((b = t.closest("[data-pk]"))){ var k0 = b.getAttribute("data-pk"); if(k0 === "x"){ V.picks = false; pkDraw(); } else { var tx = pkText(); try{ navigator.clipboard.writeText(tx).then(function(){ toast("Copied — paste it in the chat."); }, function(){ toast("Select the text and copy it."); }); }catch(x){ toast("Select the text and copy it."); } } return; }
  if((b = t.closest("[data-put]"))){ var k = b.getAttribute("data-k"), c = b.getAttribute("data-put"); if(where(k) === (c || null)) return; place(k, c || null); toast(c ? B[k].n + " → " + { L: "left", M: "middle", R: "right" }[c] : B[k].n + " is off the page"); return; }
  if((b = t.closest("[data-mv]"))){ if(b.disabled) return; var k2 = b.getAttribute("data-k"), m = b.getAttribute("data-mv"), c2 = where(k2), L = V.C[c2], i = L.indexOf(k2);
    if(m === "U") place(k2, c2, i - 1); else if(m === "D") place(k2, c2, i + 1);
    else if(m === "X"){ place(k2, null); toast(B[k2].n + " is off the page — Blocks brings it back."); }
    else { var ci = "LMR".indexOf(c2) + (m === "L" ? -1 : 1); if(ci < 0 || ci > 2) return; place(k2, "LMR"[ci], i); }
    var el = $('.blk[data-k="' + k2 + '"]'); if(el){ el.classList.add("moved"); setTimeout(function(){ el.classList.remove("moved"); }, 500); } return; }
});
D.addEventListener("input", function(e){ if(e.target.id === "pk-note"){ V.note = e.target.value; var p = $("#picks pre"); if(p) p.textContent = pkText(); } });
D.addEventListener("keydown", function(e){ if((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA/.test(e.target.tagName)){ e.preventDefault(); undo(); } if(e.key === "Escape"){ if(V.picks){ V.picks = false; pkDraw(); } else if(V.drawer){ V.drawer = false; draw(); } } });
/* drag a block by its grip: between the blocks of any column */
var DRAG = null;
D.addEventListener("dragstart", function(e){ var g = e.target.closest && e.target.closest("[data-drag]"); if(!g) return; DRAG = g.getAttribute("data-drag"); e.dataTransfer.setData("text/plain", DRAG); e.dataTransfer.effectAllowed = "move";
  try{ var blk = g.closest(".blk"); e.dataTransfer.setDragImage(blk, 20, 16); }catch(x){}
  setTimeout(function(){ D.body.classList.add("dragging"); var b = $('.blk[data-k="' + DRAG + '"]'); if(b) b.classList.add("lift"); if(!V.C.L.length){ $("#pg .cols").classList.add("three"); if(!$('[data-col="L"]')) $("#pg .cols").insertAdjacentHTML("afterbegin", '<div class="col cL empty" data-col="L"><div class="drop-hint">Drop a block here for a left column</div></div>'); } }, 0); });
function dropAt(e){ var c = e.target.closest && e.target.closest("[data-col]"); if(!c) return null; var bl = $$(".blk", c).filter(function(x){ return x.getAttribute("data-k") !== DRAG; }), i = bl.length;
  for(var j = 0; j < bl.length; j++){ var r = bl[j].getBoundingClientRect(); if(e.clientY < r.top + r.height / 2){ i = j; break; } } return { c: c, col: c.getAttribute("data-col"), i: i, bl: bl }; }
D.addEventListener("dragover", function(e){ if(!DRAG) return; var d = dropAt(e); if(!d) return; e.preventDefault(); var m = $(".dmark"); if(!m){ m = D.createElement("div"); m.className = "dmark"; }
  if(d.i < d.bl.length) d.bl[d.i].parentNode.insertBefore(m, d.bl[d.i]); else d.c.appendChild(m); });
D.addEventListener("drop", function(e){ if(!DRAG) return; var d = dropAt(e); if(!d) return; e.preventDefault(); var k = DRAG; DRAG = null; D.body.classList.remove("dragging"); var m = $(".dmark"); if(m) m.remove();
  /* the index among the column's blocks without the one being moved */
  place(k, d.col, d.i); toast(B[k].n + " moved"); });
D.addEventListener("dragend", function(){ var was = DRAG; DRAG = null; D.body.classList.remove("dragging"); var m = $(".dmark"); if(m) m.remove(); if(was) draw(); });
draw();
})();
</script>
</body></html>

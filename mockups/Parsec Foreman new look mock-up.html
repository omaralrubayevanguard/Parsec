<meta name="claude:viewport-fit-sides" content="cover">
<title>Parsec Foreman Mock-up</title>
<style>
/* Layout: the Foreman page as the shop will see it (what needs you on the left, the floor on the right); beside it, a rail that shows what each skill changed. Dark only, by choice. */
:root{color-scheme:dark;
  /* reference: the raw palette (Carbon with Charcoal, lightest) */
  --carbon-950:#141414;--carbon-900:#1b1b1b;--carbon-800:#2f2f2f;--carbon-700:#3d3d3d;--carbon-600:#4a4a4a;--carbon-500:#6e6e6e;
  --platinum-100:#f0f2f4;--platinum-300:#cbcdcf;--platinum-500:#a7a9ab;
  --cobalt-300:#93bbff;--cobalt-400:#72a6ff;--cobalt-ink:#0f0f11;
  --green-400:#76cf8a;--amber-400:#efba64;--teal-400:#6bcac9;--violet-400:#bb99e3;--red-400:#ef675c;--red-300:#ff9389;--white-200:#e3e8ee;
  /* semantic: what each value is for */
  --surface-ground:var(--carbon-900);--surface-card:var(--carbon-800);--surface-raised:var(--carbon-700);--surface-well:var(--carbon-950);
  --border:var(--carbon-600);--border-strong:var(--carbon-500);
  --text:var(--platinum-100);--text-2:var(--platinum-300);--text-3:var(--platinum-500);
  --action:var(--cobalt-400);--action-hover:var(--cobalt-300);--on-action:var(--cobalt-ink);
  --surface-card-hover:#363636;--surface-raised-hover:#484848;--surface-top:var(--carbon-600);--surface-top-hover:#585858;--tint:rgba(255,255,255,.08);--ink-on-light:#161616;--ink-on-light-hover:#333;--status-alert-dim:#b9453c;
  --status-working:var(--green-400);--status-waiting:var(--amber-400);--status-customer:var(--teal-400);--status-support:var(--violet-400);--status-alert:var(--red-400);--status-done:var(--white-200);--text-alert:var(--red-300);
  /* scales */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r1:7px;--r2:10px;--r3:14px;
  --t-fast:120ms;--t:200ms;--t-slow:340ms;--ease:cubic-bezier(.2,.8,.2,1);
  --f:"Segoe UI",system-ui,-apple-system,sans-serif;--fd:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --fs-1:12px;--fs-2:13px;--fs-3:14px;--fs-4:16px;--fs-5:20px;--fs-6:30px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface-ground);color:var(--text);font:400 var(--fs-2)/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:var(--r1)}
.page{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:var(--s5);max-width:1500px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{min-width:0;display:grid;gap:var(--s4);align-content:start}
.skip{position:absolute;left:-9999px}.skip:focus{position:static;justify-self:start;padding:6px 10px;background:var(--surface-raised);border-radius:var(--r1);color:var(--text)}
.fig{font-family:var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.no{font:500 16px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- Button: primary (.p), plain, quiet (.q), small (.sm), hold (.hold) ---- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:var(--r1);background:var(--surface-raised);color:var(--text);font-size:var(--fs-2);font-weight:600;white-space:nowrap;position:relative;overflow:hidden;user-select:none;transition:transform var(--t-fast) var(--ease),background-color var(--t),box-shadow var(--t)}
.btn:hover{background:var(--surface-raised-hover)}.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.btn.p{background:var(--action);color:var(--on-action)}.btn.p:hover{background:var(--action-hover)}
.btn.q{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}.btn.q:hover{background:var(--tint);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn.sm{min-height:28px;padding:0 10px;font-size:var(--fs-1)}
.btn.ib{padding:0;width:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.hold::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--status-alert) 38%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .16s linear}
.btn.hold.going::before{transition:transform .9s linear;transform:scaleX(1)}
.btn.hold>*{position:relative}
kbd{font:600 10.5px/1 var(--f);padding:3px 4px;border-radius:4px;background:rgba(0,0,0,.3);color:var(--text-2)}
.btn.p kbd{background:rgba(0,0,0,.16);color:var(--on-action)}
[data-keys="off"] kbd.h{display:none}

/* ---- Lamp: one status mark everywhere; a shape and a colour ---- */
.lamp{flex:none;display:inline-grid;place-items:center;width:14px;height:14px;color:var(--lc,var(--text-3))}
.lamp svg{width:12px;height:12px;fill:currentColor;filter:drop-shadow(0 0 4px color-mix(in srgb,currentColor 45%,transparent))}
.lamp[data-t="working"]{--lc:var(--status-working)}.lamp[data-t="waiting"]{--lc:var(--status-waiting)}.lamp[data-t="customer"]{--lc:var(--status-customer)}
.lamp[data-t="support"]{--lc:var(--status-support)}.lamp[data-t="alert"]{--lc:var(--status-alert)}.lamp[data-t="done"]{--lc:var(--status-done)}
.lamp[data-t="off"] svg{fill:none;stroke:var(--text-3);stroke-width:1.6;filter:none}
.lamp.live svg{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5;transform:scale(.86)}}
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-1);font-weight:600;color:var(--text-2);white-space:nowrap}

/* ---- header ---- */
.hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s3) var(--s5)}
.hd h1{font:600 22px/1.1 var(--f)}
.hd-r{display:flex;align-items:center;gap:var(--s2)}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fact{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;min-height:32px;padding:5px 10px;border-radius:var(--r1);color:var(--text-2);font-size:var(--fs-1);transition:background-color var(--t),color var(--t),transform var(--t-fast)}
.fact b{font:500 17px/1 var(--fd);color:var(--text);font-variant-numeric:tabular-nums;display:inline-block}
.fact:hover{background:var(--surface-card)}.fact:active{transform:scale(.96)}
.fact[aria-pressed="true"]{background:var(--text);color:var(--surface-ground)}.fact[aria-pressed="true"] b{color:var(--surface-ground)}
.fact.s{cursor:default}.fact.s:hover{background:none}.fact.s:active{transform:none}
.fact b.tick{animation:tick .5s var(--ease)}
@keyframes tick{0%{transform:translateY(-70%);opacity:0}60%{transform:translateY(8%)}100%{transform:none;opacity:1}}
.tabs{position:relative;display:flex;gap:2px;padding:3px;border-radius:var(--r2);background:var(--surface-well);justify-self:start;max-width:100%;overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 13px;border-radius:var(--r1);color:var(--text-3);font-size:var(--fs-2);font-weight:600;white-space:nowrap;transition:color var(--t)}
.tabs button:hover{color:var(--text)}.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button:focus-visible{outline:2px solid var(--action);outline-offset:-2px}
.tabs i.ind{position:absolute;top:3px;left:0;height:calc(100% - 6px);border-radius:var(--r1);background:var(--surface-raised);transition:transform var(--t-slow) var(--ease),width var(--t-slow) var(--ease)}
.bar2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3)}

/* ---- body ---- */
.body{display:grid;grid-template-columns:320px minmax(0,1fr);gap:var(--s4);align-items:start}
.h2{display:flex;align-items:center;gap:8px;font:600 var(--fs-2)/1.2 var(--f);color:var(--text-2);margin-bottom:var(--s2)}
.h2 .ct{font:500 14px/1 var(--fd);color:var(--text);padding:3px 7px;border-radius:999px;background:var(--surface-card)}
.h2 small{margin-left:auto;font-weight:400;color:var(--text-3)}
.grp{margin:var(--s3) 0 5px;font-size:var(--fs-1);font-weight:600;color:var(--text-3)}
.grp:first-of-type{margin-top:0}
.needs ul{display:grid;gap:6px}
.need{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 12px;border-radius:var(--r2);background:var(--surface-card);cursor:pointer;transition:background-color var(--t),box-shadow var(--t),opacity var(--t),transform var(--t) var(--ease)}
.need:hover{background:var(--surface-card-hover)}
.need.on{background:var(--surface-raised);box-shadow:0 0 0 1px var(--border-strong)}
.need:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:var(--r2)}
.need .ic{grid-row:1/3;align-self:start;margin-top:1px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-well);color:var(--text-2)}
.need.on .ic{background:var(--surface-ground)}
.need .t{display:flex;align-items:baseline;gap:8px;min-width:0}
.need .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.need p{grid-column:2;color:var(--text-2);font-size:var(--fs-1)}
.need .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.need .more{display:none}.need.on .more,.need:focus-within .more{display:inline-flex;animation:fadein var(--t) var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateX(-4px)}}
.need.out{opacity:0;transform:translateX(18px) scale(.98)}
.need.drag{opacity:.35}
.tk{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:24px;height:24px;margin:-2px -4px -2px auto;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--border-strong);transition:background-color var(--t),box-shadow var(--t),transform var(--t-fast)}
.tk:active{transform:scale(.85)}.tk svg{width:14px;height:14px;stroke:var(--on-action);stroke-width:2.4;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset var(--t-slow) var(--ease)}
.tk[aria-pressed="true"],.tk[aria-checked="true"]{background:var(--action);box-shadow:none}.tk[aria-pressed="true"] svg,.tk[aria-checked="true"] svg{stroke-dashoffset:0}
.batch{position:sticky;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 8px 8px 12px;border-radius:var(--r2);background:var(--surface-raised);box-shadow:0 0 0 1px var(--border-strong),0 14px 28px -12px #000;font-weight:600;animation:rise var(--t-slow) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.clear{padding:22px 14px;border-radius:var(--r2);background:var(--surface-card);text-align:center;color:var(--text-2)}
.clear b{display:block;font-size:var(--fs-4);color:var(--text);margin-bottom:2px}
.clear svg{width:30px;height:30px;stroke:var(--status-working);stroke-width:2;fill:none;margin-bottom:6px;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
details.done{margin-top:var(--s3)}
details.done summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;min-height:28px;color:var(--text-3);font-size:var(--fs-1);font-weight:600;border-radius:var(--r1)}
details.done summary::-webkit-details-marker{display:none}
details.done summary svg{transition:transform var(--t) var(--ease)}details.done[open] summary svg{transform:rotate(90deg)}
.dn{display:flex;align-items:center;gap:8px;padding:6px 0 6px 2px;color:var(--text-2);font-size:var(--fs-1)}
.dn span{flex:1;min-width:0}

/* ---- the selected RO ---- */
.main{min-width:0;display:grid;gap:var(--s4)}
.main.vin>*{animation:vin var(--t-slow) var(--ease) backwards}.main.vin>*:nth-child(2){animation-delay:50ms}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.sel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s3) var(--s5);padding:var(--s4);border-radius:var(--r3);background:var(--surface-card)}
.sel.flash{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--action)}100%{box-shadow:0 0 0 2px transparent}}
.sel-h{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.sel-h .big{font:500 var(--fs-6)/1 var(--fd);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sel h2{font:600 var(--fs-4)/1.25 var(--f);margin-top:8px;text-wrap:balance}
.sel .sub{color:var(--text-2);margin-top:2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s3)}
.kv div{min-width:0}.kv small{display:block;color:var(--text-3);font-size:var(--fs-1)}.kv b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-r{display:grid;gap:var(--s3);align-content:start}
.hrs-t{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-1);color:var(--text-2)}.hrs-t b{font:500 16px/1 var(--fd);color:var(--text)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--border);margin-top:6px}
.meter u{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--text);transition:width .6s var(--ease)}
.meter u.over{background:repeating-linear-gradient(135deg,var(--status-alert) 0 4px,var(--status-alert-dim) 4px 8px)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--text)}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}.segs i{height:4px;border-radius:2px;background:var(--border)}.segs i.d{background:var(--text-3)}.segs i.n{background:var(--text)}
.sel small.cap{font-size:var(--fs-1);color:var(--text-3)}.sel small.cap b{color:var(--text);font-weight:600}
.over{color:var(--text-alert);font-weight:600}
.sel-a{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding-top:var(--s3);border-top:1px solid var(--border)}

/* ---- Floor: the bay board ---- */
.board{position:relative;display:grid;gap:6px}
.axis,.bay{display:grid;grid-template-columns:68px minmax(140px,200px) minmax(0,1fr) 100px;gap:var(--s3);align-items:center}
.axis{font-size:11px;color:var(--text-3);padding:0 var(--s3)}
.axis .ticks{position:relative;height:16px}.axis .ticks span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--fd);font-variant-numeric:tabular-nums}
.axis .ticks .nowl{color:var(--on-action);background:var(--action);padding:1px 5px;border-radius:4px;font-weight:600;z-index:1;transition:left 1s linear}
.bay{padding:8px var(--s3);min-height:56px;border-radius:var(--r2);background:var(--surface-card);transition:background-color var(--t),box-shadow var(--t),transform var(--t) var(--ease)}
.bay-n{display:flex;align-items:baseline;gap:6px}.bay-n b{font:500 22px/1 var(--fd)}.bay-n small{color:var(--text-3);font-size:var(--fs-1)}
.truck{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:2px 8px;min-height:40px;padding:5px 10px;border-radius:var(--r1);background:var(--surface-raised);transition:transform var(--t-fast) var(--ease),background-color var(--t),box-shadow var(--t)}
.truck:hover{background:var(--surface-raised-hover)}.truck:active{transform:scale(.98)}
.truck[aria-current="true"]{box-shadow:0 0 0 1.5px var(--text)}
.truck small{grid-column:1/-1;color:var(--text-2);font-size:var(--fs-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.truck.in{animation:dropin .5s var(--ease)}
@keyframes dropin{0%{opacity:0;transform:translateY(-12px) scale(.96)}60%{transform:translateY(2px)}}
.av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-well);color:var(--text-2);display:inline-grid;place-items:center;font:600 10px/1 var(--f);font-style:normal}
.av.lg{width:36px;height:36px;font-size:12px}
.empty{color:var(--text-3);font-size:var(--fs-1)}
.strip{position:relative;height:22px;border-radius:5px;background:var(--surface-well);overflow:hidden}
.strip .lunch{position:absolute;top:0;bottom:0;background:var(--tint)}
.strip u{position:absolute;top:4px;bottom:4px;border-radius:3px;background:var(--text-3);transition:left var(--t-slow) var(--ease),width var(--t-slow) var(--ease)}
.strip u.done{background:var(--carbon-500)}
.strip u.late{background:repeating-linear-gradient(135deg,var(--status-alert) 0 4px,var(--status-alert-dim) 4px 8px);border-radius:0 3px 3px 0}
.strip u.grow{animation:grow .6s var(--ease)}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}}
.strip s{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--action);transition:left 1s linear}
.free{font-size:var(--fs-1);color:var(--text-2);text-align:right;white-space:nowrap}.free b{font:500 15px/1 var(--fd);color:var(--text)}
[data-drop].can{box-shadow:0 0 0 1.5px var(--action);background:color-mix(in srgb,var(--action) 10%,var(--surface-card))}
[data-drop].cant{opacity:.45}
[data-drop].hot{transform:scale(1.012);background:color-mix(in srgb,var(--action) 22%,var(--surface-card))}
.ghost{position:fixed;z-index:60;pointer-events:none;padding:6px 10px;border-radius:var(--r1);background:var(--surface-raised);box-shadow:0 0 0 1px var(--border-strong),0 18px 30px -10px #000;font-weight:600;transform:rotate(-2deg);display:flex;gap:8px;align-items:center}

/* ---- Techs ---- */
.techs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--s3)}
.tech{display:grid;gap:var(--s3);padding:var(--s4);border-radius:var(--r3);background:var(--surface-card);transition:background-color var(--t),box-shadow var(--t),transform var(--t) var(--ease)}
.tech-h{display:flex;align-items:center;gap:10px}.tech-h b{display:block;font-size:var(--fs-3)}.tech-h small{display:block;color:var(--text-3);font-size:var(--fs-1)}
.tech-s{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tech-s .fig{font-size:20px;font-weight:500}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:6px}.cells i{height:8px;border-radius:2px;background:var(--border);transition:background-color var(--t-slow)}.cells i.on{background:var(--text)}.cells i.half{background:linear-gradient(90deg,var(--text) 50%,var(--border) 50%)}
.q{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 9px;border-radius:var(--r1);background:var(--surface-raised);transition:transform var(--t-fast) var(--ease),background-color var(--t),box-shadow var(--t)}
.chip:hover{background:var(--surface-raised-hover)}.chip:active{transform:scale(.95)}.chip[aria-current="true"]{box-shadow:0 0 0 1.5px var(--text)}
.chip.in{animation:dropin .5s var(--ease)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:var(--s3);border-top:1px solid var(--border)}
.nums small{display:block;color:var(--text-3);font-size:11.5px}.nums b{font:500 17px/1.2 var(--fd)}

/* ---- Yard ---- */
.yard{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:5px;padding:var(--s3);border-radius:var(--r3);background:var(--surface-card);align-items:center}
.yard .rw{font:500 14px/1 var(--fd);color:var(--text-3)}
.spot{position:relative;min-height:50px;border-radius:var(--r1);background:var(--surface-well);display:grid;place-items:center;transition:background-color var(--t),box-shadow var(--t),transform var(--t) var(--ease)}
.spot>small{position:absolute;top:3px;left:5px;font:500 10.5px/1 var(--fd);color:var(--text-3)}
.spot .chip{min-height:28px;padding:0 6px;margin-top:8px;gap:4px}

/* ---- Tomorrow ---- */
.tmr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.card{padding:var(--s4);border-radius:var(--r3);background:var(--surface-card)}
.plan{display:grid;gap:6px;counter-reset:n}
.pl{counter-increment:n;display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:var(--r2);background:var(--surface-raised);transition:transform var(--t-slow) var(--ease)}

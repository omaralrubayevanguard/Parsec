<!doctype html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec · Settings and automations</title>
<style>
/* ---------- tokens: two themes (rename to the app's own, e.g. Ivory / Graphite) ---------- */
:root,[data-th="light"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--warn:#AD7210;--bad:#C0503F;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="dark"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--warn:#E2A84C;--bad:#EC7F6C;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Inter","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* ---------- the frame (prefix ip- so the drawn visuals' classes can't collide) ---------- */
.ip-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.ip-bar h1{margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;font:500 19px/24px var(--serif)}
.ip-bar h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ip-jump{display:flex;gap:2px;flex-wrap:wrap} .ip-jump a{padding:4px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);text-decoration:none} .ip-jump a:hover{background:var(--fill)}
.ip-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.ip-seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)} .ip-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.ip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--sans)}
.ip-btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .ip-btn em{font-style:normal;opacity:.7;font-size:11px}
.ip-btn:focus-visible,.ip-opt:focus-visible,.ip-seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ip-wrap{max-width:1500px;margin:0 auto;padding:18px 16px 120px}
.ip-now{margin:0 0 20px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)} .ip-now h2{margin:0 0 8px;font:500 15px/1 var(--serif)}
.ip-lead{margin:0 2px 18px;color:var(--ink2)}
.ip-sec{margin:0 0 26px;scroll-margin-top:64px} .ip-sec h2{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font:500 22px/28px var(--serif)} .ip-sec h2 small{font:400 12.5px var(--sans);color:var(--ink3)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px} @media (max-width:980px){.ip-grid{grid-template-columns:1fr}}
.ip-idea{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.ip-idea.picked{box-shadow:0 0 0 1.5px var(--accl),var(--shadow)}
.ip-idea h3{margin:0;font:600 15px/20px var(--sans)} .ip-idea header p{margin:3px 0 0;font-size:12.5px;line-height:17px;color:var(--ink3)}
.ip-vis{position:relative;min-height:96px;padding:12px;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;overflow:hidden}
.ip-replay{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;z-index:5;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink3);font-size:11px}
.ip-ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px}
.ip-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:16px;color:var(--ink2)}
.ip-opt:hover{background:var(--fill)} .ip-opt i{width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.ip-opt b{display:block;font-weight:500;color:var(--ink)} .ip-opt small{display:block;font-size:11.5px;color:var(--ink3)}
.ip-opt[aria-pressed="true"]{background:var(--acct)} .ip-opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
#ip-picks{position:fixed;z-index:85;right:16px;top:62px;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#ip-picks[hidden]{display:none}
#ip-picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);white-space:pre-wrap}
#ip-picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font-size:13px;resize:vertical;outline:none}
.ip-ph{display:flex;align-items:center;font:500 18px/1 var(--serif)} .ip-ph b{flex:1;font-weight:500} .ip-ph button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.ip-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise)}
@media (max-width:640px){ .ip-grid{grid-template-columns:1fr} #ip-picks{left:16px;right:16px;width:auto} .ip-bar h1 small{display:none} }

/* ---------- the drawn visuals (v-) · each stage animates with [data-step] on .ip-vis ---------- */
.ip-vis{padding:0}
.v-st{position:relative;height:230px;padding:12px;overflow:hidden;font-size:12px}
.v-st.h-s{height:190px} .v-st.h-l{height:270px}
.v-cur{position:absolute;left:calc(100% - 30px);top:calc(100% - 26px);width:14px;height:14px;z-index:20;pointer-events:none;transition:left .55s cubic-bezier(.2,.75,.25,1),top .55s cubic-bezier(.2,.75,.25,1)}
.v-cur::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,64% 94%,44% 66%,80% 66%);background:var(--ink);filter:drop-shadow(0 0 1px var(--raised))}
.v-cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.3)}
[data-step^="c-"] .v-cur::after{animation:v-ripple .45s ease-out}
@keyframes v-ripple{0%{opacity:.4;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.v-b{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 11.5px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.v-b.pri{background:var(--primary);color:var(--onprimary);box-shadow:none}
.v-ic{width:13px;height:13px;flex:none}
.v-t2,.v-t3,.v-t4{display:none}
.v-pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--fill);color:var(--ink2);transition:background .3s,color .3s}
.v-pill::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.v-pill.wait{background:color-mix(in srgb,var(--warn) 14%,var(--panel));color:var(--warn)} .v-pill.good{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)} .v-pill.cust{background:color-mix(in srgb,#2F8795 14%,var(--panel));color:#2F8795}
.v-row{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:6px;font-size:12px}
.v-row .sp{flex:1} .v-row .m{font:500 11px var(--mono);color:var(--ink3)} .v-row b{font-weight:600}
/* the inbox ping — slides in bottom right */
.v-ping{position:absolute;right:12px;bottom:12px;z-index:10;width:270px;max-width:calc(100% - 24px);padding:9px 11px;border-radius:12px;background:var(--primary);color:var(--onprimary);box-shadow:var(--raise);opacity:0;transform:translateX(22px);transition:opacity .3s,transform .3s}
.v-ping b{display:block;font-size:12px} .v-ping small{display:block;margin-top:1px;font-size:11px;opacity:.75;line-height:15px} .v-ping .v-to{position:absolute;right:10px;top:8px;font-size:10px;opacity:.6}
[data-step="ping"] .v-ping{opacity:1;transform:none}
/* parts (a1) */
[data-step="in"] .v-pst .v-t1,[data-step="move"] .v-pst .v-t1,[data-step="ping"] .v-pst .v-t1{display:none} [data-step="in"] .v-pst .v-t2,[data-step="move"] .v-pst .v-t2,[data-step="ping"] .v-pst .v-t2{display:inline}
[data-step="in"] .v-pst,[data-step="move"] .v-pst,[data-step="ping"] .v-pst{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)}
[data-step="move"] .v-ost .v-t1,[data-step="ping"] .v-ost .v-t1{display:none} [data-step="move"] .v-ost .v-t2,[data-step="ping"] .v-ost .v-t2{display:inline}
[data-step="move"] .v-ost,[data-step="ping"] .v-ost{background:var(--fill);color:var(--ink2)}
/* waiting on the customer (a2) */
.v-w{font:500 11px var(--mono);color:var(--ink3)} .v-w span{display:none}
[data-step="w1"] .v-w .q1,[data-step="w2"] .v-w .q2,[data-step="w3"] .v-w .q3,[data-step="ping"] .v-w .q3{display:inline}
[data-step="w3"] .v-w,[data-step="ping"] .v-w{color:var(--bad);font-weight:700}
.v-clock{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);position:relative;vertical-align:-3px;margin-right:4px}
.v-clock::after{content:"";position:absolute;left:6px;top:2px;width:1.5px;height:5px;background:var(--ink3);transform-origin:50% 100%;animation:v-tick 1.2s linear infinite}
@keyframes v-tick{to{transform:rotate(360deg)}}
/* ready to release (a3) */
.v-board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v-col{min-height:120px;padding:6px;border-radius:10px;background:var(--fill)} .v-col h6{margin:0 0 6px;font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.v-card{padding:7px 9px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);font-size:11.5px;transition:opacity .35s,transform .35s}
.v-card b{display:block;font-weight:600} .v-ck{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap} .v-ck span{font-size:10.5px;color:var(--ink3)} .v-ck span i{font-style:normal;color:var(--ink4,var(--ink3));margin-right:2px}
[data-step="c1"] .v-ck .k1 i,[data-step="c2"] .v-ck .k1 i,[data-step="c2"] .v-ck .k2 i,[data-step="rt"] .v-ck i,[data-step="move"] .v-ck i,[data-step="ping"] .v-ck i{color:var(--good)}
[data-step="c1"] .v-ck .k1,[data-step="c2"] .v-ck .k1,[data-step="c2"] .v-ck .k2,[data-step="rt"] .v-ck span,[data-step="move"] .v-ck span,[data-step="ping"] .v-ck span{color:var(--good)}
.v-card.dst{opacity:0;transform:translateX(-14px)} [data-step="move"] .v-card.src,[data-step="ping"] .v-card.src{opacity:0;transform:translateX(14px)} [data-step="move"] .v-card.dst,[data-step="ping"] .v-card.dst{opacity:1;transform:none}
/* parts not in (a4) */
.v-ask{position:absolute;left:12px;right:12px;top:84px;z-index:9;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:var(--raise);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
.v-ask b{display:block;font-size:12.5px} .v-ask small{display:block;margin:2px 0 8px;font-size:11px;color:var(--ink3)} .v-ask .v-r{display:flex;gap:6px;flex-wrap:wrap}
[data-step="ask"] .v-ask{opacity:1;transform:none}
.ip-idea[data-k="noparts"] [data-step="p-st"] .v-cur,.ip-idea[data-k="noparts"] [data-step="c-st"] .v-cur{left:calc(100% - 46px);top:24px}
[data-step="c-st"] .v-start{filter:brightness(1.3)}
/* over the quote (a5) */
.v-bar{position:relative;height:16px;margin:28px 0 10px;border-radius:6px;background:var(--fill)}
.v-bar i{position:absolute;left:0;top:0;bottom:0;width:20%;border-radius:6px;background:var(--good);transition:width .9s linear,background .3s}
.v-bar .v-q{position:absolute;left:80%;top:-8px;bottom:-8px;border-left:2px dashed var(--ink2)} .v-bar .v-q em{position:absolute;bottom:100%;left:-2px;font-size:10.5px;font-style:normal;white-space:nowrap;color:var(--ink2);background:var(--canvas);padding:0 3px}
[data-step="g1"] .v-bar i{width:55%} [data-step="g2"] .v-bar i{width:78%} [data-step="g3"] .v-bar i,[data-step="ping"] .v-bar i{width:94%;background:var(--warn)}
.v-num{font:500 20px/1 var(--serif)} .v-num span{display:none} [data-step="idle"] .v-num .n0,[data-step="g1"] .v-num .n1,[data-step="g2"] .v-num .n2,[data-step="g3"] .v-num .n3,[data-step="ping"] .v-num .n3{display:inline}
[data-step="g3"] .v-num,[data-step="ping"] .v-num{color:var(--warn)}
/* warranty (a6) */
.v-days{position:relative;height:64px;margin:22px 4px 8px}
.v-days .ln{position:absolute;left:0;right:0;top:20px;height:3px;border-radius:2px;background:var(--fill)}
.v-days .pr{position:absolute;left:0;top:20px;height:3px;width:0;border-radius:2px;background:var(--acc);transition:width .9s linear}
.v-dm{position:absolute;top:12px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--border);transition:box-shadow .3s,background .3s}
.v-dm em{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:10.5px;font-style:normal;white-space:nowrap;color:var(--ink3)}
[data-step="sub"] .v-dm.d0,[data-step="d3"] .v-dm.d0,[data-step="d7"] .v-dm.d0,[data-step="ping"] .v-dm.d0{box-shadow:inset 0 0 0 5px var(--acc)}
[data-step="d3"] .v-days .pr{width:40%} [data-step="d7"] .v-days .pr,[data-step="ping"] .v-days .pr{width:86%}
[data-step="d3"] .v-dm.d3,[data-step="d7"] .v-dm.d3,[data-step="ping"] .v-dm.d3{box-shadow:inset 0 0 0 5px var(--acc)}
[data-step="d7"] .v-dm.d7,[data-step="ping"] .v-dm.d7{box-shadow:inset 0 0 0 5px var(--bad)} [data-step="d7"] .v-dm.d7 em,[data-step="ping"] .v-dm.d7 em{color:var(--bad);font-weight:600}
/* the sentence builder (a7) */
.v-sent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;line-height:26px;font-size:12.5px}
.v-sent .w{color:var(--ink3);font-weight:600} .v-sent .c{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;background:var(--acct);color:var(--acc);font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
[data-step="s1"] .c1,[data-step="s2"] .c1,[data-step="s2"] .c2,[data-step="s3"] .c1,[data-step="s3"] .c2,[data-step="s3"] .c3,[data-step="s4"] .c,[data-step="p-test"] .c,[data-step="c-test"] .c,[data-step="res"] .c{opacity:1;transform:none}
.v-sent .w{opacity:.35;transition:opacity .25s} [data-step="s1"] .w1,[data-step="s2"] .w1,[data-step="s2"] .w2,[data-step="s3"] .w1,[data-step="s3"] .w2,[data-step="s3"] .w3,[data-step="s4"] .w,[data-step="p-test"] .w,[data-step="c-test"] .w,[data-step="res"] .w{opacity:1}
.v-test{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-res{margin-top:8px;padding:7px 10px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);font-size:11.5px;line-height:17px;opacity:0;transition:opacity .3s}
[data-step="res"] .v-res{opacity:1}
.ip-idea[data-k="builder"] [data-step="p-test"] .v-cur,.ip-idea[data-k="builder"] [data-step="c-test"] .v-cur,.ip-idea[data-k="builder"] [data-step="res"] .v-cur{left:96px;top:132px}
/* the log (a8, s8) */
.v-log{display:flex;flex-direction:column;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.v-log h6{margin:0;padding:6px 10px;font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);box-shadow:inset 0 -1px 0 var(--hair)}
.v-lr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:32px;padding:0 10px;box-shadow:inset 0 -1px 0 var(--hair);font-size:11.5px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s,background .3s}
.v-lr:last-child{box-shadow:none} .v-lr .t{font:500 10.5px var(--mono);color:var(--ink3)} .v-lr .x{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v-lr .u{font-size:11px;font-weight:600;color:var(--acc)}
.v-lr .u .v-t2{color:var(--ink3);font-weight:500}
[data-step="rows"] .v-lr,[data-step="p-un"] .v-lr,[data-step="c-un"] .v-lr,[data-step="done"] .v-lr{opacity:1;transform:none}
[data-step="rows"] .v-lr:nth-child(3){transition-delay:.12s} [data-step="rows"] .v-lr:nth-child(4){transition-delay:.24s}
[data-step="done"] .v-lr.un{background:var(--fill)} [data-step="done"] .v-lr.un .x{text-decoration:line-through;color:var(--ink3)} [data-step="done"] .v-lr.un .u .v-t1{display:none} [data-step="done"] .v-lr.un .u .v-t2{display:inline}
.ip-idea[data-k="log"] [data-step="p-un"] .v-cur,.ip-idea[data-k="log"] [data-step="c-un"] .v-cur{left:calc(100% - 40px);top:94px}
.ip-idea[data-k="history"] [data-step="p-un"] .v-cur,.ip-idea[data-k="history"] [data-step="c-un"] .v-cur{left:calc(100% - 40px);top:62px}
/* one settings page (s1) */
.v-tile{position:absolute;padding:5px 9px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow);font-size:11px;white-space:nowrap;transition:left .6s cubic-bezier(.2,.75,.25,1),top .6s cubic-bezier(.2,.75,.25,1),opacity .4s,transform .6s}
[data-step="conv"] .v-tile,[data-step="page"] .v-tile{left:44%!important;top:42%!important;opacity:.0;transform:scale(.6)}
.v-pg{position:absolute;left:12px;right:12px;top:12px;bottom:12px;border-radius:12px;background:var(--panel);box-shadow:var(--raise);padding:10px 12px;opacity:0;transform:scale(.96);transition:opacity .35s,transform .35s}
[data-step="page"] .v-pg{opacity:1;transform:none}
.v-pg h5{margin:0 0 8px;font:500 15px var(--serif)} .v-gr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 0;box-shadow:inset 0 -1px 0 var(--hair);font-size:11.5px}
.v-gr:last-child{box-shadow:none} .v-gr b{font-weight:600} .v-gr span{color:var(--ink3);font-size:11px;line-height:15px}
/* groups (s2) */
.v-acc{display:flex;flex-direction:column;gap:5px}
.v-ah{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);font-size:12px;transition:box-shadow .25s}
.v-ah b{font-weight:600;flex:none;width:118px} .v-ah span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink3);font-size:11px;opacity:.45;transition:opacity .25s}

/* ---------- the page ---------- */
var D = document, $ = function (s, r) { return (r || D).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || D).querySelectorAll(s)); };
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var V = { th: 'light', open: false, v: {}, note: '' };
try { var sv = JSON.parse(localStorage.getItem(KEY) || '{}'); if (sv.v) V.v = sv.v; if (sv.note) V.note = sv.note; if (sv.th) V.th = sv.th; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: V.v, note: V.note, th: V.th })); } catch (e) {} }
var total = IDEAS.reduce(function (a, g) { return a + g.items.length; }, 0);
$('#ip-lead').textContent = total + ' idea' + (total === 1 ? '' : 's') + ' for the automations and the Settings page — the Assistant and the time-stamp automation are gone. Pick an option on each, or Skip, then copy Your picks into the chat.';
$('#ip-jump').innerHTML = IDEAS.map(function (g, i) { return '<a href="#ip-s' + i + '">' + esc(g.group) + '</a>'; }).join('');
$('#ip-secs').innerHTML = IDEAS.map(function (g, i) {
  return '<section class="ip-sec" id="ip-s' + i + '"><h2>' + esc(g.group) + ' <small>' + g.items.length + ' idea' + (g.items.length > 1 ? 's' : '') + '</small></h2><div class="ip-grid">' + g.items.map(function (it) {
    var o = it.opts.concat([['skip', 'Skip', '']]);
    return '<article class="ip-idea" data-k="' + it.k + '"><header><h3>' + esc(it.t) + '</h3><p>' + esc(it.why) + '</p></header><div class="ip-vis" data-step="' + (it.steps ? it.steps[0][0] : '') + '">' + it.vis + (it.steps ? '<button class="ip-replay" aria-label="Play it again" title="Play it again">↻</button>' : '') + '</div><div class="ip-ol">' +
      o.map(function (x) { return '<button class="ip-opt" data-k="' + it.k + '" data-v="' + x[0] + '" aria-pressed="false"><i></i><span><b>' + esc(x[1]) + '</b>' + (x[2] ? '<small>' + esc(x[2]) + '</small>' : '') + '</span></button>'; }).join('') + '</div></article>';
  }).join('') + '</div></section>';
}).join('');
/* ---------- the animations: each visual plays its action, step by step, then loops ---------- */
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function find(k) { var r = null; IDEAS.forEach(function (g) { g.items.forEach(function (it) { if (it.k === k) r = it; }); }); return r; }
function play(vis, it) {
  clearTimeout(vis._t); if (!it.steps) return;
  if (RM) { vis.dataset.step = it.steps[it.steps.length - 1][0]; return; }   /* reduced motion: the end state, still */
  var i = 0; (function next() { var s = it.steps[i]; vis.dataset.step = s[0]; i = (i + 1) % it.steps.length; vis._t = setTimeout(next, s[1]); })();
}
var IO = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (en) { var vis = en.target, it = find(vis.closest('.ip-idea').dataset.k); if (en.isIntersecting) play(vis, it); else clearTimeout(vis._t); }); }, { threshold: .2 }) : null;
$$('.ip-vis').forEach(function (vis) { var it = find(vis.closest('.ip-idea').dataset.k); if (IO) IO.observe(vis); else play(vis, it); });
/* ---------- Your picks ---------- */
function pkText() {
  var L = [APP + ' · ' + TOPIC + ' — my picks'];
  IDEAS.forEach(function (g) { var rows = []; g.items.forEach(function (it) { var v = V.v[it.k]; if (!v) return; var o = it.opts.filter(function (x) { return x[0] === v; })[0]; rows.push('· ' + it.t + ': ' + (v === 'skip' ? 'skip' : o ? o[1] : v)); }); if (rows.length) { L.push(g.group + ':'); L = L.concat(rows); } });
  var left = total - Object.keys(V.v).length; if (left) L.push('(not picked yet: ' + left + ')');
  if (V.note.trim()) L.push('Notes: ' + V.note.trim());
  return L.join('\n');
}
function sync() {
  D.documentElement.setAttribute('data-th', V.th);
  $$('.ip-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.th === V.th)); });
  $$('.ip-opt').forEach(function (b) { b.setAttribute('aria-pressed', String(V.v[b.dataset.k] === b.dataset.v)); });
  $$('.ip-idea').forEach(function (a) { a.classList.toggle('picked', !!V.v[a.dataset.k]); });
  var n = Object.keys(V.v).length; $('#ip-n').textContent = n ? n + '/' + total : '';
}
function draw() {
  var w = $('#ip-picks'); w.hidden = !V.open; if (!V.open) return;
  var ta = $('#ip-note'); if (ta && D.activeElement === ta) { $('#ip-picks pre').textContent = pkText(); return; }
  w.innerHTML = '<div class="ip-ph"><b>Your picks</b><button data-pk="x" aria-label="Close">✕</button></div><pre>' + esc(pkText()) + '</pre><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)">Anything else<textarea id="ip-note" placeholder="Anything to add or change">' + esc(V.note) + '</textarea></label><button class="ip-btn pri" data-pk="copy" style="justify-content:center;height:34px">Copy for the chat</button>';
}
function toast(m) { var t = $('.ip-toast'); if (t) t.remove(); t = D.createElement('div'); t.className = 'ip-toast'; t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function () { t.remove(); }, 2600); }
function copy(tx) {
  var fb = function () { var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try { D.execCommand('copy'); toast('Copied — paste it in the chat.'); } catch (e) { toast('Select the text and copy it.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Copied — paste it in the chat.'); }, fb); else fb();
}
D.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('.ip-seg button'))) { V.th = b.dataset.th; save(); sync(); return; }
  if (t.closest('#ip-open')) { V.open = !V.open; draw(); return; }
  if ((b = t.closest('[data-pk]'))) { if (b.dataset.pk === 'x') { V.open = false; draw(); } else copy(pkText()); return; }
  if ((b = t.closest('.ip-replay'))) { var vis = b.closest('.ip-vis'); play(vis, find(vis.closest('.ip-idea').dataset.k)); return; }
  if ((b = t.closest('.ip-opt'))) { var k = b.dataset.k, v = b.dataset.v; if (V.v[k] === v) delete V.v[k]; else V.v[k] = v; save(); sync(); draw(); }
});
D.addEventListener('input', function (ev) { if (ev.target.id === 'ip-note') { V.note = ev.target.value; save(); var p = $('#ip-picks pre'); if (p) p.textContent = pkText(); } });
D.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.open) { V.open = false; draw(); } });

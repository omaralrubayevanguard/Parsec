<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Parsec New Look</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&family=Jost:wght@300..600&family=Albert+Sans:wght@300..700&display=swap">
<style>
/* Parsec · new look · live mock-up. One line, one light: the line is progress or place, the lamp is status. */
*,*::before,*::after{box-sizing:border-box}

/* ── tokens: a palette is two hues and two strengths; day and night are one ladder of lightness each ── */
:root{
  --nh:75;--nc:.007;--ah:88;--ac:.052;--la-d:.5;--la-n:.86;--hw:58;
  --f-t:"Mona Sans","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;--d-w:125%;--d-g:300;--d-ls:-.012em;--fs:14px;
  --r1:6px;--r2:10px;--r3:16px;--r4:22px;
  --e-out:cubic-bezier(.22,1,.36,1);--e-io:cubic-bezier(.65,0,.35,1);--e-pop:cubic-bezier(.22,1,.36,1);
  --t1:120ms;--t2:180ms;--t3:260ms;--t4:800ms;
  --l-bg:.958;--l-s1:.975;--l-s2:.99;--l-s3:1;--l-s4:.915;--l-ink:.2;--l-ink2:.38;--l-ink3:.5;--l-ink4:.7;
  --l-acc:var(--la-d);--l-on:.985;--l-st:.52;--c-st:.07;--k:.5;--ka:1.4;--a-line:.11;--a-shade:.2;--a-glow:.3;--a-grain:.06;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --l-bg:.165;--l-s1:.195;--l-s2:.225;--l-s3:.255;--l-s4:.31;--l-ink:.94;--l-ink2:.79;--l-ink3:.65;--l-ink4:.46;
    --l-acc:var(--la-n);--l-on:.17;--l-st:.76;--c-st:.062;--k:1;--ka:1;--a-line:.1;--a-shade:.6;--a-glow:.55;--a-grain:.05;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --l-bg:.165;--l-s1:.195;--l-s2:.225;--l-s3:.255;--l-s4:.31;--l-ink:.94;--l-ink2:.79;--l-ink3:.65;--l-ink4:.46;
  --l-acc:var(--la-n);--l-on:.17;--l-st:.76;--c-st:.062;--k:1;--ka:1;--a-line:.1;--a-shade:.6;--a-glow:.55;--a-grain:.05;
  color-scheme:dark;
}
[data-pal="espresso"]{--nh:50;--nc:.017;--ah:60;--ac:.082;--la-d:.5;--la-n:.75;--hw:92}
[data-pal="evergreen"]{--nh:160;--nc:.02;--ah:96;--ac:.075;--la-d:.48;--la-n:.84;--hw:55}
[data-pal="onyx"]{--nh:270;--nc:.003;--ah:95;--ac:.008;--la-d:.27;--la-n:.93;--hw:66}
:root,[data-pal]{
  --bg:oklch(var(--l-bg) calc(var(--nc)*var(--k)) var(--nh));
  --s1:oklch(var(--l-s1) calc(var(--nc)*var(--k)) var(--nh));
  --s2:oklch(var(--l-s2) calc(var(--nc)*var(--k)) var(--nh));
  --s3:oklch(var(--l-s3) calc(var(--nc)*var(--k)) var(--nh));
  --s4:oklch(var(--l-s4) calc(var(--nc)*var(--k)) var(--nh));
  --ink:oklch(var(--l-ink) calc(var(--nc)*.9) var(--nh));
  --ink2:oklch(var(--l-ink2) calc(var(--nc)*.9) var(--nh));
  --ink3:oklch(var(--l-ink3) calc(var(--nc)*.9) var(--nh));
  --ink4:oklch(var(--l-ink4) calc(var(--nc)*.9) var(--nh));
  --acc:oklch(var(--l-acc) calc(var(--ac)*var(--ka)) var(--ah));
  --acc-hi:oklch(calc(var(--l-acc) + .05) calc(var(--ac)*var(--ka)) var(--ah));
  --acc2:oklch(var(--l-acc) calc(var(--ac)*var(--ka)) var(--ah) / .16);
  --glow:oklch(var(--l-acc) calc(var(--ac)*var(--ka)) var(--ah) / var(--a-glow));
  --on:oklch(var(--l-on) .012 var(--nh));
  --line:oklch(var(--l-ink) .01 var(--nh) / var(--a-line));
  --line2:oklch(var(--l-ink) .01 var(--nh) / calc(var(--a-line)*2.3));
  --hv:oklch(var(--l-ink) .01 var(--nh) / .055);
  --ok:oklch(var(--l-st) var(--c-st) 152);
  --wait:oklch(var(--l-st) calc(var(--c-st)*1.5) var(--hw));
  --cust:oklch(var(--l-st) calc(var(--c-st)*1.05) 245);
  --sup:oklch(var(--l-st) var(--c-st) 318);
  --bad:oklch(var(--l-st) calc(var(--c-st)*1.7) 30);
  --sh:0 0 0 1px var(--line),0 24px 60px -18px oklch(.1 .02 var(--nh) / var(--a-shade));
}
:root[data-type="B"]{--f-t:"Jost","Century Gothic","Segoe UI",system-ui,sans-serif;--d-w:100%;--d-g:300;--d-ls:.01em;--fs:15px}
:root[data-type="C"]{--f-t:"Albert Sans","Segoe UI",system-ui,sans-serif;--d-w:100%;--d-g:300;--d-ls:-.02em}
:root[data-shape="B"]{--r1:2px;--r2:3px;--r3:4px;--r4:6px}
:root[data-mo="B"]{--e-pop:cubic-bezier(.3,1.5,.5,1);--t2:230ms;--t3:340ms}

html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 var(--f-t);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
h1,h2,h3,h4,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
:focus{outline:0}
:focus-visible{outline:1.5px solid var(--acc);outline-offset:2px}
.d{font-stretch:var(--d-w);font-weight:var(--d-g);letter-spacing:var(--d-ls)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{fill:currentColor;stroke:none}
svg.i .b{fill:var(--ink4);stroke:none;transition:fill var(--t2)}
.theming *,.theming *::before,.theming *::after{transition:background-color .7s ease,color .7s ease,fill .7s ease,stroke .7s ease,box-shadow .7s ease!important}

/* ── the living backdrop ── */
#bk{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);--sk:-18deg;--bx:0vw;--beam:transparent;--pool:transparent}
.bk-day,.bk-road{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
[data-bg="A"] .bk-day,[data-bg="B"] .bk-road{opacity:1}
.bk-day b{position:absolute;top:-30%;height:160%;width:20vw;min-width:160px;left:calc(6vw + var(--i)*29vw + var(--bx));transform:skewX(var(--sk));transition:transform 1.6s var(--e-io),left 1.6s var(--e-io)}
.bk-day b::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--beam) 34%,var(--beam) 66%,transparent);filter:blur(36px);animation:drift calc(36s + var(--i)*11s) ease-in-out infinite alternate}
.bk-day u{position:absolute;left:50%;top:-34vh;width:90vw;height:78vh;margin-left:-45vw;border-radius:50%;background:radial-gradient(closest-side,var(--pool),transparent);animation:pool 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-3vw)}to{transform:translateX(3vw)}}
@keyframes pool{from{transform:scale(1)}to{transform:scale(1.08)}}
:root[data-mo="B"] .bk-day b::before{animation-duration:calc(15s + var(--i)*4s)}
.bk-road{width:100%;height:100%}
.bk-road path{fill:none;stroke-linecap:round}
.bk-road .rd{stroke:var(--line);stroke-width:1}
.bk-road .hl,.bk-road .hg{stroke:var(--acc);animation:run var(--du) linear infinite}
.bk-road .tl{stroke:var(--bad)}
.bk-road .hl{stroke-width:2;opacity:1;stroke-dasharray:9 991}
.bk-road .hg{stroke-width:1.4;opacity:.34;stroke-dasharray:190 810}
.bk-road .rv{animation-direction:reverse}
@keyframes run{from{stroke-dashoffset:var(--o,0)}to{stroke-dashoffset:calc(var(--o,0) - 1000)}}
:root[data-mo="B"] .bk-road .hl,:root[data-mo="B"] .bk-road .hg{animation-duration:calc(var(--du)*.55)}
.bk-grain{position:absolute;inset:0;opacity:var(--a-grain);mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

/* ── frame ── */
#app{position:relative;z-index:1;display:grid;grid-template-columns:68px minmax(0,1fr);min-height:100dvh;transition:margin var(--t3) var(--e-out)}
#main{min-width:0;container:main/inline-size;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));--pad:clamp(0px,2.4vw,34px)}
#top,#stage{padding-left:var(--pad);padding-right:var(--pad)}
#stage{padding-bottom:120px;view-transition-name:stage}
:root{view-transition-name:none}

/* navigation: a rail that opens when you point at it */
#nav{position:sticky;top:0;height:100dvh;z-index:20}
.nav-in{position:absolute;inset:0 auto 0 0;width:68px;display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;overflow:hidden;border-radius:0 var(--r3) var(--r3) 0;transition:width var(--t3) var(--e-out),background-color var(--t2),box-shadow var(--t2)}
:root[data-nav="A"] #nav:hover .nav-in,:root[data-nav="A"] #nav:focus-within .nav-in{width:216px;background:var(--s2);box-shadow:var(--sh);transition-delay:.18s}
.logo{display:flex;align-items:center;gap:13px;height:40px;padding:0 10px;margin-bottom:14px;border-radius:var(--r2);white-space:nowrap}
.logo svg{width:24px;height:24px;stroke:var(--ink)}
.logo .b{fill:var(--acc);filter:drop-shadow(0 0 4px var(--acc))}
.logo span{font-size:19px}
.nvs{display:flex;flex-direction:column;gap:2px;min-height:0;flex:1}
.nv{display:flex;align-items:center;gap:14px;height:40px;padding:0 11px;border-radius:var(--r2);color:var(--ink3);white-space:nowrap;transition:color var(--t1),background-color var(--t1),transform var(--t1) var(--e-out)}
.nv svg{width:22px;height:22px}
.nv span,.logo span{opacity:0;transform:translateX(-6px);transition:opacity var(--t2),transform var(--t3) var(--e-out)}
:root[data-nav="A"] #nav:hover .nv span,:root[data-nav="A"] #nav:focus-within .nv span,:root[data-nav="A"] #nav:hover .logo span,:root[data-nav="A"] #nav:focus-within .logo span{opacity:1;transform:none;transition-delay:.2s}
.nv:hover{color:var(--ink);background:var(--hv)}
.nv:active{transform:scale(.97)}
.nv.on{color:var(--ink)}
.nv:hover .b,.nv.on .b{fill:var(--acc)}
.nv.on .b{filter:drop-shadow(0 0 3px var(--acc))}
.nv-more{display:none}
.nav-m{position:absolute;left:0;top:0;width:2px;height:20px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--glow);pointer-events:none;transition:transform var(--t3) var(--e-out),width var(--t3) var(--e-out),height var(--t3) var(--e-out),opacity var(--t2)}

/* B · a bar on top */
:root[data-nav="B"] #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
:root[data-nav="B"] #nav{position:relative;height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root[data-nav="B"] .nav-in{position:relative;inset:auto;width:auto;flex-direction:row;align-items:center;gap:2px;padding:14px clamp(0px,2.4vw,34px) 0;overflow:visible;border-radius:0}
:root[data-nav="B"] .logo{margin:0 18px 0 -10px}
:root[data-nav="B"] .nvs{flex-direction:row;flex:1}
:root[data-nav="B"] .nv{height:38px;padding:0 12px}
:root[data-nav="B"] .nv svg{display:none}
:root[data-nav="B"] .nv span,:root[data-nav="B"] .logo span{opacity:1;transform:none}
:root[data-nav="B"] .nvs .nv:nth-child(n+8):not(.nv-more){display:none}
:root[data-nav="B"] .nv-more{display:flex}
@media (max-width:1180px){:root[data-nav="B"] .nvs .nv:nth-child(n+6):not(.nv-more){display:none}}
@media (max-width:920px){:root[data-nav="B"] .nvs .nv:nth-child(n+4):not(.nv-more){display:none}}
@media (min-width:1180px) and (max-width:1560px){:root[data-tune="1"][data-nav="B"] .nvs .nv:nth-child(n+6):not(.nv-more){display:none}}
:root[data-nav="B"] .nv-more svg,:root[data-nav="B"] .nv-kit svg{display:block}
:root[data-nav="B"] .nv-kit span{display:none}

/* C · a dock at the bottom  ·  P · the phone's bar */
:root[data-nav="C"] #app,:root[data-nav="P"] #app{grid-template-columns:minmax(0,1fr)}
:root[data-nav="C"] #nav{position:fixed;top:auto;left:50%;bottom:18px;height:auto;transform:translateX(-50%);z-index:40}
:root[data-nav="C"] .nav-in,:root[data-nav="P"] .nav-in{position:relative;inset:auto;width:auto;flex-direction:row;align-items:center;gap:2px;padding:8px 10px;overflow:visible;border-radius:999px;background:color-mix(in oklch,var(--s3) 84%,transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:var(--sh)}
:root[data-nav="C"] .logo,:root[data-nav="P"] .logo{display:none}
:root[data-nav="C"] .nvs,:root[data-nav="P"] .nvs{flex-direction:row}
:root[data-nav="C"] .nv,:root[data-nav="P"] .nv{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%}
:root[data-nav="C"] .nv span,:root[data-nav="P"] .nv span{display:none}
:root[data-nav="C"] .nv:hover{transform:translateY(-3px) scale(1.12)}
:root[data-nav="C"] .nv:active{transform:scale(.94)}
:root[data-nav="C"] .nav-m,:root[data-nav="P"] .nav-m{border-radius:50%}
:root[data-nav="P"] #nav{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;z-index:40;padding:0 10px max(10px,env(safe-area-inset-bottom,0px))}
:root[data-nav="P"] .nav-in{justify-content:space-between;border-radius:var(--r4)}
:root[data-nav="P"] .nvs{flex:1;justify-content:space-between}
:root[data-nav="P"] .nvs .nv:nth-child(n+4):not(.nv-more){display:none}
:root[data-nav="P"] .nv-more{display:flex}

/* ── the top of the page ── */
#top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:14px 24px;padding-top:26px}
#ttl{font-size:clamp(26px,2.7vw,36px);line-height:1.1;view-transition-name:ttl}
#sub{margin-top:7px;color:var(--ink3);font-size:13px}
.back{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 8px;margin-left:-8px;border-radius:var(--r2);color:var(--ink3);transition:color var(--t1),background-color var(--t1),transform var(--t1)}
.back:hover{color:var(--ink);background:var(--hv)}
.back:hover svg{transform:translateX(-3px)}
.back svg{transition:transform var(--t2) var(--e-out)}
.back:active{transform:scale(.97)}
.clu{display:flex;align-items:center;gap:4px}
.ib{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r2);color:var(--ink2);transition:color var(--t1),background-color var(--t1),transform var(--t1) var(--e-out)}
.ib:hover{color:var(--ink);background:var(--hv)}
.ib:active{transform:scale(.94)}
.ib .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.srch{display:flex;width:auto;gap:9px;padding:0 10px;color:var(--ink3);font-size:13px}
kbd{font:inherit;font-size:11px;color:var(--ink3);padding:1px 6px;border-radius:5px;box-shadow:0 0 0 1px var(--line2)}
.av{width:34px;height:34px;margin-left:6px;border-radius:50%;background:var(--s4);font-size:12px;font-weight:600;text-align:center;transition:transform var(--t1) var(--e-out),box-shadow var(--t2)}
.av:hover{box-shadow:0 0 0 2px var(--acc2)}
.av:active{transform:scale(.94)}

/* the clock: a bevelled face, a ring that fills while you hold */
.ck,.hold{position:relative;display:inline-flex;align-items:center;gap:11px;border-radius:999px;background:linear-gradient(180deg,var(--s3),var(--s2));box-shadow:inset 0 1px 0 oklch(1 0 0 / .09),0 0 0 1px var(--line2),0 10px 22px -12px oklch(0 0 0 / var(--a-shade));transition:transform var(--t1) var(--e-out),box-shadow var(--t2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ck{height:46px;padding:0 18px 0 6px;margin-right:8px}
.ck:hover,.hold:hover{box-shadow:inset 0 1px 0 oklch(1 0 0 / .12),0 0 0 1px var(--line2),0 0 0 4px var(--acc2),0 10px 22px -12px oklch(0 0 0 / var(--a-shade))}
.ck:active,.ck.dn,.hold.dn{transform:scale(.96)}
.ck-r{position:relative;display:grid;place-items:center;width:34px;height:34px;flex:none}
.ck-r svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);fill:none;stroke-width:2}
.ck-r .tr{stroke:var(--line2)}
.ck-r .fl{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .3s var(--e-out)}
.dn .ck-r .fl{stroke-dashoffset:0;transition:stroke-dashoffset var(--hold,.8s) linear}
.ck-r i{position:relative;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink4)}
.ck.on .ck-r i,.hold.on .ck-r i{background:var(--ok);box-shadow:none}
.ck.on .ck-r i::after,.hold.on .ck-r i::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--ok);animation:halo 2.6s ease-out infinite}
.ck-t{display:flex;flex-direction:column;line-height:1.2}
.ck-t b{font-weight:500;font-size:15px}
.ck-t small{font-size:11px;color:var(--ink3)}
@keyframes halo{0%{opacity:.5;transform:scale(.55)}70%,100%{opacity:0;transform:scale(1.5)}}

/* the day: the rule under the header is the shop's day; the bead is now */
.day{grid-column:1/-1;position:relative;height:28px;margin-top:14px}
.day::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}
.day-f{position:absolute;left:0;top:-.5px;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--acc));opacity:.8;transform:scaleX(var(--d,0));transform-origin:left;transition:transform 1.2s var(--e-out)}
.day-b{position:absolute;top:.5px;left:calc(var(--d,0)*100%);width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--glow),0 0 0 3px var(--acc2);transition:left 1.2s var(--e-out)}
.day-t{position:absolute;top:9px;left:clamp(40px,calc(var(--d,0)*100%),calc(100% - 90px));transform:translateX(-50%);font-size:11.5px;color:var(--ink3);white-space:nowrap;transition:left 1.2s var(--e-out)}

/* ── tabs: words, and the line that says which ── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;flex-wrap:wrap}
.tabs{position:relative;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tab{padding:9px 0 10px;color:var(--ink3);white-space:nowrap;transition:color var(--t1)}
.tab b{font-weight:400;font-size:12px;color:var(--ink3);margin-left:7px;opacity:.8}
.tab:hover,.tab.on{color:var(--ink)}
.tabs-m{position:absolute;left:0;bottom:0;height:1.5px;width:20px;background:var(--acc);border-radius:2px;transition:transform var(--t3) var(--e-out),width var(--t3) var(--e-out)}

/* ── buttons ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r2);overflow:hidden;font-weight:500;font-size:13.5px;white-space:nowrap;background:var(--s2);box-shadow:0 0 0 1px var(--line);transition:transform var(--t1) var(--e-out),background-color var(--t1),box-shadow var(--t1),color var(--t1),filter var(--t1)}
.btn svg{width:17px;height:17px}
.btn:hover{box-shadow:0 0 0 1px var(--line2)}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:var(--on);box-shadow:inset 0 1px 0 oklch(1 0 0 / .28),0 6px 16px -8px var(--acc)}
.btn.p:hover{filter:brightness(1.07)}
.btn.p::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,oklch(1 0 0 / .4) 50%,transparent 62%);transform:translateX(-130%)}
:root[data-mo="B"] .btn.p:hover::after{transform:translateX(130%);transition:transform .8s var(--e-out)}
.btn.q{background:none;box-shadow:none;color:var(--ink2)}
.btn.q:hover{background:var(--hv);color:var(--ink)}
.btn.w{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:var(--r1)}
.btn[disabled]{opacity:.42;pointer-events:none}
.ibt{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r1);color:var(--ink3);transition:color var(--t1),background-color var(--t1),transform var(--t1)}
.ibt svg{width:17px;height:17px}
.ibt:hover{color:var(--ink);background:var(--hv)}
.ibt:active{transform:scale(.92)}
.hold{height:54px;padding:0 24px 0 9px;font-weight:500}
.hold .ck-r{width:38px;height:38px}
.hold small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}

/* ── status marks ── */
[data-tone="working"]{--c:var(--ok)}[data-tone="waiting"]{--c:var(--wait)}[data-tone="customer"]{--c:var(--cust)}[data-tone="support"]{--c:var(--sup)}[data-tone="hold"],[data-tone="done"],[data-tone="rel"]{--c:var(--ink3)}[data-tone="bad"]{--c:var(--bad)}
.lamp{flex:none;width:14px;height:14px;overflow:visible}
.lamp .s{fill:none;stroke:var(--c);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.lamp .fi{fill:var(--c)}
.lamp .cut{fill:none;stroke:var(--bg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lamp .h{fill:var(--c);transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-out infinite}
.lamp .g0{fill:none;stroke:var(--line2);stroke-width:1.7}
.lamp .g1{fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;transition:stroke-dasharray var(--t4) var(--e-out)}
.st-w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap;background:color-mix(in oklch,var(--c) 17%,transparent);color:color-mix(in oklch,var(--c) 62%,var(--ink))}
.mono{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--hv);box-shadow:0 0 0 1px var(--line);font-size:10.5px;font-weight:600;font-style:normal;color:var(--ink2);letter-spacing:.02em}

/* ── the coachline: the rule between rows is how far each truck has come ── */
.cl{display:block;position:absolute;left:var(--rp,0px);right:var(--rp,0px);bottom:0;height:1px;background:var(--line)}
.cl-f{position:absolute;left:0;top:-.25px;width:100%;height:1.5px;border-radius:2px;background:var(--acc);opacity:.5;transform:scaleX(var(--p,0));transform-origin:left;transition:transform var(--t4) var(--e-out),opacity var(--t2)}
.cl-b{position:absolute;left:calc(var(--p,0)*100%);top:.5px;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--acc);box-shadow:0 0 9px var(--glow);opacity:0;transition:left var(--t4) var(--e-out),opacity var(--t2)}
.cl-b::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--acc);opacity:0}
.live>.cl .cl-f,.live .cl-f,.cl.on .cl-f{opacity:1}
.live>.cl .cl-b,.cl.on .cl-b{opacity:1}
.live>.cl .cl-b::after,.cl.on .cl-b::after{animation:halo 2.6s ease-out infinite}
:root[data-mo="B"] .live>.cl::after{content:"";position:absolute;top:-1px;height:3px;width:60px;left:0;background:linear-gradient(90deg,transparent,var(--acc-hi),transparent);animation:glint 4.2s var(--e-io) infinite;opacity:.9}
@keyframes glint{0%{transform:translateX(-60px);opacity:0}15%{opacity:.9}60%,100%{transform:translateX(calc(var(--p)*var(--cw,600px)));opacity:0}}
:root[data-prog="B"] .list .cl,:root[data-prog="B"] .road-l{height:2px;border-radius:2px;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(100%/7 - 5px),transparent 0 calc(100%/7));mask:repeating-linear-gradient(90deg,#000 0 calc(100%/7 - 5px),transparent 0 calc(100%/7))}
:root[data-prog="B"] .list .cl-f,:root[data-prog="B"] .road-l .cl-f{height:2px;top:0;transform:scaleX(var(--ps,0));border-radius:0}
:root[data-prog="B"] .list .cl-b,:root[data-prog="B"] .list .cl::after{display:none}
:root[data-prog="C"] .list .cl-f,:root[data-prog="C"] .list .cl-b{display:none}
.ring{display:none;width:18px;height:18px;flex:none;transform:rotate(-90deg);fill:none;stroke-width:4}
.ring .tr{stroke:var(--line2)}
.ring .fl{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:calc(var(--p,0)*100) 100;transition:stroke-dasharray var(--t4) var(--e-out)}
:root[data-prog="C"] .r-rd .ring{display:block}
.cl.ind{overflow:hidden;position:relative;left:0;right:0}
.cl.ind .cl-f{width:32%;transform:none;opacity:1;animation:ind 1.5s var(--e-io) infinite}
@keyframes ind{from{transform:translateX(-110%)}to{transform:translateX(330%)}}

/* ── the list ── */
.list{margin-top:6px}
.lh,.row{display:grid;grid-template-columns:62px minmax(140px,1.2fr) minmax(194px,1.1fr) minmax(110px,.9fr) 128px 64px;align-items:center;gap:0 22px}
.lh .xd,.row .xd{display:none!important}
@container main (min-width:1180px){
  :root[data-den="B"] .lh,:root[data-den="B"] .row{grid-template-columns:62px minmax(140px,1.2fr) minmax(194px,1.1fr) minmax(110px,.9fr) 100px 88px 30px 128px 64px;gap:0 16px}
  :root[data-den="B"] .lh .xd,:root[data-den="B"] .row .xd{display:block!important}
}
.lh{padding:10px 14px 8px;font-size:12px;color:var(--ink3)}
.lh span:nth-last-child(2){text-align:right}
.row{--rp:14px;position:relative;padding:15px 14px 16px;border-radius:var(--r2);cursor:pointer;outline-offset:-2px;transition:background-color var(--t1)}
.row:hover,.row:focus-visible{background:var(--hv)}
.row:hover .cl-f{opacity:1}
.r-no{font-size:19px;font-weight:400}
.r-cu,.r-nx{min-width:0}
.r-cu b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-cu small,.r-nx small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-nx>span{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-st{display:flex;align-items:center;gap:9px;min-width:0;max-width:100%;justify-self:start;padding:6px 9px;margin-left:-9px;border-radius:var(--r1);color:var(--ink);transition:background-color var(--t1),transform var(--t1)}
.r-st:hover{background:var(--hv)}
.r-st:active{transform:scale(.97)}
.r-x{color:var(--ink3);font-size:13px;white-space:nowrap}
.r-rd{display:flex;align-items:center;justify-content:flex-end;gap:9px;color:var(--ink2);white-space:nowrap}
.r-ac{display:flex;justify-content:flex-end;gap:2px;opacity:0;transform:translateX(6px);transition:opacity var(--t1),transform var(--t2) var(--e-out)}
.row:hover .r-ac,.row:focus-within .r-ac{opacity:1;transform:none}
:root[data-den="A"] .xd{display:none!important}
.none{padding:56px 14px;max-width:46ch;color:var(--ink3)}
.none b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
:root[data-mo="B"] .row,:root[data-mo="B"] .op,:root[data-mo="B"] .ks{background-image:radial-gradient(380px circle at var(--mx,-999px) var(--my,-999px),var(--acc2),transparent 70%);background-repeat:no-repeat}

/* ── words first; a field shows when you point at it ── */
.fld{display:block;position:relative}
.fld>span{display:block;font-size:12px;color:var(--ink3)}
.fld .v{display:block;width:calc(100% + 20px);min-height:34px;padding:6px 10px;margin:1px -10px 0;border:0;border-radius:var(--r1);background:transparent;color:var(--ink);resize:none;outline:0;transition:background-color var(--t1)}
.fld .v:hover{background:var(--hv)}
.fld .v:focus{background:var(--hv)}
.fld .v:empty::before{content:attr(data-ph);color:var(--ink4)}
.fld::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:1.5px;border-radius:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform var(--t3) var(--e-out)}
.fld:focus-within::after{transform:scaleX(1)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:8px 0;color:var(--ink2);transition:color var(--t1)}
.sw:hover{color:var(--ink)}
.sw i{position:relative;flex:none;width:34px;height:20px;border-radius:999px;background:var(--s4);box-shadow:inset 0 0 0 1px var(--line);transition:background-color var(--t2)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink3);transition:transform var(--t2) var(--e-pop),background-color var(--t2),box-shadow var(--t2)}
.sw[aria-checked="true"] i{background:var(--acc2)}
.sw[aria-checked="true"] i::after{transform:translateX(14px);background:var(--acc);box-shadow:0 0 9px var(--glow)}
.sw:active i::after{width:18px}
.tk{display:flex;align-items:center;gap:13px;width:calc(100% + 24px);padding:10px 12px;margin:0 -12px;border-radius:var(--r2);transition:background-color var(--t1)}
.tk:hover{background:var(--hv)}
.tk>i{display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink4);transition:background-color var(--t2),box-shadow var(--t2),transform var(--t2) var(--e-pop)}
.tk svg{width:12px;height:12px;fill:none;stroke:var(--on);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:15;stroke-dashoffset:15;transition:stroke-dashoffset var(--t3) var(--e-out) 60ms}
.tk[aria-checked="true"]>i{background:var(--acc);box-shadow:none}
.tk[aria-checked="true"] svg{stroke-dashoffset:0}
.tk:active>i{transform:scale(.88)}
.tk span{flex:1;min-width:0}
.tk small{display:block;font-size:12px;color:var(--ink3)}

/* ── the RO page ── */
.ro-hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 40px;margin-top:8px}
.ro-no{font-size:clamp(44px,5.6vw,72px);line-height:.92;letter-spacing:-.03em;view-transition-name:rono}
.ro-cu{flex:1;min-width:220px;padding-bottom:4px}
.ro-cu h2{font-size:22px;font-weight:500;line-height:1.2}
.ro-cu p{margin-top:4px;color:var(--ink3)}
.ro-st{display:flex;align-items:center;gap:14px;padding-bottom:2px;color:var(--ink3);font-size:13px}
.road{--tw:200px;position:relative;margin-top:14px;padding-top:calc(var(--tw)*.526);container-type:inline-size}
.trk{position:absolute;left:0;top:0;width:var(--tw);transform:translateX(calc(var(--p,0)*(100cqw - var(--tw))));transition:transform 1.5s var(--e-io)}
.trk svg{display:block;width:100%;height:auto;overflow:visible;fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.trk svg *{vector-effect:non-scaling-stroke}
.trk .dim{stroke:var(--ink4)}
.trk .cch{stroke:var(--acc);stroke-width:1.6}
.trk .lt{stroke:none;fill:var(--ink4);transition:fill .6s,filter .6s}
.trk.live .lt{fill:var(--acc);filter:drop-shadow(0 0 3px var(--acc))}
.trk .wh{transform-box:view-box;transform:rotate(calc(var(--p,0)*1800deg));transition:transform 1.5s var(--e-io)}
.road-l{position:relative;height:1px;background:var(--line)}
.road-l .cl-f{opacity:1}
.stops{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:2px}
.stop{display:block;width:100%;padding:9px 4px 8px 0;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:var(--r1);transition:color var(--t1),background-color var(--t1)}
.stop:hover{color:var(--ink);background:var(--hv)}
.stop.was{color:var(--ink2)}
.stop.now{color:var(--ink)}
.stop.now::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--acc);vertical-align:1px}
.road-s{margin-top:4px;color:var(--ink3);font-size:13px}
.road-s b{color:var(--ink);font-weight:500}
.ro-body{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:28px 56px;align-items:start;margin-top:38px}
.h3{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-size:15px;font-weight:500}
.h3 small{font-weight:400;color:var(--ink3)}
.op{position:relative;margin:0 -14px;border-radius:var(--r3);transition:background-color var(--t3)}
.op.open{background-color:var(--hv)}
.op-h{display:grid;grid-template-columns:26px minmax(0,1fr) auto 26px;align-items:center;gap:6px 14px;width:100%;padding:17px 14px;border-radius:var(--r3);transition:background-color var(--t1)}
.op:not(.open) .op-h:hover{background:var(--hv)}
.op-n{font-size:19px;color:var(--ink3)}
.op-c{font-size:16px;font-weight:500;min-width:0}
.op-m{display:flex;align-items:center;gap:9px;color:var(--ink2);white-space:nowrap}
.op-x{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink3);font-size:13px}
.op-h>svg{color:var(--ink4);transition:transform var(--t3) var(--e-out)}
.op.open .op-h>svg{transform:rotate(90deg)}
.op-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t3) var(--e-out)}
.op.open .op-b{grid-template-rows:1fr}
.op-b>div{min-height:0;overflow:hidden}
.op-in{display:grid;gap:22px;padding:6px 20px 24px 54px}
.oc{display:flex;flex-wrap:wrap;align-items:center;gap:16px 26px}
.oc-t{font-size:40px;line-height:1}
.oc-r{position:relative;width:58px;height:58px;flex:none}
.oc-r svg{width:100%;height:100%;transform:rotate(-90deg);fill:none;stroke-width:1.5}
.oc-r .tr{stroke:var(--line2)}
.oc-r .fl{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:calc(var(--q,0)*100) 100;transition:stroke-dasharray 1s var(--e-out)}
.oc-r.over .fl{stroke:var(--bad)}
.oc-r span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink2)}
.oc p{color:var(--ink3);font-size:13px}
.oc p b{color:var(--ink);font-weight:500}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.facts span{display:block;font-size:12px;color:var(--ink3)}
.facts b{font-size:19px;font-weight:400}
.story{display:grid;gap:12px}
.pt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 34px auto auto;gap:0 16px;align-items:center;padding:9px 0;box-shadow:inset 0 1px 0 var(--line);font-size:13.5px}
.pt:first-of-type{box-shadow:none}
.pt span:nth-child(2),.pt span:nth-child(3){color:var(--ink3)}
.pt .r-x{text-align:right}
.pt .tag{justify-self:start}
.gl{display:grid;gap:26px;position:sticky;top:20px}
.gl-a{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gl-a .hold,.gl-a .w2{grid-column:1/-1}
.gl-a .btn.q{justify-content:flex-start;padding:0 10px}
.gl dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px 18px}
.gl dt{color:var(--ink3)}
.gl dd{text-align:right}
.gl dd button{color:var(--acc);border-radius:4px}

/* ── Technician ── */
.tech{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr);gap:44px 64px;align-items:start;margin-top:30px}
.t-l{font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:9px}
.t-time{display:flex;margin-top:6px;font-size:clamp(60px,10.5vw,138px);line-height:.95;letter-spacing:-.03em}
.t-job{margin-top:16px;font-size:17px;max-width:44ch}
.t-job b{font-weight:500}
.t-job span{display:block;font-size:14px;color:var(--ink3)}
.t-a{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px}
.t-r{position:relative;justify-self:center;width:min(100%,250px);aspect-ratio:1}
.t-r svg{width:100%;height:100%;transform:rotate(-90deg);fill:none;stroke-width:.22}
.t-r .tr{stroke:var(--line2)}
.t-r .fl{stroke:var(--acc);stroke-width:.5;stroke-linecap:round;stroke-dasharray:calc(var(--q,0)*100) 100;transition:stroke-dasharray 1s var(--e-out)}
.t-r div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--ink3);font-size:13px}
.t-r b{display:block;font-size:44px;line-height:1;color:var(--ink)}
.pl{grid-column:1/-1}
.pl-t{position:relative;height:54px;margin-top:6px}
.pl-t::before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:var(--line)}
.pl-s{position:absolute;top:17px;height:7px;border-radius:4px;background:var(--ink4);opacity:.55;transform-origin:left;transition:background-color var(--t1),opacity var(--t1)}
.pl-s:hover{opacity:1}
.pl-s.on{background:var(--acc);opacity:1;box-shadow:0 0 10px var(--glow)}
.pl-k{position:absolute;top:32px;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.pl-n{position:absolute;top:0;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.nx{grid-column:1/-1}

/* ── The look ── */
.kit{display:grid;gap:8px;margin-top:22px}
.ks{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px 30px;padding:26px 14px;margin:0 -14px;border-top:1px solid var(--line)}
.ks-h h3{font-size:16px;font-weight:500}
.ks-h p{margin-top:5px;font-size:12.5px;color:var(--ink3);max-width:26ch}
.rt{display:inline-flex;gap:2px;margin-top:12px;padding:2px;border-radius:999px;box-shadow:0 0 0 1px var(--line)}
.rt button{height:26px;min-width:34px;padding:0 9px;border-radius:999px;font-size:12px;color:var(--ink3);text-align:center;transition:background-color var(--t1),color var(--t1),transform var(--t1) var(--e-pop)}
.rt button:hover{color:var(--ink);background:var(--hv)}
.rt button:active{transform:scale(.9)}
.rt button.on{background:var(--acc);color:var(--on)}
.rt button.on[data-r="no"]{background:var(--s4);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{width:88px}
.chip i{display:block;height:58px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line)}
.chip b{display:block;margin-top:7px;font-size:12.5px;font-weight:500}
.chip small{display:block;font-size:11px;color:var(--ink3)}
.kn{margin-top:14px;font-size:13px;color:var(--ink3);max-width:60ch}
.spec .a{font-size:clamp(30px,4.4vw,52px);line-height:1.05}
.spec .bb{font-size:clamp(26px,3.6vw,40px);line-height:1.2;margin-top:4px}
.spec p{margin-top:12px;max-width:62ch;color:var(--ink2)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.icn{display:grid;justify-items:center;gap:8px;padding:14px 4px 10px;border-radius:var(--r2);font-size:11.5px;color:var(--ink3);transition:background-color var(--t1),color var(--t1)}
.icn svg{width:24px;height:24px;color:var(--ink2);transition:transform var(--t2) var(--e-pop),color var(--t1)}
.icn:hover{background:var(--hv);color:var(--ink)}
.icn:hover svg{color:var(--ink);transform:translateY(-2px)}
.icn:hover .b{fill:var(--acc);filter:drop-shadow(0 0 3px var(--acc))}
.sts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 24px}
.sts div{display:flex;align-items:center;gap:10px;padding:8px 0}
.sts small{margin-left:auto;color:var(--ink3);font-size:12px}
.rowf{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 44px;align-items:start}
.pg{display:grid;gap:26px;max-width:560px}
.pg>div{position:relative}
.pg small{display:block;margin-bottom:12px;font-size:12.5px;color:var(--ink3)}
.pg .cl{position:relative;left:0;right:0}

/* ── pop-overs, windows, messages ── */
#layer{position:fixed;inset:0;z-index:60;pointer-events:none}
#layer>*{pointer-events:auto}
.pop{position:absolute;min-width:210px;max-width:min(350px,calc(100vw - 16px));max-height:calc(100dvh - 16px);overflow:auto;padding:6px;border-radius:var(--r3);background:var(--s3);box-shadow:var(--sh);opacity:0;transform:scale(.95);transition:opacity var(--t2),transform var(--t2) var(--e-pop)}

.pop h4{padding:8px 10px 6px;font-size:12px;font-weight:400;color:var(--ink3)}
.mi{display:flex;align-items:center;gap:11px;width:100%;min-height:36px;padding:7px 10px;border-radius:var(--r1);color:var(--ink2);transition:background-color 80ms,color 80ms}
.mi:hover,.mi:focus-visible{background:var(--hv);color:var(--ink);outline:0}
.mi.on{color:var(--ink)}
.mi small{margin-left:auto;padding-left:14px;font-size:12px;color:var(--ink3);white-space:nowrap}
.mi>span{min-width:0}
.mi>span>small{display:block;margin:0;padding:0;white-space:normal;color:var(--ink3)}
.pop hr{height:1px;margin:6px 4px;border:0;background:var(--line)}
.pop .ask{padding:10px 10px 8px;max-width:270px}
.pop .ask p{color:var(--ink2);margin-bottom:12px}
.pop .ask>div:last-child{display:flex;justify-content:flex-end;gap:8px}
.scrim{position:absolute;inset:0;background:oklch(.12 .015 var(--nh) / .46);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity var(--t3)}
.scrim.in{opacity:1}
.scrim.thin{background:oklch(.12 .015 var(--nh) / .22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.win{position:absolute;left:50%;top:50%;width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;padding:28px 30px 24px;border-radius:var(--r4);background:var(--s2);box-shadow:var(--sh);opacity:0;transform:translate(-50%,-47%) scale(.97);transition:opacity var(--t3),transform var(--t3) var(--e-pop)}
.win.in{opacity:1;transform:translate(-50%,-50%)}
.win:focus{outline:0}
.win.out{opacity:0;transform:translate(-50%,-49%) scale(.985);transition-duration:130ms}
.win h2{font-size:24px;line-height:1.15;padding-right:36px}
.win .sub{margin-top:5px;color:var(--ink3)}
.win .x{position:absolute;right:18px;top:18px}
.win .cl{position:relative;left:0;right:0;margin:20px 0 10px}
.win .cl-f{opacity:1}
.win .why{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t3) var(--e-out)}
.win .why.open{grid-template-rows:1fr}
.win .why>div{min-height:0;overflow:hidden}
.win .why p{padding-top:14px;color:var(--ink2)}
.rs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px}
.rs button{height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink2);box-shadow:0 0 0 1px var(--line2);transition:background-color var(--t1),color var(--t1),transform var(--t1)}
.rs button:hover{background:var(--hv);color:var(--ink)}
.rs button:active{transform:scale(.96)}
.rs button.on{background:var(--acc2);color:var(--ink);box-shadow:0 0 0 1px var(--acc)}
.win footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:22px}
.win footer span{margin-right:auto;font-size:13px;color:var(--ink3)}
.cmd{position:absolute;left:50%;top:13vh;width:min(580px,calc(100vw - 24px));transform:translateX(-50%);border-radius:var(--r4);background:var(--s3);box-shadow:var(--sh);overflow:hidden;opacity:0;transition:opacity 90ms}
.cmd.in{opacity:1}
.cmd label{display:flex;align-items:center;gap:12px;padding:0 20px;height:58px;box-shadow:inset 0 -1px 0 var(--line);color:var(--ink3)}
.cmd input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:17px}
.cmd input::placeholder{color:var(--ink4)}
.cmd ul{max-height:min(380px,52dvh);overflow:auto;padding:6px}
.cmd .mi.sel{background:var(--hv);color:var(--ink)}
.cmd .mi .r-no{width:54px;font-size:15px}
.toasts{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none!important;width:max-content;max-width:calc(100vw - 24px);transition:bottom var(--t3) var(--e-out)}
:root[data-nav="C"] .toasts,:root[data-nav="P"] .toasts{bottom:96px}
.toast{position:relative;display:flex;align-items:center;gap:12px;max-width:100%;padding:11px 12px 11px 16px;border-radius:999px;overflow:hidden;background:var(--s3);box-shadow:var(--sh);pointer-events:auto;opacity:0;transform:translateY(14px) scale(.96);transition:opacity var(--t2),transform var(--t3) var(--e-pop)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(6px) scale(.98);transition-duration:140ms}
.toast span{min-width:0}
.toast button{height:28px;padding:0 11px;border-radius:999px;color:var(--acc);font-weight:500;font-size:13px;transition:background-color var(--t1)}
.toast button:hover{background:var(--acc2)}
.toast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--acc);transform-origin:left;animation:fuse var(--life,5s) linear forwards}

.tip{position:absolute;z-index:5;padding:5px 9px;border-radius:var(--r1);background:var(--ink);color:var(--bg);font-size:12px;white-space:nowrap;pointer-events:none!important;opacity:0;transform:translateY(3px);transition:opacity 90ms,transform 90ms}
.tip.in{opacity:1;transform:none}

/* ── numbers roll like an odometer ── */
.od{display:inline-flex;white-space:pre}
.od>span{position:relative;display:inline-block;overflow:hidden;text-align:center;height:1.12em;line-height:1.12}
.od>span.g{width:1ch;min-width:.62em}
.od>span.g1{width:.72ch;min-width:.44em}
.od i{display:block;font-style:normal}
.od i.o{position:absolute;left:0;right:0;top:0;animation:odo .42s var(--e-out) forwards}
.od i.n{animation:odn .42s var(--e-pop)}
@keyframes odo{to{transform:translateY(-75%);opacity:0}}
@keyframes odn{from{transform:translateY(75%);opacity:0}}

/* ── tune the look ── */
#tune-b{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:9px;height:46px;padding:0 20px 0 15px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 14px 30px -12px oklch(0 0 0 / .55);transition:transform var(--t1) var(--e-out),opacity var(--t2)}

#tune-b:active{transform:scale(.96)}
:root[data-nav="P"] #tune-b{bottom:88px}
:root[data-tune="1"] #tune-b{opacity:0;pointer-events:none}
#tune{position:fixed;top:0;right:0;bottom:0;z-index:55;display:flex;flex-direction:column;width:376px;max-width:100vw;background:var(--s2);box-shadow:var(--sh);transform:translateX(105%);visibility:hidden;transition:transform var(--t3) var(--e-out),visibility 0s var(--t3)}
:root[data-tune="1"] #tune{transform:none;visibility:visible;transition-delay:0s}
@media (min-width:1180px){:root[data-tune="1"] #app{margin-right:376px}:root[data-tune="1"][data-nav="C"] #nav{left:calc(50% - 188px)}:root[data-tune="1"] .toasts{left:calc(50% - 188px)}}
.tu-h{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px 24px}
.tu-h h2{font-size:20px}
.tu-b{flex:1;overflow:auto;padding:0 16px 20px 24px;overscroll-behavior:contain}
.tu-b h3{margin:22px 0 2px;font-size:12px;font-weight:400;color:var(--ink3)}
.ti{padding:12px 0 6px}
.ti h4{font-size:15px;font-weight:500}
.ti>p{margin:2px 0 6px;font-size:12.5px;color:var(--ink3)}
.to{display:flex;align-items:center;gap:11px;width:calc(100% + 16px);min-height:40px;padding:7px 8px;margin:0 -8px;border-radius:var(--r2);color:var(--ink2);transition:background-color var(--t1),color var(--t1),transform var(--t1) var(--e-out)}
.to:hover{background:var(--hv);color:var(--ink)}
.to:active{transform:scale(.98)}
.to>kbd{display:grid;place-items:center;flex:none;width:22px;height:22px;padding:0;border-radius:6px;transition:background-color var(--t1),color var(--t1),box-shadow var(--t1)}
.to>span{flex:1;min-width:0}
.to small{display:block;font-size:12px;color:var(--ink3)}
.to.cur>kbd{box-shadow:0 0 0 1px var(--acc);color:var(--acc)}
.to.on{color:var(--ink);background:var(--acc2)}
.to.on>kbd{background:var(--acc);color:var(--on);box-shadow:none}
.sw3{display:flex;flex:none}
.sw3 i{width:20px;height:20px;margin-left:-6px;border-radius:50%;box-shadow:0 0 0 1.5px var(--s2)}
.sw3 i:nth-child(1){background:var(--bg)}.sw3 i:nth-child(2){background:var(--s4)}.sw3 i:nth-child(3){background:var(--ink)}.sw3 i:nth-child(4){background:var(--acc)}
.tm{display:flex;align-items:center;gap:10px;padding:10px 0 2px;font-size:12.5px;color:var(--ink3)}
.tm input{flex:1;min-width:0;accent-color:var(--acc);height:20px}
.tm b{min-width:62px;font-weight:500;color:var(--ink);text-align:right}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.trow .rt{margin:0}
.tu-f{padding:14px 16px 16px 24px;box-shadow:inset 0 1px 0 var(--line);display:grid;gap:10px}

.tu-f div{display:flex;gap:8px}
.tu-f .btn.p{flex:1}

/* ── key-on: every lamp lights once, every line draws once ── */
.boot .tt,.boot .clu,.boot .bar{animation:rise .7s var(--e-out) both}
.boot .clu{animation-delay:.08s}.boot .bar{animation-delay:.16s}
.boot .lh{animation:rise .7s var(--e-out) .2s both}
.boot .row{animation:rise .7s var(--e-out) both;animation-delay:calc(var(--i)*40ms + .24s)}
.boot .row .cl-f{animation:draw 1.1s var(--e-out) both;animation-delay:calc(var(--i)*40ms + .5s)}
.boot .row .lamp{animation:bulb 1.2s ease-out both;animation-delay:calc(var(--i)*40ms + .32s)}
.boot .row .cl-b,.boot .day-b{animation:pop .5s var(--e-out) both;animation-delay:calc(var(--i,0)*40ms + 1.3s)}
.boot .nv,.boot .logo{animation:rise .6s var(--e-out) both;animation-delay:calc(var(--i,0)*28ms)}
.boot .nv .b{animation:bead 1.3s ease-out both;animation-delay:calc(var(--i)*70ms + .25s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 12px transparent}}
.ib .dot.new{animation:ping 1.1s ease-out 2}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes bulb{0%{opacity:0}35%{opacity:1;filter:brightness(1.7) drop-shadow(0 0 5px var(--c))}100%{opacity:1;filter:none}}
@keyframes bead{0%,100%{fill:var(--ink4)}40%{fill:var(--acc);filter:drop-shadow(0 0 4px var(--acc))}}
:root[data-mo="B"] .stag .row{animation:rise .5s var(--e-pop) both;animation-delay:calc(var(--i)*30ms)}

::view-transition-group(*){animation-duration:.44s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(stage){animation:vo .14s ease-out both}
::view-transition-new(stage){animation:vn .34s cubic-bezier(.22,1,.36,1) both}
::view-transition-old(ttl){animation:vo .12s ease-out both}
::view-transition-new(ttl){animation:vn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes vo{to{opacity:0}}
@keyframes vn{from{opacity:0;transform:translateY(8px)}}

/* ── narrow screens ── */
@container main (max-width:940px){
  .ro-body{grid-template-columns:minmax(0,1fr)}
  .gl{position:static}
  .lh,.row{grid-template-columns:62px minmax(130px,1.2fr) minmax(160px,1fr) 128px}
  .row .r-nx,.row .r-ac,.lh span:nth-child(4),.lh span:last-child{display:none!important}
}
@media (max-width:759px){
  #top{grid-template-columns:minmax(0,1fr);padding-top:18px}
  .clu{order:-1;justify-content:flex-end}
  .srch span,.srch kbd{display:none}
  .lh{display:none}
  .row{grid-template-columns:54px minmax(0,1fr) auto;gap:2px 12px;padding:13px 10px 14px;--rp:10px}
  .row .r-no{grid-row:1/3;align-self:start;font-size:17px;padding-top:1px}
  .row .r-st{grid-column:2/4;grid-row:2;padding:3px 9px;font-size:13px}
  .row .r-rd{font-size:12.5px}
  .tech{grid-template-columns:minmax(0,1fr);gap:30px}
  .ks{grid-template-columns:minmax(0,1fr);padding:22px 12px;margin:0 -12px}
  .op{margin:0 -10px}
  .op-h{padding:14px 10px;grid-template-columns:22px minmax(0,1fr) 22px}
  .op-m{grid-column:2/3;grid-row:2}
  .op-x{grid-column:2/3}
  .op-in{padding:4px 12px 20px 12px}
  .facts{grid-template-columns:1fr 1fr}
  .pt{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .pt span:nth-child(3){display:none}
  .road{--tw:150px}
  .stop{font-size:0;padding:7px 0}
  .stop.now{font-size:12px;overflow:visible}
  .win{padding:24px 20px 20px}
  #tune{top:auto;left:0;width:100vw;height:66dvh;border-radius:var(--r4) var(--r4) 0 0;transform:translateY(105%)}
  #stage{padding-bottom:170px}
  .tu-f pre{max-height:58px}
  .tu-f textarea{height:38px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:root[data-mo="C"] *,:root[data-mo="C"] *::before,:root[data-mo="C"] *::after{animation:none!important;transition:none!important}

  switch: a => { const l = ROS.filter(x => x.tech === 'MR' && x.no !== S.job && tone(x.st) !== 'rel' && x.ops.some(o => o[1] !== 'Complete')); pop(a, `<h4>Switch to</h4>` + (l.map(x => `<button class="mi" data-a="start" data-ro="${x.no}"><span class="r-no d num" style="font-size:15px;width:44px">${x.no}</span><span>${esc(x.cust)}<small>${esc(JOB[x.ops[curOp(x)][0]][0])}</small></span></button>`).join('') || '<div class="ask"><p>Nothing else is waiting on you.</p></div>')); },
  theme: () => { S.theme = dark() ? 'light' : 'dark'; applyMode(); light(); tuneSync(); if(S.v === 'kit') render(); },
  ask: a => pop(a, `<div class="ask"><p>Delete the 10:33 punch on RO 4466? The 3 h 59 min on it go too.</p><div><button class="btn sm q" data-a="closepop">Keep it</button><button class="btn sm q w" data-a="demo" data-m="Punch deleted" data-u="1">Delete</button></div></div>`),
  closepop: () => closePop(true),
  demo: a => { closePop(); toast(a.dataset.m, { tone: a.dataset.t, undo: a.dataset.u ? () => toast('Undone') : null }); },
  tune: () => { closePop(); const on = root.dataset.tune !== '1'; root.dataset.tune = on ? '1' : '0'; tuneSync(); setTimeout(marks, 300); },
  pick: a => { const k = a.dataset.k, o = a.dataset.o; if(S.p[k] === o) delete S.p[k]; else S.p[k] = o; if(k === 'mode') S.theme = null; save(); apply(); clu(); render(); tuneSync(); setTimeout(marks, 380); },
  rate: a => { const k = a.dataset.k, n = a.dataset.n, m = S.rate[k] = S.rate[k] || {}; if(m[n] === a.dataset.r) delete m[n]; else m[n] = a.dataset.r; save(); tuneSync(); },
  tnow: () => { S.tov = null; light(); tick(); tuneSync(); },
  boot: () => { closePop(); if(S.v !== 'rolist'){ S.v = 'rolist'; S.tab = 'open'; render(); scrollTo(0, 0); } boot(); },
  copy: a => { const t = picks(), done = () => { a.lastChild.textContent = 'Copied'; setTimeout(() => { a.lastChild.textContent = 'Copy for the chat'; }, 1600); }; const fb = () => { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); } catch(e) {} x.remove(); done(); }; try { navigator.clipboard.writeText(t).then(done, fb); } catch(e) { fb(); } },
  reset: () => { const p = S.p, r = S.rate; S.p = {}; S.rate = {}; S.theme = null; S.tov = null; save(); apply(); clu(); render(); tuneSync(); toast('Back to the recommended look', { undo: () => { S.p = p; S.rate = r; save(); apply(); clu(); render(); tuneSync(); } }); },
  demohold: () => toast('Held all the way: that is how you clock out', { tone: 'working' })
};

/* search: pages and repair orders, keys first */
function cmdOpen(a){
  const el = win(`<label>${ic('search')}<input type="text" placeholder="An RO number, a customer, a page" aria-label="Search" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></label><ul role="listbox"></ul>`, a, 'cmd'), inp = $('input', el), ul = $('ul', el); let sel = 0;
  const draw = () => { const q = inp.value.trim().toLowerCase(), hit = s => !q || s.toLowerCase().includes(q);
    const it = ROS.filter(r => hit(r.no + ' ' + r.cust + ' ' + r.unit)).slice(0, 6).map(r => `<button class="mi" data-a="open" data-ro="${r.no}"><span class="r-no d num">${r.no}</span><span>${esc(r.cust)}<small>${esc(r.st)}</small></span></button>`).concat(NAV.filter(n => hit(n[1])).slice(0, q ? 6 : 4).map(n => `<button class="mi" data-a="go" data-v="${n[0]}">${ic(n[0])}<span>${n[1]}</span><small>Page</small></button>`));
    sel = clamp(sel, 0, Math.max(0, it.length - 1)); ul.innerHTML = it.length ? it.map(x => `<li>${x}</li>`).join('') : `<li class="none" style="padding:22px 14px"><b style="font-size:15px">Nothing by that name</b>Try the last four of the RO number.</li>`; mk(); };
  const mk = () => $$('.mi', ul).forEach((b, i) => { b.classList.toggle('sel', i === sel); if(i === sel) b.scrollIntoView({ block: 'nearest' }); });
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', e => { const n = $$('.mi', ul).length; if(e.key === 'ArrowDown'){ sel = (sel + 1) % Math.max(1, n); mk(); e.preventDefault(); } else if(e.key === 'ArrowUp'){ sel = (sel - 1 + n) % Math.max(1, n); mk(); e.preventDefault(); } else if(e.key === 'Enter'){ const b = $$('.mi', ul)[sel]; if(b){ closeWin(); b.click(); } } });
  ul.addEventListener('click', () => closeWin(), true); draw();
}

/* ── listening ── */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'), hb = e.target.closest('[data-hold]');
  if(hb && Date.now() - S.held < 500) return;
  if(hb && !hb.dataset.a){ tipHide(); tipShow(hb); return; }
  if(!a) return;
  const f = ACT[a.dataset.a]; if(f) f(a, e);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); if(WIN && WIN.el.classList.contains('cmd')) closeWin(); else cmdOpen(document.activeElement); return; }
  if(e.key === 'Escape'){ if(POP) closePop(true); else if(WIN) closeWin(); else if(root.dataset.tune === '1') ACT.tune(); else if(typing) e.target.blur(); return; }
  if(POP && /^Arrow(Down|Up)$/.test(e.key)){ const m = $$('.mi', POP.el); if(m.length){ const i = m.indexOf(document.activeElement); m[(i + (e.key === 'ArrowDown' ? 1 : m.length - 1) + (i < 0 && e.key === 'ArrowUp' ? 1 : 0)) % m.length].focus(); e.preventDefault(); } return; }
  if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('row')){ ACT.open(e.target); return; }
  if(e.key === 'Enter' && typing && e.target.isContentEditable){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('pointerdown', e => { if(POP && !POP.el.contains(e.target) && !(POP.a && POP.a.contains(e.target))) closePop(); tipHide(); }, true);
/* press and hold: the ring fills, then it happens */
let HOLD = null;
const holdEnd = done => { if(!HOLD) return; const h = HOLD; HOLD = null; clearTimeout(h.t); h.el.classList.remove('dn'); if(done){ S.held = Date.now(); (ACT[h.el.dataset.hold] || clockOut)(h.el); } else if(Date.now() - h.at > 220){ S.held = Date.now(); tipHide(); tipShow(h.el); } };
const holdStart = el => { if(HOLD) return; const ms = still() ? 350 : 850; el.style.setProperty('--hold', ms + 'ms'); el.classList.add('dn'); HOLD = { el, at: Date.now(), t: setTimeout(() => holdEnd(true), ms) }; };
ACT.clockout = clockOut;
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if(b && !(e.button > 0)) holdStart(b); });
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => holdEnd(false)));
document.addEventListener('pointerout', e => { if(HOLD && !HOLD.el.contains(e.relatedTarget) && HOLD.el.contains(e.target)) holdEnd(false); });
document.addEventListener('keydown', e => { if((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.dataset && e.target.dataset.hold){ e.preventDefault(); holdStart(e.target); } });
document.addEventListener('keyup', e => { if(HOLD && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); const el = HOLD.el, quick = Date.now() - HOLD.at <= 220; holdEnd(false); if(quick && el.dataset.a) ACT[el.dataset.a](el); } });
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-hold]')) e.preventDefault(); });
/* tips, and the light that follows the pointer when Motion is Lively */
document.addEventListener('mouseover', e => { const a = e.target.closest('[data-tip]'); if(!a || a.contains(e.relatedTarget)) return; clearTimeout(tipT); tipT = setTimeout(() => { tipHide(); tipShow(a); }, Date.now() - tipAt < 400 ? 60 : 480); });
document.addEventListener('mouseout', e => { const a = e.target.closest('[data-tip]'); if(a && !a.contains(e.relatedTarget)) tipHide(); });
document.addEventListener('focusin', e => { const a = e.target.closest && e.target.closest('[data-tip]'); if(a && a.matches(':focus-visible')){ tipHide(); tipShow(a); } });
document.addEventListener('focusout', tipHide);
document.addEventListener('pointermove', e => { if(root.dataset.mo !== 'B' || e.pointerType === 'touch') return; const el = e.target.closest && e.target.closest('.row,.op,.ks'); if(!el) return; const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('.row,.op,.ks'); if(el && !el.contains(e.relatedTarget)){ el.style.removeProperty('--mx'); el.style.removeProperty('--my'); } });
document.addEventListener('input', e => { if(e.target.id === 'tm'){ S.tov = +e.target.value; $('#tm-v').textContent = fmtT(S.tov); light(); tick(); if(P('mode') === 'D') light(); } else if(e.target.id === 'nt'){ S.notes = e.target.value; save(); $('#pk').textContent = picks(); } });
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const n = innerWidth < 760 ? 'P' : P('nav'); if(root.dataset.nav !== n) root.dataset.nav = n; closePop(); marks(); }, 80); });
addEventListener('scroll', () => { tipHide(); }, { passive: true });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { light(); clu(); });

/* the shop keeps moving: two things arrive by themselves */
function arrive(n){
  if(POP || WIN || HOLD || (document.activeElement && document.activeElement.isContentEditable)){ setTimeout(() => arrive(n), 5000); return; }
  const r = ro(n ? '3503' : '4460'); if(!r || r.st !== (n ? 'Waiting – Customer' : 'Waiting – Parts')) return;
  if(n){ r.st = 'Waiting – Parts'; r.ops[0][1] = 'Complete'; r.next = 'Order the NOx sensor'; r.who = 'Ben'; r.stage = 3; r.part = .3; MSG.unshift(['customer', 'Customer approved RO 3503', 'Jenna Cho, just now', '3503']); }
  else { r.st = 'Hold Tech'; r.ops[0][1] = 'Hold Tech'; r.next = 'Start Op 1'; r.who = 'Mike'; r.stage = 4; r.part = .05; MSG.unshift(['done', 'Parts are in for RO 4460', 'Ben Okafor, just now', '4460']); }
  S.unread++; S.fresh = true; clu(); S.fresh = false; render(); toast(MSG[0][1], { tone: MSG[0][0] });
}
setTimeout(() => arrive(0), 24000); setTimeout(() => arrive(1), 64000);

/* ── start ── */
$('#tune-b').innerHTML = ic('sliders') + 'Tune the look';
$('#tune').innerHTML = tuneHtml(); $('#nt').value = S.notes;
road(); nav(); apply(); clu(); render(); tuneSync(); boot();
setInterval(tick, 1000);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(marks); setTimeout(marks, 600);
if(/[?&]tune=1/.test(location.search)) ACT.tune();
})();
</script>

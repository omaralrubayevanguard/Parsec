<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec New RO import</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{all:unset;cursor:pointer;height:26px;line-height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)} .chips button[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Parsec · New RO import — the plan, as a mock-up */
.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:22px}
.hd h2{margin:0;font:500 26px/32px var(--serif);letter-spacing:-.01em} .hd p{margin:4px 0 0;font-size:13.5px;color:var(--ink3);max-width:760px}
.sec-t{display:flex;align-items:baseline;gap:10px;margin:0 0 10px} .sec-t b{font:500 19px/24px var(--serif)} .sec-t small{font-size:12.5px;color:var(--ink3)}
/* the flow */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.st{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 14px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.st .n{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)} .st .n i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acct);color:var(--acctx);font:600 11.5px/1 var(--sans);font-style:normal}
.st b{font-size:14px;font-weight:600} .st p{margin:0;font-size:12.5px;line-height:18px;color:var(--ink2)}
.st:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:6px;height:6px;border-top:1.5px solid var(--ink4);border-right:1.5px solid var(--ink4);transform:translateY(-50%) rotate(45deg)}
/* the dialog + choices */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dlg{border-radius:18px;background:var(--panel);box-shadow:var(--raise);overflow:hidden;min-width:0}
.dh{display:flex;align-items:center;gap:12px;padding:16px 20px 14px;box-shadow:inset 0 -1px 0 var(--hair)}
.dh h3{margin:0;font:500 21px/26px var(--serif)} .dh small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.dh .tag{margin-left:auto}
.db{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:560px}
.imp{display:flex;flex-direction:column;gap:12px;padding:16px;box-shadow:inset -1px 0 0 var(--hair);background:var(--canvas)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border-radius:12px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--border);background:var(--panel);font-size:12.5px;color:var(--ink2)}
.drop b{font-size:13.5px;color:var(--ink)} .drop .ic{width:22px;height:22px;color:var(--ink3)} .drop small{color:var(--ink3);font-size:11.5px;line-height:16px}
.drop .row{display:flex;gap:6px;margin-top:4px}
.pcs{display:flex;flex-direction:column;gap:6px} .pcs > span{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.pc{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:12.5px}
.pc .th{width:30px;height:24px;border-radius:5px;background:var(--fill);display:grid;place-items:center;color:var(--ink3)} .pc .th .ic{width:14px;height:14px}
.pc b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pc small{display:block;color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ok{color:var(--good)} .pc.nw{box-shadow:inset 0 0 0 1.5px var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.sum span{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;background:var(--fill);color:var(--ink2)}
.sum span b{font-weight:600;color:var(--ink)}
.prv{font-size:11.5px;line-height:16px;color:var(--ink3);display:flex;gap:6px} .prv .ic{width:13px;height:13px;margin-top:1px}
.frm{min-width:0;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:10px;padding:10px 18px;box-shadow:inset 0 -1px 0 var(--hair)}
.fbar .mu{margin-left:auto}
.fs{padding:6px 18px 12px;max-height:620px;overflow:auto}
.grp{margin-top:10px} .grp > h4{display:flex;align-items:center;gap:8px;margin:6px 0 4px;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em;text-transform:uppercase}
.grp > h4 em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink4)}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:34px;padding:4px 8px;border-radius:8px;font-size:13px}
.fr:hover{background:var(--fill)} .fr > span:first-child{color:var(--ink3)} .fr .v{min-width:0;color:var(--ink)} .fr .v s{color:var(--ink4);margin-right:6px} .fr .v small{color:var(--ink3);margin-left:6px}
.fr.same .v{color:var(--ink3)} .fr.hide{display:none}
.acts{display:flex;gap:4px} .acts button{all:unset;cursor:pointer;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border)} .acts button.on{background:var(--primary);color:var(--onprimary);box-shadow:none}
.bd{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.bd.new{background:var(--good-t);color:var(--good)} .bd.upd{background:var(--warn-t);color:var(--warn)} .bd.kept{background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--border)} .bd.same{color:var(--ink4);font-weight:500} .bd.ask{background:var(--acct);color:var(--acctx)} .bd.nf{background:var(--fill);color:var(--ink3);font-weight:500}
.bd .ic{width:11px;height:11px}
/* operations and parts */
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden}
.oh{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 12px;background:var(--raised)}
.oh .no{font:600 12px/1 var(--mono);color:var(--ink3)} .oh b{font-weight:500;font-size:13.5px} .oh small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.oh .h{font:500 12.5px/1 var(--mono);color:var(--ink2);white-space:nowrap} .ap{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink2)} .ap.a{background:var(--good-t);color:var(--good)} .ap.p{background:var(--warn-t);color:var(--warn)}
.st2{padding:8px 12px 10px 46px;font-size:12.5px;color:var(--ink2);box-shadow:inset 0 1px 0 var(--hair)} .st2 b{font-weight:600;color:var(--ink)}
.pt{width:100%;border-collapse:collapse;font-size:12.5px} .pt th{font-size:11px;font-weight:600;color:var(--ink3);text-align:left;padding:6px 8px 4px;letter-spacing:.02em} .pt td{padding:5px 8px;box-shadow:inset 0 1px 0 var(--hair);color:var(--ink)} .pt td.m{font-family:var(--mono);font-size:12px;white-space:nowrap} .pt td:last-child{white-space:nowrap} .pt td.r,.pt th.r{text-align:right}
.pt tr.nwr td{background:color-mix(in srgb,var(--good-t) 70%,transparent)}
.ptw{padding:0 4px 4px 38px}
.note{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:7px 8px;font-size:12.5px;border-radius:8px} .note .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sel);font:600 9.5px/1 var(--sans);color:var(--ink2)}
.note .av.sys{background:var(--fill)} .note .av .ic{width:12px;height:12px} .note q{display:block;quotes:none;color:var(--ink2);margin-top:2px} .note time{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.tot div{padding:8px 10px;border-radius:10px;background:var(--raised);box-shadow:var(--shadow);font-size:12px;color:var(--ink3)} .tot b{display:block;margin-top:2px;font:500 15px/20px var(--mono);color:var(--ink)} .tot small{display:block;font-size:11px;margin-top:1px} .tot .ok{color:var(--good)} .tot .off{color:var(--warn)}
.df{display:flex;align-items:center;gap:10px;padding:12px 18px;box-shadow:inset 0 1px 0 var(--hair)} .df .mu{margin-right:auto}
.banner{display:flex;align-items:center;gap:10px;margin:10px 18px 0;padding:9px 12px;border-radius:10px;background:var(--good-t);color:var(--good);font-size:12.5px;font-weight:500} .banner button{all:unset;cursor:pointer;margin-left:auto;font-weight:600;text-decoration:underline}
/* choices */
.chs{position:sticky;top:70px;display:flex;flex-direction:column;gap:10px}
.ch{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.ch > b{font-size:13.5px;font-weight:600} .ch > small{font-size:12px;line-height:17px;color:var(--ink3);margin-top:-4px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;padding:7px 9px;border-radius:9px;font-size:12.5px;line-height:17px;color:var(--ink2)}
.opt:hover{background:var(--fill)} .opt i{width:14px;height:14px;margin-top:1.5px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)} .opt b{display:block;font-weight:500;color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--acct)} .opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.opt em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--acctx);margin-left:4px}
/* the field map */
.map{border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th{position:sticky;top:53px;background:var(--panel);text-align:left;font-size:11.5px;font-weight:600;color:var(--ink3);padding:10px 14px 8px;box-shadow:inset 0 -1px 0 var(--hair);letter-spacing:.02em}
.mt td{padding:8px 14px;box-shadow:inset 0 -1px 0 var(--hair);vertical-align:top} .mt td:first-child{color:var(--ink2);white-space:nowrap} .mt td small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.mt tr.gh td{background:var(--fill);font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;padding:7px 14px}
.mt .to{color:var(--ink)} .mt .ar{color:var(--ink4);width:24px;text-align:center}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec selecting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

.pg{height:calc(100vh - 53px);overflow:auto;background:var(--panel)}
.ph{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--hair)}
.ph h1{margin:0;font:500 24px/30px var(--serif)} .me{font-size:13px;color:var(--ink3)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 56px)}
.ls{box-shadow:inset -1px 0 0 var(--hair);padding:12px 8px} .rw{padding:12px 12px;border-radius:10px;font-size:13px;color:var(--ink2);opacity:.6} .rw.on{background:var(--sel);color:var(--ink);opacity:1;box-shadow:inset 2px 0 0 var(--acc)} .rw b{color:var(--ink3);font-weight:500;margin-right:4px}
.rp{min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;align-items:start}
.cm{min-width:0;display:flex;flex-direction:column;gap:16px;padding:18px 24px 120px}
.cr{position:sticky;top:56px;display:flex;flex-direction:column;gap:12px;padding:16px;box-shadow:inset 1px 0 0 var(--hair);min-height:calc(100vh - 110px)}
.mu{font-size:12px;color:var(--ink3)} .g{color:var(--good)}
/* the band */
.band{display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--fill));box-shadow:inset 0 0 0 1px var(--hair)}
.band img{width:200px;align-self:center;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))} .band .eb{font-size:12px;color:var(--ink3)} .band h2{margin:2px 0;font:500 22px/26px var(--serif)} .band .sub{font-size:13px;color:var(--ink2)}
.band .st{display:flex;align-items:center;gap:8px;margin-top:8px} .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--good-t);color:var(--good);font-size:12px;font-weight:500} .pill i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px} .acts .wide{flex:1 1 100%}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px} .stg i{height:4px;border-radius:2px;background:var(--hair)} .stg .d{background:var(--ink2)} .stg .n{background:var(--acc)}
/* operations */
.sech{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:32px} .sech h3{margin:0;font:500 19px/24px var(--serif)} .sech .n{font-size:13px;color:var(--ink3)} .sech small{font-size:12px;color:var(--ink3)} .sech .btn.on{background:var(--primary);color:var(--onprimary);box-shadow:none}
.ol{display:flex;flex-direction:column;gap:2px}
.oh{display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:10px;transition:background-color .14s}
.o.open > .oh{background:var(--sel)} .o.run > .oh{background:linear-gradient(90deg,var(--good-t),transparent 80%)} .o.sel > .oh{background:color-mix(in srgb,var(--acc) 14%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 55%,transparent)}
.ot{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:14px 14px minmax(0,1fr) auto 108px;align-items:center;gap:10px;min-height:46px;padding:6px 6px}
.os{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ink3)} .os.run{box-shadow:none;background:var(--good)} .os.wt{box-shadow:inset 0 0 0 2px var(--warn)} .os.dn{box-shadow:none;background:var(--good);color:#fff}
.on{font-size:12px;color:var(--ink3);text-align:center}
.oc{min-width:0;display:flex;flex-direction:column} .oc b{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .oc small{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .o.run .oc small{color:var(--good)} .o.wait .oc small{color:var(--warn)} .o.done .oc b{color:var(--ink3)}
.ty{display:inline-grid;place-items:center;height:18px;padding:0 6px;border-radius:5px;font:600 10px/1 var(--sans);letter-spacing:.04em;background:var(--acct);color:var(--acctx)} .ty.diag{background:var(--warn-t);color:var(--warn)} .ty.pm{background:var(--good-t);color:var(--good)}
.hb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);white-space:nowrap} .hb .bar{flex:1;height:4px;border-radius:2px;background:var(--hair);overflow:hidden} .hb .bar i{display:block;height:100%;background:var(--ink2)}
.ib{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--ink2);flex:none} .ib.on{background:var(--good);color:#fff} .ib0{width:30px;flex:none}
/* the boxes */
.ck{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--border);color:var(--onprimary);transition:background-color .12s,box-shadow .12s}
.ck:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)} .ck.on{background:var(--acc);box-shadow:none} .ck.mid{background:var(--acc);box-shadow:none} .ck.mid i{width:8px;height:2px;border-radius:1px;background:var(--onprimary)}
.ck:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ops.hov .oh > .ck,.ops.hov .pr > .ck,.ops.hov .pth > .ck,.ops.hov .sech > .ck{opacity:0;transition:opacity .12s} .ops.hov .oh:hover > .ck,.ops.hov .pr:hover > .ck,.ops.hov .ck.on,.ops.hov.any .ck,.ops.hov .sech:hover > .ck{opacity:1}
/* an open operation */
.ob{padding:10px 4px 14px 30px;display:flex;flex-direction:column;gap:10px}
.tm{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--hair)} .tm b{display:block;font-size:22px;font-weight:500} .tm small{font-size:12px;color:var(--ink3)} .tm .n{display:flex;gap:20px;margin-left:auto} .tm .n span{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink3)} .tm .n b{font-size:16px;color:var(--ink)}
.tabs{display:flex;gap:20px;box-shadow:inset 0 -1px 0 var(--hair)} .tabs button{all:unset;cursor:pointer;padding:8px 0;font-size:13.5px;color:var(--ink2)} .tabs button i{font-style:normal;font-size:11.5px;color:var(--ink3);margin-left:4px} .tabs button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--ink)}
.pth{display:flex;align-items:center;gap:10px;padding:6px 8px 2px;font-size:12px;color:var(--ink3)}
.pr{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;box-shadow:inset 0 -1px 0 var(--hair);transition:background-color .12s} .pr.sel{background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:none}
.pr .n{flex:1;min-width:0} .pr b{display:block;font-size:13px;font-weight:500} .pr small{font-size:11.5px;color:var(--ink3)}
.ps{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap} .ps i{width:7px;height:7px;border-radius:50%;background:var(--ink4)} .ps.wt i{background:var(--warn)} .ps.wt{color:var(--warn)} .ps.st i{background:var(--acc)} .ps.ok{color:var(--good)} .ps.ok i{background:var(--good)}
.lk{all:unset;cursor:pointer;font-size:12.5px;color:var(--ink2)} .lk:hover{color:var(--ink);text-decoration:underline} .lk.add{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.none{margin:4px 0;font-size:12.5px;color:var(--ink3)}
.tl{padding:4px 0 4px 16px;position:relative} .tl::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:2px;background:var(--good-t)} .te{position:relative;display:flex;gap:8px;padding:4px 0;font-size:12.5px;color:var(--ink2)} .te i{position:absolute;left:-16px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--good)} .te b{min-width:58px;font-size:12px} .te em{margin-left:auto;font-style:normal;color:var(--good)} .tn{display:grid;grid-template-columns:52px 1fr;gap:8px;margin:2px 0;padding:6px 10px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px} .tn small{color:var(--ink4)}
.cd{border-radius:14px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden} .cd-h{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;box-shadow:inset 0 -1px 0 var(--hair);font-size:13.5px} .cd-h small{font-size:12px;color:var(--ink3)} .cd-b{padding:4px 6px 8px}
/* the selection bar */
.sb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:var(--primary);color:var(--onprimary);animation:sbin .16s var(--ease)}
@keyframes sbin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sb .bi{display:flex;flex-direction:column;margin-right:6px;line-height:1.2} .sb .bi b{font-size:13px} .sb .bi small{font-size:11px;opacity:.7}
.sb .btn{background:color-mix(in srgb,var(--onprimary) 12%,transparent);color:var(--onprimary);box-shadow:none} .sb .btn:hover{background:color-mix(in srgb,var(--onprimary) 22%,transparent)} .sb .btn.pri{background:var(--onprimary);color:var(--primary)} .sb .btn:disabled{opacity:.4}
.sb .lk{color:var(--onprimary);opacity:.8}
.sb.float{position:fixed;z-index:40;left:calc(232px + 300px + (100vw - 232px - 300px - 290px) / 2);bottom:18px;transform:translateX(-50%);max-width:calc(100vw - 232px - 300px - 300px);box-shadow:0 16px 40px -14px rgba(0,0,0,.5)}
.sb.head{margin:0 0 8px}
.sb.menu{margin:0 0 8px}
.mn{position:fixed;z-index:80;min-width:250px;padding:6px;border-radius:14px;background:var(--raised);box-shadow:var(--raise);animation:sbin .14s var(--ease)}
.mn-h{padding:6px 10px 8px;font-size:12px;color:var(--ink3)}
.mn button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:8px;font-size:13px} .mn button:hover{background:var(--fill)} .mn button b{font-weight:500} .mn button small{margin-left:auto;font-size:11.5px;color:var(--ink3)} .mn button:disabled{opacity:.4}
/* picks */
#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{all:unset;cursor:pointer;height:26px;line-height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)} .chips button[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}

function toast(m, u){ var t = $(".toast"); if(t) t.remove(); t = D.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = "<span>" + m + "</span>" + (u ? '<button data-undo="1">' + ic("undo", 13) + "Undo</button>" : ""); D.body.appendChild(t); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.remove(); }, 4200); }

/* ---------- doing it on the selection ---------- */
function act(kind, a, el){
  var L, n;
  if(kind === "o"){ L = Object.keys(V.selO).map(op); n = L.length;
    if(a === "hold"){ var r = el.getBoundingClientRect(); V.menu = { k: "hold", x: r.left, y: r.bottom + 6, top: r.top }; draw(); return; }

    toast(msg); return; }
  L = Object.keys(V.selP).map(partOf); n = L.length;
  if(a === "move"){ var r2 = el.getBoundingClientRect(); V.menu = { k: "move", x: r2.left, y: r2.bottom + 6, top: r2.top }; draw(); return; }
  if(a === "pick" || a === "inst" || a === "ret"){ snap(a); var did = 0, skip = 0; L.forEach(function(x){ var s = x.p[4];
      if(a === "pick" && s === "stg"){ x.p[4] = "pick"; did++; } else if(a === "inst" && (s === "pick" || s === "rec" || s === "stg")){ x.p[4] = "inst"; did++; } else if(a === "ret" && s !== "inst"){ x.p[4] = "ret"; did++; } else skip++; });
    V.selP = {}; draw(); toast(did + " part" + (did === 1 ? "" : "s") + " " + { pick: "picked up", inst: "installed", ret: "going back to Parts" }[a] + (skip ? " · " + skip + " skipped (" + (a === "pick" ? "not staged" : a === "inst" ? "not in hand" : "already installed") + ")" : "") + ".", true); return; }
  toast({ askp: "Asked Ben (Parts) about " + n + " part" + (n === 1 ? "" : "s") + " — the list goes in his Inbox.", pns: "Copied " + n + " part number" + (n === 1 ? "" : "s") + ".", "pick-list": "Prints a pick list of the " + n + " for the counter." }[a]); }
function toggle(kind, id, ev){
  var M = kind === "o" ? V.selO : V.selP, ids = kind === "o" ? S.ops.map(function(o){ return o.id; }) : (V.reach === "ro" ? [].concat.apply([], S.ops.map(function(o){ return o.parts.map(function(p){ return p[0]; }); })) : (op(V.open) || { parts: [] }).parts.map(function(p){ return p[0]; }));
  if(kind === "p" && V.reach === "op"){ var x = partOf(id); if(x && x.o.id !== V.open) return; }
  if(ev && ev.shiftKey && V.last && V.last.k === kind){ var a = ids.indexOf(V.last.id), b = ids.indexOf(id); if(a > -1 && b > -1){ ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(function(i){ M[i] = 1; }); V.last = { k: kind, id: id }; draw(); return; } }
  if(M[id]) delete M[id]; else M[id] = 1;
  if(kind === "o") V.selP = {}; else V.selO = {};
  V.last = { k: kind, id: id }; draw(); }
D.addEventListener("click", function(e){
  var t = e.target, b;
  if(V.menu && !t.closest(".mn") && !t.closest("[data-act]") && !t.closest("[data-menu]")){ V.menu = null; draw(); }
  if((b = t.closest("[data-how]"))){ V.how = b.getAttribute("data-how"); V.mode = false; draw(); return; }

  if((b = t.closest("[data-ck]"))){ toggle(b.getAttribute("data-ck"), b.getAttribute("data-id"), e); return; }

    if(k === "o"){ var all = S.ops.every(function(o){ return V.selO[o.id]; }); V.selO = {}; if(!all) S.ops.forEach(function(o){ V.selO[o.id] = 1; }); V.selP = {}; }
    else { var o0 = op(b.getAttribute("data-id")), all2 = o0.parts.every(function(p){ return V.selP[p[0]]; }); o0.parts.forEach(function(p){ if(all2) delete V.selP[p[0]]; else V.selP[p[0]] = 1; }); V.selO = {}; }
    draw(); return; }
  if((b = t.closest("[data-open]"))){ var id = b.getAttribute("data-open");
    if(V.how === "hover" && (e.ctrlKey || e.metaKey || e.shiftKey)){ toggle("o", id, e); return; }
    if((V.how === "mode" && V.mode)){ toggle("o", id, e); return; }
    V.open = V.open === id ? null : id; if(V.reach === "op") V.selP = {}; draw(); return; }
  if((b = t.closest("[data-prow]")) && (V.how === "hover" && (e.ctrlKey || e.metaKey || e.shiftKey) || (V.how === "mode" && V.mode)) && !t.closest("[data-ck]")){ toggle("p", b.getAttribute("data-prow"), e); return; }
  if((b = t.closest("[data-tab]"))){ V.tab = b.getAttribute("data-tab"); draw(); return; }
  if((b = t.closest("[data-clear]"))){ if(b.getAttribute("data-clear") === "o") V.selO = {}; else V.selP = {}; V.menu = null; draw(); return; }
  if((b = t.closest("[data-menu]"))){ var r = b.getBoundingClientRect(); V.menu = V.menu ? null : { k: b.getAttribute("data-menu"), x: r.left, y: r.bottom + 6, top: r.top }; draw(); return; }
  if((b = t.closest("[data-act]"))){ if(b.disabled) return; var p = b.getAttribute("data-act").split(":"); if(V.menu && V.menu.k === p[0]) V.menu = null; act(p[0], p[1], b); return; }
  if((b = t.closest("[data-hold]"))){ var L = Object.keys(V.selO).map(op); snap("hold"); L.forEach(function(o){ if(o.st !== "done"){ o.st = "wait"; o.why = b.getAttribute("data-hold").replace("Waiting – ", ""); } }); V.selO = {}; V.menu = null; draw(); toast(L.length + " on hold — " + b.getAttribute("data-hold").toLowerCase() + ". One note goes to whoever has it.", true); return; }
  if((b = t.closest("[data-moveto]"))){ var to = op(b.getAttribute("data-moveto")), L2 = Object.keys(V.selP).map(partOf); snap("move parts"); L2.forEach(function(x){ if(x.o === to) return; x.o.parts = x.o.parts.filter(function(p){ return p !== x.p; }); to.parts.push(x.p); }); V.selP = {}; V.menu = null; draw(); toast(L2.length + " part" + (L2.length === 1 ? "" : "s") + " moved to Op " + to.n + ".", true); return; }

  if((b = t.closest("[data-pk]"))){ var k2 = b.getAttribute("data-pk"); if(k2 === "x"){ V.picks = false; pkDraw(); return; } if(k2 === "copy"){ var tx = pkText(); try{ navigator.clipboard.writeText(tx).then(function(){ toast("Copied — paste it in the chat."); }, function(){ toast("Select the text and copy it."); }); }catch(x2){ toast("Select the text and copy it."); } return; }
    var pa = k2.split(":"); (pa[0] === "o" ? V.opA : V.ptA)[pa[1]] = (pa[0] === "o" ? V.opA : V.ptA)[pa[1]] ? 0 : 1; draw(); return; }
});

  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;

/* ---------- your picks ---------- */

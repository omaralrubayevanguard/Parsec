<!doctype html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec · RO global settings</title>
<style>
/* ---------- tokens: two themes (rename to the app's own, e.g. Ivory / Graphite) ---------- */
:root,[data-th="light"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--warn:#AD7210;--bad:#C0503F;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="dark"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--warn:#E2A84C;--bad:#EC7F6C;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Inter","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* ---------- the frame (prefix ip- so the drawn visuals' classes can't collide) ---------- */
.ip-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.ip-bar h1{margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;font:500 19px/24px var(--serif)}
.ip-bar h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ip-jump{display:flex;gap:2px;flex-wrap:wrap} .ip-jump a{padding:4px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);text-decoration:none} .ip-jump a:hover{background:var(--fill)}
.ip-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.ip-seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)} .ip-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.ip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--sans)}
.ip-btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .ip-btn em{font-style:normal;opacity:.7;font-size:11px}
.ip-btn:focus-visible,.ip-opt:focus-visible,.ip-seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ip-wrap{max-width:1500px;margin:0 auto;padding:18px 16px 120px}
.ip-now{margin:0 0 20px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)} .ip-now h2{margin:0 0 8px;font:500 15px/1 var(--serif)}
.ip-lead{margin:0 2px 18px;color:var(--ink2)}
.ip-sec{margin:0 0 26px;scroll-margin-top:64px} .ip-sec h2{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font:500 22px/28px var(--serif)} .ip-sec h2 small{font:400 12.5px var(--sans);color:var(--ink3)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px} @media (max-width:980px){.ip-grid{grid-template-columns:1fr}}
.ip-idea{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.ip-idea.picked{box-shadow:0 0 0 1.5px var(--accl),var(--shadow)}
.ip-idea h3{margin:0;font:600 15px/20px var(--sans)} .ip-idea header p{margin:3px 0 0;font-size:12.5px;line-height:17px;color:var(--ink3)}
.ip-vis{position:relative;min-height:96px;padding:12px;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;overflow:hidden}
.ip-hint{position:absolute;left:8px;bottom:8px;z-index:5;padding:3px 8px;border-radius:7px;background:var(--raised);box-shadow:var(--shadow);font-size:11px;color:var(--ink3);pointer-events:none}
.ip-vis.ip-has .ip-hint,.ip-vis.ip-skip .ip-hint,.ip-vis:not(.ip-has) .ip-replay{display:none}
.ip-vis.ip-skip>*:not(.ip-replay){opacity:.45}
.ip-replay{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;z-index:5;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink3);font-size:11px}
.ip-ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px}
.ip-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:16px;color:var(--ink2)}
.ip-opt:hover{background:var(--fill)} .ip-opt i{width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.ip-opt b{display:block;font-weight:500;color:var(--ink)} .ip-opt small{display:block;font-size:11.5px;color:var(--ink3)}
.ip-opt[aria-pressed="true"]{background:var(--acct)} .ip-opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
#ip-picks{position:fixed;z-index:85;right:16px;top:62px;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#ip-picks[hidden]{display:none}
#ip-picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);white-space:pre-wrap}
#ip-picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font-size:13px;resize:vertical;outline:none}
.ip-ph{display:flex;align-items:center;font:500 18px/1 var(--serif)} .ip-ph b{flex:1;font-weight:500} .ip-ph button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.ip-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise)}
@media (max-width:640px){ .ip-grid{grid-template-columns:1fr} #ip-picks{left:16px;right:16px;width:auto} .ip-bar h1 small{display:none} }

/* ---------- the drawn visuals (v-) · [data-step] = the step playing · .ip-s-<step> = every step reached · [data-opt] = the option picked ---------- */
.ip-vis{padding:0}
.v-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px}
.v-now div{display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:17px;color:var(--ink2)} .v-now b{font-weight:600;color:var(--ink)} .v-now i{font-style:normal;font-weight:600}
.v-st{position:relative;height:230px;padding:12px;overflow:hidden;font-size:12px}
.v-st.h-s{height:180px} .v-st.h-l{height:272px}
.v-cur{position:absolute;left:calc(100% - 70px);top:calc(100% - 34px);width:14px;height:14px;z-index:30;pointer-events:none;transition:left .55s cubic-bezier(.2,.75,.25,1),top .55s cubic-bezier(.2,.75,.25,1)}
.v-cur::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,64% 94%,44% 66%,80% 66%);background:var(--ink);filter:drop-shadow(0 0 1px var(--raised))}
.v-cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.3)}
[data-step^="c-"] .v-cur::after{animation:v-ripple .45s ease-out}
@keyframes v-ripple{0%{opacity:.4;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.v-lk{position:relative}
.v-lk>.v-cur{left:150px;top:64px}
.v-b{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 11.5px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background .2s,color .2s,opacity .3s}
.v-b.pri{background:var(--primary);color:var(--onprimary);box-shadow:none}
.v-ic{width:13px;height:13px;flex:none;vertical-align:-2px}
.v-pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--fill);color:var(--ink2)}
.v-pill::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.v-pill.good{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)} .v-pill.work{background:color-mix(in srgb,#3F6FD1 14%,var(--panel));color:#3F6FD1}
[data-th="dark"] .v-pill.work{color:#86A8F0}
.v-row{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 10px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);margin-bottom:6px;font-size:12px;white-space:nowrap;overflow:hidden}
.v-row .m,.m{font:500 11px var(--sans);color:var(--ink3)} .v-row .m{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.v-no{font:600 11.5px/1.2 var(--mono);letter-spacing:.01em;color:var(--ink);border-bottom:1.5px solid transparent;transition:color .25s,border-color .25s;white-space:nowrap}
.v-src{width:64px;flex:none;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.v-pgc{font:500 16px/20px var(--serif);color:var(--ink)} .v-pgc.sm{font-size:14px;line-height:18px}
.v-pgl{font-size:11px;line-height:15px;color:var(--ink3)}
.v-th{position:relative;display:inline-block;width:46px;height:30px;flex:none} .v-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.v-toast{position:absolute;left:50%;bottom:12px;z-index:25;padding:7px 12px;border-radius:9px;background:var(--primary);color:var(--onprimary);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;transform:translate(-50%,8px);transition:opacity .25s,transform .25s}
.v-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:24;display:flex;flex-direction:column;min-width:170px;padding:4px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);font:400 12px/1 var(--sans);color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
.v-menu span{padding:7px 9px;border-radius:7px;white-space:nowrap} .v-menu span:first-child{background:var(--fill)}
.v-tip{position:absolute;left:0;top:calc(100% + 7px);z-index:24;padding:6px 9px;border-radius:7px;background:var(--primary);color:var(--onprimary);font:500 11.5px/1.2 var(--sans);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}
/* a mini RO page that slides in from the right */
.v-pg{position:absolute;top:8px;right:8px;bottom:8px;width:min(58%,240px);z-index:20;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:var(--raise);transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.2,.75,.25,1)}
.ip-s-open .v-pg{transform:none}
.v-pgh{display:flex;gap:6px;align-items:baseline;padding-bottom:7px;font-size:11px;color:var(--ink3);box-shadow:inset 0 -1px 0 var(--hair)} .v-pgh b{font:600 11px var(--mono);color:var(--ink)} .v-pgh i{font-style:normal}
.v-pgi{display:block;width:100%;height:76px;object-fit:contain;margin:8px 0 4px}
.v-h-s .v-pgi,.h-s .v-pgi{height:52px}
/* a message */
.v-msg{display:flex;gap:9px;max-width:360px;padding:10px 12px;border-radius:11px;background:var(--panel);box-shadow:var(--shadow)}
.v-av{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:10px;font-weight:700;color:var(--ink2)}
.v-mt{font-size:11px;color:var(--ink3)} .v-mt b{color:var(--ink);font-weight:600}
.v-mb{margin-top:3px;font-size:12.5px;line-height:20px}

/* 1 · where */
.v-where .v-tx{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.v-where .n4{font:inherit;font-weight:600;color:var(--ink)}
.ip-s-l1 .v-where .n1,.ip-s-l2 .v-where .n2,.ip-s-l3 .v-where .n3,[data-opt="text"].ip-s-l4 .v-where .n4{color:var(--acc);border-bottom-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.ip-s-p-go .v-where .v-cur{left:116px;top:58px}
/* 2 · look */
.v-look{padding-top:22px}
.v-ar{display:none;margin-left:2px;font:600 11px var(--sans);font-style:normal}
[data-opt="acc"] .v-look .v-no{color:var(--acc)}
.ip-s-point .v-look .v-no{color:var(--acc)} [data-opt="hover"].ip-s-point .v-look .v-no,[data-opt="acc"].ip-s-point .v-look .v-no{border-bottom-color:currentColor}
[data-opt="arrow"].ip-s-point .v-look .v-ar{display:inline}
.ip-s-point .v-look .v-lk>.v-cur{left:28px;top:9px}
/* 3 · peek */
.ip-s-point .v-peekw .v-no.v-lk{color:var(--acc);border-bottom-color:currentColor}
.ip-s-point .v-peekw .v-lk>.v-cur{left:30px;top:9px}
.v-peek{position:absolute;left:44px;top:78px;z-index:15;display:flex;gap:10px;width:min(330px,calc(100% - 56px));padding:10px;border-radius:12px;background:var(--raised);box-shadow:var(--raise);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s}
.v-peek>img{width:96px;height:64px;object-fit:contain;flex:none}
.v-pkr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0}
.ip-s-peek .v-peekw .v-peek{opacity:1;transform:none} .ip-s-open .v-peekw .v-peek{opacity:0}
[data-opt="click"] .v-peekw .v-peek{display:none}
.v-key{position:absolute;left:12px;bottom:12px;padding:4px 8px;border-radius:6px;background:var(--raised);box-shadow:inset 0 -2px 0 var(--border),0 0 0 1px var(--border);font:600 11px var(--sans);opacity:0;transition:opacity .2s}
[data-opt="shift"].ip-s-point .v-key{opacity:1} [data-opt="shift"].ip-s-open .v-key{opacity:0}
/* 4 · on the RO page itself */
.v-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:38px;padding:7px 12px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:12px}
.v-crumb{color:var(--ink3)} .v-sl{font-style:normal;color:var(--ink3)} .v-cnt{font-size:11px;color:var(--ink3)}
.v-mini{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);max-width:290px} .v-mini img{width:70px;height:46px;object-fit:contain}
.ip-s-point .v-self .v-lk>.v-cur{left:30px;top:8px}
[data-opt="copy"].ip-s-done .v-self .v-toast{opacity:1;transform:translate(-50%,0)}
[data-opt="menu"].ip-s-done .v-self .v-menu{opacity:1;transform:none}
.v-nop{position:absolute;left:12px;bottom:14px;font-size:11.5px;color:var(--ink3);opacity:0;transition:opacity .25s}
[data-opt="plain"].ip-s-done .v-self .v-nop{opacity:1}

/* 5 · the same picture everywhere */
.v-tc{position:absolute;left:12px;top:12px;bottom:12px;width:136px;padding:8px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.v-big{position:relative;height:84px} .v-big img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .4s}
.v-big .b,.v-th .b{opacity:0}
.v-cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink2)}
.v-tcn{margin-top:6px}
.v-alt{position:absolute;left:4px;right:4px;top:96px;z-index:12;padding:7px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
.v-alt small{display:block;margin-bottom:5px;font-size:10.5px;font-weight:600;color:var(--ink3)}
.v-ao{display:inline-block;width:50px;height:34px;margin-right:4px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--hair)} .v-ao img{width:100%;height:100%;object-fit:contain}
.v-ao:first-of-type{box-shadow:inset 0 0 0 2px var(--accl)}
.v-pl{position:absolute;left:160px;right:12px;top:12px}
.v-pr{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;margin-bottom:6px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);white-space:nowrap;overflow:hidden}
.v-pr .v-src{width:66px} .v-prt{font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.v-pr.nw .v-th{opacity:0;transition:opacity .35s}
.v-new{margin-left:auto;padding:1px 6px;border-radius:5px;background:var(--acct);color:var(--acc);font-size:10px;font-weight:700;opacity:0;transition:opacity .3s}
[data-opt="all"].ip-s-add .v-picw .v-pr.nw .v-th,[data-opt="all"].ip-s-add .v-picw .v-new{opacity:1}
.ip-s-p-cam .v-picw .v-cur{left:132px;top:86px}
.ip-s-c-cam .v-picw .v-alt{opacity:1;transform:none}
.ip-s-p-pick .v-picw .v-cur{left:88px;top:134px}
.ip-s-c-pick .v-picw .v-ao:first-of-type{box-shadow:inset 0 0 0 1px var(--hair)} .ip-s-c-pick .v-picw .v-ao.g{box-shadow:inset 0 0 0 2px var(--acc)}
.ip-s-big .v-picw .v-alt{opacity:0}
.ip-s-big .v-picw .v-big .a{opacity:0} .ip-s-big .v-picw .v-big .b{opacity:1}
.ip-s-s1 .v-picw .r1 .a,.ip-s-s2 .v-picw .r2 .a,.ip-s-s3 .v-picw .r3 .a,.ip-s-s4 .v-picw .r4 .a,.ip-s-s5 .v-picw .r5 .a{opacity:0}
.ip-s-s1 .v-picw .r1 .b,.ip-s-s2 .v-picw .r2 .b,.ip-s-s3 .v-picw .r3 .b,.ip-s-s4 .v-picw .r4 .b,.ip-s-s5 .v-picw .r5 .b{opacity:1}
.ip-s-big .v-picw .v-cur{left:96px;top:226px}
/* 6 · Shop view top view */
.v-topw{display:flex;align-items:center;gap:10px}
.v-side,.v-bay{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.v-side small,.v-bay small{font-size:10.5px;font-weight:600;color:var(--ink3)}
.v-side img{width:100%;height:92px;object-fit:contain}
.v-eq{position:relative;width:22px;height:26px;flex:none;font:600 22px/26px var(--sans);text-align:center}
.v-eq span{position:absolute;inset:0;opacity:0;transition:opacity .25s} .v-eq .ne{color:var(--bad)} .v-eq .eq{color:var(--good)}
.ip-s-look .v-topw .ne{opacity:1}
.v-bt{position:relative;height:92px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--fill) 0 6px,transparent 6px 12px);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.v-bl{position:absolute;left:6px;top:4px;z-index:2;font:600 10px var(--mono);color:var(--ink3)}
.v-bt img{position:absolute;left:50%;top:50%;transition:opacity .4s}
.v-bt .x{width:86%;transform:translate(-50%,-50%)}
.v-bt .t{width:52px;height:auto;transform:translate(-50%,-50%) rotate(-90deg)}
.v-bt .s{width:76%;transform:translate(-50%,-50%)}
.v-bt .t,.v-bt .s{opacity:0}
.ip-s-look .v-topw .x{box-shadow:0 0 0 2px var(--bad)}
[data-opt="match"].ip-s-swap .v-topw .x,[data-opt="side"].ip-s-swap .v-topw .x{opacity:0}

  w.innerHTML = '<div class="ip-ph"><b>Your picks</b><button data-pk="x" aria-label="Close">✕</button></div><pre>' + esc(pkText()) + '</pre><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)">Anything else<textarea id="ip-note" placeholder="Anything to add or change">' + esc(V.note) + '</textarea></label><button class="ip-btn pri" data-pk="copy" style="justify-content:center;height:34px">Copy for the chat</button>';
}
function toast(m) { var t = $('.ip-toast'); if (t) t.remove(); t = D.createElement('div'); t.className = 'ip-toast'; t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function () { t.remove(); }, 2600); }
function copy(tx) {
  var fb = function () { var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try { D.execCommand('copy'); toast('Copied — paste it in the chat.'); } catch (e) { toast('Select the text and copy it.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Copied — paste it in the chat.'); }, fb); else fb();
}
D.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('.ip-seg button'))) { V.th = b.dataset.th; save(); sync(); return; }
  if (t.closest('#ip-open')) { V.open = !V.open; draw(); return; }
  if ((b = t.closest('[data-pk]'))) { if (b.dataset.pk === 'x') { V.open = false; draw(); } else copy(pkText()); return; }
  if ((b = t.closest('.ip-replay'))) { var vis = b.closest('.ip-vis'); play(vis, find(vis.closest('.ip-idea').dataset.k)); return; }
  if ((b = t.closest('.ip-opt'))) { var k = b.dataset.k, v = b.dataset.v; if (V.v[k] === v) delete V.v[k]; else V.v[k] = v; save(); sync(); draw();
    var vs = $('.ip-idea[data-k="' + k + '"] .ip-vis'), it = find(k), nv = V.v[k]; setOpt(vs, nv); if (nv && nv !== 'skip') play(vs, it); else rest(vs, it, 0); }
});
D.addEventListener('input', function (ev) { if (ev.target.id === 'ip-note') { V.note = ev.target.value; save(); var p = $('#ip-picks pre'); if (p) p.textContent = pkText(); } });
D.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.open) { V.open = false; draw(); } });
sync();
</script>

<!doctype html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec · RO page, clock and notes</title>
<style>
/* ---------- tokens: two themes (rename to the app's own, e.g. Ivory / Graphite) ---------- */
:root,[data-th="light"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--warn:#AD7210;--bad:#C0503F;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="dark"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--warn:#E2A84C;--bad:#EC7F6C;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Inter","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* ---------- the frame (prefix ip- so the drawn visuals' classes can't collide) ---------- */
.ip-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.ip-bar h1{margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;font:500 19px/24px var(--serif)}
.ip-bar h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ip-jump{display:flex;gap:2px;flex-wrap:wrap} .ip-jump a{padding:4px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);text-decoration:none} .ip-jump a:hover{background:var(--fill)}
.ip-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.ip-seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)} .ip-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.ip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--sans)}
.ip-btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .ip-btn em{font-style:normal;opacity:.7;font-size:11px}
.ip-btn:focus-visible,.ip-opt:focus-visible,.ip-seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ip-wrap{max-width:1500px;margin:0 auto;padding:18px 16px 120px}
.ip-now{margin:0 0 20px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)} .ip-now h2{margin:0 0 8px;font:500 15px/1 var(--serif)}
.ip-lead{margin:0 2px 18px;color:var(--ink2)}
.ip-sec{margin:0 0 26px;scroll-margin-top:64px} .ip-sec h2{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font:500 22px/28px var(--serif)} .ip-sec h2 small{font:400 12.5px var(--sans);color:var(--ink3)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px} @media (max-width:980px){.ip-grid{grid-template-columns:1fr}}
.ip-idea{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.ip-idea.picked{box-shadow:0 0 0 1.5px var(--accl),var(--shadow)}
.ip-idea h3{margin:0;font:600 15px/20px var(--sans)} .ip-idea header p{margin:3px 0 0;font-size:12.5px;line-height:17px;color:var(--ink3)}
.ip-vis{position:relative;min-height:96px;padding:12px;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;overflow:hidden}
.ip-replay{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;z-index:5;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink3);font-size:11px}
.ip-ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px}
.ip-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:16px;color:var(--ink2)}
.ip-opt:hover{background:var(--fill)} .ip-opt i{width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.ip-opt b{display:block;font-weight:500;color:var(--ink)} .ip-opt small{display:block;font-size:11.5px;color:var(--ink3)}
.ip-opt[aria-pressed="true"]{background:var(--acct)} .ip-opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
#ip-picks{position:fixed;z-index:85;right:16px;top:62px;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#ip-picks[hidden]{display:none}
#ip-picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);white-space:pre-wrap}
#ip-picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font-size:13px;resize:vertical;outline:none}
.ip-ph{display:flex;align-items:center;font:500 18px/1 var(--serif)} .ip-ph b{flex:1;font-weight:500} .ip-ph button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.ip-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise)}
@media (max-width:640px){ .ip-grid{grid-template-columns:1fr} #ip-picks{left:16px;right:16px;width:auto} .ip-bar h1 small{display:none} }

/* ---------- the drawn visuals (v-) · each card's stage animates with [data-step] on .ip-vis ---------- */
.ip-vis{padding:0}
.v-st{position:relative;height:230px;padding:12px;overflow:hidden}
.v-st.h-s{height:190px} .v-st.h-l{height:300px}
.v-cur{position:absolute;left:calc(100% - 30px);top:calc(100% - 26px);width:14px;height:14px;z-index:20;pointer-events:none;transition:left .55s cubic-bezier(.2,.75,.25,1),top .55s cubic-bezier(.2,.75,.25,1)}
.v-cur::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,64% 94%,44% 66%,80% 66%);background:var(--ink);filter:drop-shadow(0 0 1px var(--raised))}
.v-cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.3)}
[data-step^="c-"] .v-cur::after{animation:v-ripple .45s ease-out}
@keyframes v-ripple{0%{opacity:.4;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.v-b{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 11.5px/1 var(--sans);color:var(--ink);white-space:nowrap}
.v-b.pri{background:var(--primary);color:var(--onprimary);box-shadow:none}
.v-ch{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:11.5px;white-space:nowrap;transition:background .2s,color .2s}
.v-note{position:absolute;left:12px;bottom:10px;z-index:6;padding:3px 8px;border-radius:999px;background:var(--acct);color:var(--acc);font-size:11px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.v-card{position:absolute;right:12px;bottom:12px;z-index:10;width:270px;max-width:calc(100% - 24px);padding:10px 12px;border-radius:12px;background:var(--primary);color:var(--onprimary);box-shadow:var(--raise);opacity:0;transform:translateX(24px);transition:opacity .3s,transform .3s}
.v-card b{display:block;font-size:12.5px} .v-card small{display:block;margin:1px 0 8px;font-size:11px;opacity:.75;line-height:15px}
.v-card .v-r{display:flex;gap:5px;flex-wrap:wrap} .v-card .v-b{background:transparent;color:var(--onprimary);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--onprimary) 35%,transparent)} .v-card .v-b.pri{background:var(--onprimary);color:var(--primary);box-shadow:none}
.v-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good);font-size:11.5px;font-weight:600}
.v-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.v-ic{width:13px;height:13px;flex:none}
/* 1 · below Operations */
.v-ro{display:flex;flex-direction:column}
.v-hd{display:flex;gap:8px;align-items:baseline;margin-bottom:2px;font-size:12px} .v-hd b{font-family:var(--mono);font-weight:500} .v-hd span{color:var(--ink3)}
.v-sec{display:flex;gap:8px;align-items:center;height:22px;margin-top:4px;padding:0 10px;border-radius:7px;background:var(--panel);box-shadow:var(--shadow);font-size:12px;overflow:hidden;transition:height .45s,margin .45s,opacity .35s,background .3s}
.v-sec b{font-weight:600;transition:color .3s} .v-sec i{font-style:normal;color:var(--ink3)} .v-sec em{font-style:normal;color:var(--ink3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-sec.keep{box-shadow:var(--shadow),inset 3px 0 0 var(--good)}
[data-step="mark"] .v-sec.go{background:color-mix(in srgb,var(--bad) 10%,var(--panel))} [data-step="mark"] .v-sec.go b{color:var(--bad);text-decoration:line-through}
[data-step="gone"] .v-sec.go,[data-step="hold"] .v-sec.go{height:0;margin-top:0;opacity:0}
[data-step="hold"] .v-note{opacity:1;transform:none}
/* 2 · 3 · fold */
.v-fbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;height:20px;margin-bottom:6px;font-size:11.5px;color:var(--ink3)}
.v-lnk{color:var(--acc);font-weight:600;transition:color .2s}
.v-fs{margin-bottom:6px;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.v-fh{display:flex;align-items:center;height:26px;padding:0 10px;font-size:12px} .v-fh b{flex:1;font-weight:600} .v-fh .v-chev{width:12px;height:12px;color:var(--ink3);transition:transform .3s}
.v-fb{max-height:60px;padding:0 10px 8px;font-size:11.5px;color:var(--ink2);transition:max-height .4s,opacity .3s,padding .4s}
.v-msg{display:flex;gap:6px;align-items:center} .v-av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:9px;font-weight:700;color:var(--ink2);flex:none}
.v-kv{display:flex;justify-content:space-between;gap:8px}
[data-step="c-co"] .v-fb,[data-step="shut"] .v-fb,[data-step="p-ex"] .v-fb{max-height:0;opacity:0;padding-bottom:0}
[data-step="c-co"] .v-chev,[data-step="shut"] .v-chev,[data-step="p-ex"] .v-chev{transform:rotate(-90deg)}
[data-step="hov"] .v-nohov{opacity:1;transform:none}
.v-nohov{left:auto;right:12px;bottom:12px}
.ip-idea[data-k="fold"] [data-step="hov"] .v-cur{left:40%;top:126px}
.ip-idea[data-k="fold"] [data-step="p-co"] .v-cur,.ip-idea[data-k="fold"] [data-step="c-co"] .v-cur,.ip-idea[data-k="fold"] [data-step="shut"] .v-cur{left:calc(100% - 50px);top:20px}
.ip-idea[data-k="fold"] [data-step="p-ex"] .v-cur,.ip-idea[data-k="fold"] [data-step="c-ex"] .v-cur{left:calc(100% - 136px);top:20px}
[data-step="p-co"] .v-co,[data-step="c-co"] .v-co,[data-step="p-ex"] .v-ex,[data-step="c-ex"] .v-ex{color:var(--ink);text-decoration:underline}
.v-pane{width:250px;max-width:100%}
.v-pane .v-fh{height:24px} .v-pane .v-fb{max-height:40px}
.ip-idea[data-k="right"] [data-step="p-co"] .v-cur,.ip-idea[data-k="right"] [data-step="c-co"] .v-cur,.ip-idea[data-k="right"] [data-step="shut"] .v-cur{left:212px;top:20px}
.ip-idea[data-k="right"] [data-step="p-ex"] .v-cur,.ip-idea[data-k="right"] [data-step="c-ex"] .v-cur{left:128px;top:20px}
.v-side{position:absolute;left:280px;top:40px;right:12px;font-size:11.5px;color:var(--ink3);line-height:16px}
@media (max-width:520px){.v-side{display:none}}
/* 4 · 6 · lunch reminder */
.v-tl{position:relative;margin:18px 0 10px}
.v-trk{position:relative;height:22px;border-radius:6px;background:var(--fill)}
.v-job{position:absolute;left:4%;top:3px;bottom:3px;width:44%;border-radius:4px;background:#8A6A3E;transition:width .8s linear}
.v-noon{position:absolute;left:60%;top:-6px;bottom:-6px;border-left:2px dashed var(--ink3)} .v-noon em{position:absolute;bottom:100%;left:-2px;transform:translateY(-2px);font-size:10.5px;font-style:normal;white-space:nowrap;color:var(--ink2);background:var(--canvas);padding:0 3px}
.v-ax{display:flex;justify-content:space-between;margin-top:4px;font:500 10px var(--mono);color:var(--ink3)}
[data-step="noon"] .v-job,[data-step="card"] .v-job,[data-step="p-nn"] .v-job,[data-step="c-nn"] .v-job{width:56%}
[data-step="keep"] .v-job{width:70%}
[data-step="card"] .v-card,[data-step="p-nn"] .v-card,[data-step="c-nn"] .v-card,[data-step="again"] .v-card{opacity:1;transform:none}
[data-step="keep"] .v-note{opacity:1;transform:none}
.ip-idea[data-k="lunch"] [data-step="p-nn"] .v-cur,.ip-idea[data-k="lunch"] [data-step="c-nn"] .v-cur,.ip-idea[data-k="snooze"] [data-step="p-nn"] .v-cur,.ip-idea[data-k="snooze"] [data-step="c-nn"] .v-cur{left:calc(100% - 60px);top:calc(100% - 34px)}
.v-clk{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--panel);box-shadow:var(--shadow);font:500 12px var(--mono)}
.v-clk .t2,.v-again .t2{display:none} [data-step="wait"] .v-clk .t1,[data-step="again"] .v-clk .t1,[data-step="again"] .v-again .t1{display:none} [data-step="wait"] .v-clk .t2,[data-step="again"] .v-clk .t2,[data-step="again"] .v-again .t2{display:inline}
[data-step="wait"] .v-note{opacity:1;transform:none}
/* 5 · end of day */
.v-sp{display:flex;flex-wrap:wrap;gap:5px;align-items:center;width:max-content;max-width:100%;padding:8px 10px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);transition:opacity .3s}
.v-sp small{width:100%;font-size:11px;color:var(--ink3)}
[data-step="c-eod"] .v-eod,[data-step="p-eod"] .v-eod{background:var(--primary);color:var(--onprimary);box-shadow:none}
[data-step="stopped"] .v-sp,[data-step="card"] .v-sp{opacity:0}
.v-pls{position:absolute;left:12px;top:92px;display:flex;flex-direction:column;gap:6px}
.v-p2{display:none} [data-step="stopped"] .v-p1,[data-step="card"] .v-p1{display:none} [data-step="stopped"] .v-p2,[data-step="card"] .v-p2{display:inline-flex}
.v-p2{background:color-mix(in srgb,var(--warn) 14%,var(--panel));color:var(--warn)}
.ip-idea[data-k="eod"] [data-step="p-eod"] .v-cur,.ip-idea[data-k="eod"] [data-step="c-eod"] .v-cur{left:110px;top:42px}
[data-step="card"] .v-was{opacity:1;transform:none}
.v-was{bottom:auto;top:16px}
/* 7 · 8 · Time Log rows */
.v-trk2{position:relative;height:24px;margin:2px 0 10px;border-radius:6px;background:var(--fill)}
.v-bk{position:absolute;top:3px;bottom:3px;border-radius:4px;background:#8A6A3E;color:#fff;font:600 10px/18px var(--sans);padding-left:5px;overflow:hidden;white-space:nowrap;transition:background .4s}
.v-bk.b2{background:#A88654}
.v-bk.air{background:#2F8795}
.v-rows{display:flex;flex-direction:column;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.v-row{display:grid;grid-template-columns:96px 34px minmax(0,1fr) 28px;align-items:center;gap:6px;min-height:30px;padding:0 8px;font-size:11.5px;box-shadow:inset 0 -1px 0 var(--hair);transition:background .25s}
.v-row:last-child{box-shadow:none}
.v-row .t{font:500 11px var(--mono);color:var(--ink2)} .v-row .d{font:500 11px var(--mono)} .v-row .w{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v-row .w b{font-family:var(--mono);font-weight:500;margin-right:4px}
.v-row .x{display:flex;justify-content:flex-end}
.v-trash{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--bad);opacity:0;transition:opacity .2s,background .2s}
.v-w2,.v-a2{display:none}
[data-step="hov"] .v-r2,[data-step="c-del"] .v-r2{background:var(--fill)} [data-step="hov"] .v-trash,[data-step="c-del"] .v-trash{opacity:1;background:color-mix(in srgb,var(--bad) 12%,transparent)}
.v-why{position:absolute;right:12px;top:150px;z-index:9;display:flex;flex-wrap:wrap;gap:5px;align-items:center;width:250px;padding:8px 10px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
.v-why small{width:100%;font-size:11px;color:var(--ink3)}
[data-step="why"] .v-why,[data-step="c-why"] .v-why{opacity:1;transform:none}
[data-step="c-why"] .v-why .v-c1,[data-step="air"] .v-why .v-c1{background:var(--primary);color:var(--onprimary);box-shadow:none}
[data-step="air"] .v-bk.del{background:#2F8795}
[data-step="air"] .v-bk.del .l1{display:none} .v-bk .l2{display:none} [data-step="air"] .v-bk.del .l2{display:inline}
[data-step="air"] .v-r2 .v-w1{display:none} [data-step="air"] .v-r2 .v-w2{display:block;color:#2F8795}
[data-step="air"] .v-r2 .t,[data-step="air"] .v-r2 .d{color:#2F8795}
.ip-idea[data-k="del"] [data-step="hov"] .v-cur,.ip-idea[data-k="del"] [data-step="c-del"] .v-cur{left:calc(100% - 30px);top:88px}
.ip-idea[data-k="del"] [data-step="why"] .v-cur,.ip-idea[data-k="del"] [data-step="c-why"] .v-cur{left:calc(100% - 210px);top:182px}
.v-sw{display:inline-block;width:8px;height:8px;border-radius:2px;background:#2F8795;margin-right:5px;vertical-align:0}
.v-air .w b{font-family:var(--sans);font-weight:600}
.v-nt{font-style:normal;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--acct);color:var(--acc);font-size:10px;font-weight:600}
.v-row.v-air{grid-template-columns:96px 34px minmax(0,1fr) auto}
.v-chips{position:absolute;left:12px;right:12px;top:126px;z-index:9;display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
.v-chips small{width:100%;font-size:11px;color:var(--ink3)}
[data-step="chips"] .v-chips,[data-step="c-pick"] .v-chips{opacity:1;transform:none}
[data-step="c-pick"] .v-c-p{background:var(--primary);color:var(--onprimary);box-shadow:none}
[data-step="done"] .v-a1{display:none} [data-step="done"] .v-a2{display:block} [data-step="done"] .v-add{visibility:hidden}
[data-step="p-add"] .v-add,[data-step="c-add"] .v-add{background:var(--fill)}

function play(vis, it) {
  clearTimeout(vis._t); if (!it.steps) return;
  if (RM) { vis.dataset.step = it.steps[it.steps.length - 1][0]; return; }   /* reduced motion: the end state, still */
  var i = 0; (function next() { var s = it.steps[i]; vis.dataset.step = s[0]; i = (i + 1) % it.steps.length; vis._t = setTimeout(next, s[1]); })();
}
var IO = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (en) { var vis = en.target, it = find(vis.closest('.ip-idea').dataset.k); if (en.isIntersecting) play(vis, it); else clearTimeout(vis._t); }); }, { threshold: .2 }) : null;
$$('.ip-vis').forEach(function (vis) { var it = find(vis.closest('.ip-idea').dataset.k); if (IO) IO.observe(vis); else play(vis, it); });
/* ---------- Your picks ---------- */
function pkText() {
  var L = [APP + ' · ' + TOPIC + ' — my picks'];
  IDEAS.forEach(function (g) { var rows = []; g.items.forEach(function (it) { var v = V.v[it.k]; if (!v) return; var o = it.opts.filter(function (x) { return x[0] === v; })[0]; rows.push('· ' + it.t + ': ' + (v === 'skip' ? 'skip' : o ? o[1] : v)); }); if (rows.length) { L.push(g.group + ':'); L = L.concat(rows); } });
  var left = total - Object.keys(V.v).length; if (left) L.push('(not picked yet: ' + left + ')');
  if (V.note.trim()) L.push('Notes: ' + V.note.trim());
  return L.join('\n');
}
function sync() {
  D.documentElement.setAttribute('data-th', V.th);
  $$('.ip-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.th === V.th)); });
  $$('.ip-opt').forEach(function (b) { b.setAttribute('aria-pressed', String(V.v[b.dataset.k] === b.dataset.v)); });
  $$('.ip-idea').forEach(function (a) { a.classList.toggle('picked', !!V.v[a.dataset.k]); });
  var n = Object.keys(V.v).length; $('#ip-n').textContent = n ? n + '/' + total : '';
}
function draw() {
  var w = $('#ip-picks'); w.hidden = !V.open; if (!V.open) return;
  var ta = $('#ip-note'); if (ta && D.activeElement === ta) { $('#ip-picks pre').textContent = pkText(); return; }
  w.innerHTML = '<div class="ip-ph"><b>Your picks</b><button data-pk="x" aria-label="Close">✕</button></div><pre>' + esc(pkText()) + '</pre><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)">Anything else<textarea id="ip-note" placeholder="Anything to add or change">' + esc(V.note) + '</textarea></label><button class="ip-btn pri" data-pk="copy" style="justify-content:center;height:34px">Copy for the chat</button>';
}
function toast(m) { var t = $('.ip-toast'); if (t) t.remove(); t = D.createElement('div'); t.className = 'ip-toast'; t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function () { t.remove(); }, 2600); }
function copy(tx) {
  var fb = function () { var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try { D.execCommand('copy'); toast('Copied — paste it in the chat.'); } catch (e) { toast('Select the text and copy it.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Copied — paste it in the chat.'); }, fb); else fb();
}
D.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('.ip-seg button'))) { V.th = b.dataset.th; save(); sync(); return; }
  if (t.closest('#ip-open')) { V.open = !V.open; draw(); return; }
  if ((b = t.closest('[data-pk]'))) { if (b.dataset.pk === 'x') { V.open = false; draw(); } else copy(pkText()); return; }
  if ((b = t.closest('.ip-replay'))) { var vis = b.closest('.ip-vis'); play(vis, find(vis.closest('.ip-idea').dataset.k)); return; }
  if ((b = t.closest('.ip-opt'))) { var k = b.dataset.k, v = b.dataset.v; if (V.v[k] === v) delete V.v[k]; else V.v[k] = v; save(); sync(); draw(); }
});
D.addEventListener('input', function (ev) { if (ev.target.id === 'ip-note') { V.note = ev.target.value; save(); var p = $('#ip-picks pre'); if (p) p.textContent = pkText(); } });
D.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.open) { V.open = false; draw(); } });
sync();
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec sign-in and Admin</title>
<style>
:root,[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.lg circle{fill:var(--ink)} .lg .o{fill:var(--ink3)} .lg .c{fill:#22c55e}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--acc)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)} .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:26px;padding:0 9px;font-size:12px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn.bad{color:var(--bad)}
.btn .ic{width:14px;height:14px}
/* layout: preview + choices */
.wrap{max-width:1500px;margin:0 auto;padding:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.cap{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.cap h2{margin:0;font:500 20px/26px var(--serif)}
.cap small{color:var(--ink3);font-size:12.5px}
.note{margin:10px 2px 0;font-size:12.5px;color:var(--ink3)}
.note b{color:var(--ink2);font-weight:600}
/* the choices */
.chs{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 76px);overflow:auto;padding-bottom:6px}
.chs .hd{margin:6px 2px 0;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.ch{padding:10px 10px 8px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.ch > b{display:block;padding:0 4px;font-size:13px;font-weight:600}
.ch > small{display:block;padding:0 4px;margin-top:1px;font-size:12px;color:var(--ink3)}
.ol{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:17px;color:var(--ink2)}
.opt:hover{background:var(--fill)}
.opt i{width:14px;height:14px;margin-top:1.5px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.opt b{display:block;font-weight:500;color:var(--ink)}
.opt.sq i{border-radius:4px}
.opt[aria-pressed="true"]{background:var(--acct)}
.opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
.opt.sq[aria-pressed="true"] i{box-shadow:none;background:var(--acc)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.opt em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--acctx);margin-left:4px}
/* picks */
#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)} .pk-h b{font-weight:500;flex:1}
.pk-h .x{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)} .pk-h .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise);animation:tin .2s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* ============ the screens ============ */
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--canvas);box-shadow:var(--shadow), 0 0 0 1px var(--hair);height:min(760px,calc(100vh - 150px));min-height:600px}
.stage.phone{width:390px;height:780px;min-height:0;margin-bottom:22px !important;margin:0 auto;border-radius:34px;box-shadow:0 0 0 10px var(--ink),0 22px 60px -18px rgba(0,0,0,.45)}
[data-th="graphite"] .stage.phone,[data-th="black"] .stage.phone{box-shadow:0 0 0 10px #3a3936,0 22px 60px -18px rgba(0,0,0,.6)}
.av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;letter-spacing:.02em;position:relative}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--raised)}
.av .dot.day{background:var(--warn)}
/* login: shared */
.ln{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);height:100%;min-height:0}
.ln-brand{position:relative;display:flex;flex-direction:column;gap:18px;padding:34px 34px 28px;background:var(--panel);box-shadow:inset -1px 0 0 var(--hair)}
.ln-brand .lg2{display:flex;align-items:center;gap:10px;font:500 20px/1 var(--serif)} .ln-brand .lg2 svg{width:28px;height:28px}
.ln-brand .shop{font-size:12.5px;color:var(--ink3);margin-top:-12px;padding-left:38px}
.ln-time{margin-top:auto}
.ln-time b{display:block;font:400 64px/1 var(--serif);letter-spacing:-.02em}
.ln-time span{display:block;margin-top:8px;font-size:14px;color:var(--ink2)}
.ln-clk{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--raised);box-shadow:var(--shadow)}
.ln-clk > small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ln-clk div{display:flex;align-items:center;gap:8px;font-size:13px}
.ln-clk div i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
.ln-clk div em{font-style:normal;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.ln-main{position:relative;display:flex;flex-direction:column;padding:34px 36px 24px;min-width:0;overflow:auto}
.ln-main h3{margin:0;font:500 30px/36px var(--serif);letter-spacing:-.01em}
.ln-main > p{margin:6px 0 0;color:var(--ink2)}
.ln-gl{margin:20px 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
.ln-gl em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink4)}
.ln-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px 12px;border-radius:12px;background:var(--raised);box-shadow:var(--shadow);text-align:center;min-width:0;transition:transform .15s var(--ease),box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--raise)} .tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tile b{font-size:13.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{font-size:12px;color:var(--ink3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small.on{color:var(--good);font-weight:500}
.tile .lk{position:absolute;top:8px;right:8px;color:var(--ink4)} .tile{position:relative}
.ln-foot{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3)}
.ln-foot a{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* faces */
.faces{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px}
.face{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;width:116px;text-align:center}
.face .av{transition:transform .18s var(--ease),box-shadow .18s} .face:hover .av{transform:scale(1.05);box-shadow:0 0 0 4px var(--acct)}
.face b{font-size:14px;font-weight:600} .face small{font-size:12px;color:var(--ink3);margin-top:-6px}
.face:focus-visible .av{outline:2px solid var(--acc);outline-offset:3px}
.face.more .av{background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--border)}
/* type your name */
.form{display:flex;flex-direction:column;gap:12px;margin-top:24px;max-width:380px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl > span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.inp{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border)}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 4px var(--acct)}
.inp input{all:unset;flex:1;min-width:0;font-size:15px}
.inp .ic{color:var(--ink3)}
.sugg{display:flex;flex-direction:column;border-radius:10px;background:var(--raised);box-shadow:var(--raise);overflow:hidden;margin-top:-4px}
.sugg button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13.5px} .sugg button:hover,.sugg button.on{background:var(--fill)}
.sugg small{color:var(--ink3);margin-left:auto}
/* badge */
.scan{position:relative;margin-top:24px;width:min(360px,100%);aspect-ratio:4/3;border-radius:16px;background:linear-gradient(135deg,#2a2a27,#151514);overflow:hidden;display:grid;place-items:center}
.scan .fr{width:56%;aspect-ratio:1;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);position:relative}
.scan .fr::before,.scan .fr::after{content:"";position:absolute;inset:0;border-radius:14px;border:2.5px solid rgba(255,255,255,.9);clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.scan .ln2{position:absolute;left:22%;right:22%;height:2px;background:#5BBE8B;box-shadow:0 0 12px #5BBE8B;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:24%}50%{top:74%}}
.scan small{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12.5px}
.badge{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);max-width:360px;font-size:12.5px;color:var(--ink2)}
.badge .qr{width:44px;height:44px;flex:none;border-radius:6px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/11px 11px,var(--raised);box-shadow:inset 0 0 0 4px var(--raised)}
/* the PIN pad (shared) */
.pinw{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:color-mix(in srgb,var(--canvas) 72%,transparent);backdrop-filter:blur(6px)}
.pinw.an{animation:fin .18s ease} .pinw.an .pin,.menu.an{animation:pup .22s var(--ease)} .lock.an{animation:fin .2s}
@keyframes fin{from{opacity:0}}
.pin{width:min(330px,calc(100% - 32px));padding:22px 22px 18px;border-radius:20px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;align-items:center;gap:12px}
@keyframes pup{from{opacity:0;transform:translateY(10px) scale(.98)}}
.pin h4{margin:4px 0 0;font:500 21px/26px var(--serif)} .pin p{margin:-6px 0 0;font-size:12.5px;color:var(--ink3);text-align:center}
.pin .dots{display:flex;gap:12px;height:18px;align-items:center;margin:4px 0 2px}
.pin .dots i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border);transition:background .12s,transform .12s}
.pin .dots i.f{background:var(--ink);box-shadow:none;transform:scale(1.05)}
.pin .dots.bad{animation:shake .38s} .pin .dots.bad i.f{background:var(--bad)}
.pin .dots.ok i.f{background:var(--good)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pin .msg{min-height:17px;font-size:12.5px;color:var(--ink3)} .pin .msg.bad{color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.pad button{all:unset;cursor:pointer;height:56px;border-radius:14px;display:grid;place-items:center;font:500 22px/1 var(--sans);background:var(--fill);transition:background .1s,transform .08s}
.pad button:hover{background:var(--sel)} .pad button:active{transform:scale(.94)} .pad button:focus-visible{outline:2px solid var(--acc)}
.pad button.k{background:transparent;font-size:12.5px;font-weight:500;color:var(--ink2)} .pad button.k:hover{background:var(--fill)}
.pin .pw{width:100%}
.pin .row{display:flex;gap:8px;width:100%;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3)}
.pin .row a{color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pin .clkn{width:100%;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--good-t);color:var(--good);font-size:12.5px;font-weight:500}
.pin .clkn i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pin .back{align-self:flex-start;margin:-6px 0 -4px -6px}
/* switch: the app behind */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%;min-height:0}
.sb{display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--panel);box-shadow:inset -1px 0 0 var(--hair)}
.sb .lg2{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;font:500 16px/1 var(--serif)} .sb .lg2 svg{width:18px;height:18px}
.sb .it{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink2)} .sb .it.on{background:var(--sel);color:var(--ink);font-weight:500}
.sb .clkr{margin:4px 0 8px;padding:8px 10px;border-radius:10px;display:flex;gap:9px;align-items:center;font-size:12.5px} .sb .clkr i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)} .sb .clkr small{display:block;color:var(--ink3)}
.me{all:unset;box-sizing:border-box;cursor:pointer;margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px} .me:hover,.me.on{background:var(--fill)}
.me b{display:block;font-size:13px;font-weight:600} .me small{display:block;font-size:11.5px;color:var(--ink3)}
.pg{padding:26px 30px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pg h3{margin:0;font:500 26px/32px var(--serif)}
.sk{border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.menu{position:absolute;z-index:6;left:12px;bottom:66px;width:288px;padding:6px;border-radius:14px;background:var(--raised);box-shadow:var(--raise)}
.menu .mh{display:flex;align-items:center;gap:10px;padding:8px 8px 10px;box-shadow:inset 0 -1px 0 var(--hair);margin-bottom:4px}
.menu .mh b{display:block;font-size:13.5px} .menu .mh small{display:block;font-size:12px;color:var(--ink3)}
.menu .mi{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:13px} .menu .mi:hover{background:var(--fill)}
.menu .mi small{margin-left:auto;color:var(--ink4);font-family:var(--mono);font-size:11px}
.menu .ml{padding:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.menu .pp{display:flex;gap:6px;padding:2px 6px 6px;flex-wrap:wrap}
.menu .pp button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:58px;padding:6px 0;border-radius:10px;font-size:11.5px;color:var(--ink2)} .menu .pp button:hover{background:var(--fill)}
.menu .sep{height:1px;background:var(--hair);margin:4px 2px}
.lock{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--canvas) 80%,transparent);backdrop-filter:blur(10px)}

}

function pinState(p){ return p.off ? ['Sign-in off', 'off'] : p.id === 'sofia' ? ['Temporary PIN', 'w'] : p.id === 'derek' ? ['No PIN yet', 'w'] : null; }

  h += '</div>';
  /* actions */
  if(V.depth !== 'pages') h += '<div class="card"><h5>' + ic('shield', 13) + 'What they can do</h5><div class="perm">' + ACTS.map(function(g){ return '<div class="pg2"><b>' + g[0] + '</b>' + g[1].map(function(a){ return sw(eff(p, a[0]), a[1], 'data-act="' + a[0] + '"', changed(p, a[0]), lock); }).join('') + '</div>'; }).join('') + '</div></div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (V.model === 'role' && n ? '<button class="btn sm" data-backrole>' + ic('undo', 13) + 'Back to the ' + esc(p.r) + ' role</button>' : '') + '<span class="sp"></span>' + (p.admin ? '' : V.leave === 'off' ? '<button class="btn sm bad" data-go="Turn off sign-in — their history stays">Turn off sign-in</button>' : '<button class="btn sm bad" data-go="Delete — asks first">Delete ' + esc(p.n.split(' ')[0]) + '</button>') + '</div>';

}
function rolesHtml(){

    + rows.map(function(g){ return '<tr class="gr"><td colspan="' + (ROLES.length + 1) + '">' + g[0] + '</td></tr>' + g[1].map(function(a){ return '<tr><td>' + a[1] + '</td>' + ROLES.map(function(r){ var on = rHas(r, a[0]), v = V.depth === 'levels' && g[0] === 'Pages' && on && (' ' + (VIEWONLY[r] || '') + ' ').indexOf(' ' + a[0] + ' ') >= 0;
      return '<td><button class="ck' + (v ? ' v' : '') + '" data-rx="' + r + '|' + a[0] + '" aria-pressed="' + (on && !v) + '" aria-label="' + r + ': ' + a[1] + '"' + (r === 'Admin' ? ' disabled style="opacity:.5;cursor:default"' : '') + '></button></td>'; }).join('') + '</tr>'; }).join(''); }).join('') + '</tbody></table></div>'
    + '<p class="note">Changing a role changes everyone in it' + (V.model === 'role' ? ', except what was changed for one person.' : '.') + ' The Admin always has everything.</p>';
}
function segFor(key, opts){ return '<span class="seg">' + opts.map(function(o){ return '<button data-rset="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (V[key] === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</span>'; }
function rulesHtml(){
  return '<div class="rules">'
    + '<div class="card"><h5>' + ic('lock', 13) + 'Showing it’s you</h5>' + segFor('check', [['pin4', '4-digit PIN'], ['pin6', '6-digit PIN'], ['mixed', 'Password + PIN'], ['none', 'No PIN']]) + '<p class="note">PINs are kept scrambled in the file, never as typed.</p></div>'
    + '<div class="card"><h5>' + ic('x', 13) + 'A wrong PIN</h5>' + segFor('wrong', [['lock5', '5 tries, wait a minute'], ['tell', '5 tries, tell the admin'], ['nolim', 'No limit']]) + '</div>'
    + '<div class="card"><h5>' + ic('moon', 13) + 'When nobody’s touched it</h5>' + segFor('idle', [['lock15', 'Lock · 15 min'], ['out15', 'Sign out · 15 min'], ['out60', 'Sign out · 1 h'], ['never', 'Never']]) + '</div>'
    + '<div class="card"><h5>' + ic('clock', 13) + 'End of the shop day</h5>' + sw(V.away.eod, 'Sign everyone out at 4:30 pm — running clocks keep running', 'data-awayt="eod"') + '</div>'
    + '<div class="card"><h5>' + ic('plus', 13) + 'A new person</h5>' + segFor('newp', [['temp', 'Temporary PIN'], ['set', 'Admin sets it'], ['self', 'They pick it']]) + '</div>'
    + '<div class="card"><h5>' + ic('users', 13) + 'Who can open Admin</h5>' + segFor('who', [['admin', 'Admin only'], ['mgr', 'Admin + managers'], ['flag', 'By permission']]) + '</div></div>';
}
function logHtml(){
  var L = [['7:02', 'dana', 'Signed in', 'ok'], ['7:05', 'mike', 'Signed in', 'ok'], ['9:41', 'luis', 'Wrong PIN ×2', 'bad'], ['9:42', 'luis', 'Signed in', 'ok'], ['11:30', 'frank', 'Switched to Tom Brandt', ''], ['12:15', 'jenna', V.idle === 'lock15' ? 'Locked — 15 min, no one on it' : V.idle === 'never' ? 'Signed out' : 'Signed out — idle', ''], ['12:20', 'admin', 'Reset Sofia Alvarez’s PIN (temporary)', ''], ['12:31', 'tom', 'Gave Dana Kowalski: Inventory, Order parts', ''], ['Yest.', 'admin', V.away.eod ? 'Everyone signed out — end of the day (2 clocks kept running)' : 'Admin signed out', '']];
  return '<div class="card" style="padding:4px 12px"><div class="log">' + L.map(function(x){ var p = pBy(x[1]); return '<div class="lr"><span class="t">' + x[0] + '</span>' + av(p, 26) + '<span><b style="font-weight:600">' + esc(p.n) + '</b> · ' + esc(x[2]) + '</span><span class="k ' + x[3] + '">' + (x[3] === 'bad' ? 'Failed' : x[3] === 'ok' ? 'Sign-in' : 'Change') + '</span></div>'; }).join('') + '</div></div>';
}

/* ---------- the page ---------- */
var CAPS = { login: ['Login page', 'when someone signs out, or the app opens'], switch: ['Switch user', 'off the name in the sidebar'], admin: ['Admin page', 'people and what each can do'] };
var NOTES = {
  login: '<b>Try it:</b> pick a name — PIN 1234 (6-digit: 123456; password: parsec). Five wrong tries shows the limit. Everything stays in the one Parsec file: PINs are stored scrambled, never as typed. It keeps each person on their own pages; it isn’t a lock against someone who opens the file itself.',
  switch: '<b>Try it:</b> pick someone in the switcher, or Step away to see the lock screen. Mike’s clock keeps running whoever signs in.',
  admin: '<b>Try it:</b> flip a page or an action for Dana — with roles, what’s changed for her alone gets a dot and “Back to the role” undoes it. The Roles tab sets everyone in a role at once.'
};
function screenHtml(){ return V.scr === 'login' ? loginHtml() : V.scr === 'switch' ? (V.swLogin ? loginHtml() : appHtml()) : adminHtml(); }
function chsHtml(){
  return '<div class="chs">' + CH.map(function(c){ var k = c[1], multi = c[5];
    return (c[0] ? '<div class="hd" data-hd="' + c[1] + '">' + c[0] + '</div>' : '') + '<div class="ch"><b>' + c[2] + '</b>' + (c[3] ? '<small>' + c[3] + '</small>' : '') + '<div class="ol">' + c[4].map(function(o){ var on = multi ? !!V[k][o[0]] : V[k] === o[0];
      return '<button class="opt' + (multi ? ' sq' : '') + '" data-ch="' + k + '" data-v="' + o[0] + '" aria-pressed="' + on + '"><i></i><span><b>' + o[1] + (o[4] ? '<em>SUGGESTED</em>' : '') + '</b>' + (o[2] || '') + '</span></button>'; }).join('') + '</div></div>'; }).join('') + '</div>';
}
function draw(){
  var y = window.scrollY, cap = CAPS[V.scr], c0 = $('.chs'), cy = c0 ? c0.scrollTop : 0;
  $('#pg').innerHTML = '<div class="wrap"><div class="two"><div><div class="cap"><h2>' + cap[0] + '</h2><small>' + cap[1] + '</small>' + (V.scr === 'switch' && V.swLogin ? '<span class="sp"></span><button class="btn sm gh" data-swback>' + ic('back', 13) + 'Back to Mike’s page</button>' : '') + '</div><div class="stage' + (V.dev === 'phone' ? ' phone' : '') + '" id="stage">' + screenHtml() + '</div><p class="note">' + NOTES[V.scr] + '</p></div>' + chsHtml() + '</div></div>';
  window.scrollTo(0, y); var c1 = $('.chs'); if(c1) c1.scrollTop = cy; sync(); pkDraw(); V.an = false;
  var pwin = $('#pwin'); if(pwin) pwin.focus();
}
function sync(){
  [['th', 'th'], ['scr', 'scr'], ['dev', 'dev']].forEach(function(x){ $$('.mk button[data-' + x[0] + ']').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-' + x[0]) === V[x[1]])); }); });
  D.documentElement.setAttribute('data-th', V.th);
}
function pkText(){
  var L = ['Parsec · Login page and Admin page — my picks'];
  CH.forEach(function(c){ var k = c[1], vals;
    if(c[5]) vals = c[4].filter(function(o){ return V[k][o[0]]; }).map(function(o){ return o[1]; }).join(', ') || 'none';
    else vals = c[4].filter(function(o){ return o[0] === V[k]; })[0][1];
    if(c[0]) L.push(c[0].charAt(0) + c[0].slice(1).toLowerCase() + ':');
    L.push('· ' + c[2] + ': ' + vals); });
  if(V.note.trim()) L.push('Notes: ' + V.note.trim());
  return L.join('\n');
}
function pkDraw(){ var w = $('#picks'); w.hidden = !V.picks; if(!V.picks) return;
  var ta = $('#pk-note'); if(ta && D.activeElement === ta){ var pre = $('#picks pre'); if(pre) pre.textContent = pkText(); return; }
  w.innerHTML = '<div class="pk-h"><b>Your picks</b><button class="x" data-pk="x" aria-label="Close">' + ic('x', 15) + '</button></div><pre>' + esc(pkText()) + '</pre><div class="pk-r"><span>Anything else</span><textarea id="pk-note" placeholder="e.g. Parts people get the Inventory page by default">' + esc(V.note) + '</textarea></div><button class="btn pri" data-pk="copy">' + ic('copy') + 'Copy for the chat</button>'; }
function toast(m){ var t = $('.toast'); if(t) t.remove(); t = D.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.remove(); }, 2800); }

/* ---------- the PIN, working ---------- */
function openPin(id){
  var p = pBy(id); V.pin = ''; V.pinMsg = ''; V.pinSt = ''; V.menu = false;
  if(V.check === 'none'){ signedIn(p); return; }
  V.pinFor = id; V.an = true; draw();
}
function signedIn(p){
  var sw0 = V.scr === 'switch';
  V.pinFor = null; V.pin = ''; V.pinMsg = ''; V.pinSt = ''; V.tries = 0; V.locked = false; V.swLogin = false; V.faceAll = false; V.typed = '';
  if(sw0 && p.id !== ME) toast('Switched to ' + p.n + ' — their pages open.' + (V.away.keep ? ' Mike’s clock keeps running on RO 1356.' : ''));
  else if(sw0) toast('Welcome back, Mike — right where you left it.');
  else toast('Signed in as ' + p.n + (p.admin ? ' — every page' : ' — their pages open') + '.');
  V.menu = sw0 ? false : V.menu; draw();
}
function padKey(k){
  var who = V.locked ? ME : V.pinFor; if(!who) return; var p = pBy(who), n = PINLEN();
  if(V.waitTill > Date.now()) return;
  if(k === 'forgot'){ toast('The admin' + (V.who === 'admin' ? '' : ' (or Tom Brandt)') + ' resets it from Admin → People.'); return; }
  if(V.pinSt){ V.pinSt = ''; V.pin = ''; }
  if(k === 'del') V.pin = V.pin.slice(0, -1); else if(V.pin.length < n) V.pin += k;
  V.pinMsg = '';
  if(V.pin.length === n){
    if(V.pin === (n === 6 ? '123456' : '1234')){ V.pinSt = 'ok'; draw(); setTimeout(function(){ signedIn(p); }, 450); return; }
    V.tries++; V.pinSt = 'bad';
    if(V.wrong !== 'nolim' && V.tries >= 5){ V.waitTill = Date.now() + 60000; V.pinMsg = V.wrong === 'tell' ? 'Five wrong tries — the admin has been told. Wait a minute.' : 'Five wrong tries — wait a minute, then try again.'; V.tries = 0; setTimeout(function(){ V.waitTill = 0; V.pinMsg = ''; V.pinSt = ''; V.pin = ''; draw(); }, 60000); }
    else V.pinMsg = 'Not right — try again' + (V.wrong !== 'nolim' ? ' (' + (5 - V.tries) + ' left)' : '');
  }
  draw();
}

/* ---------- events ---------- */
D.addEventListener('click', function(e){
  var t = e.target, b;
  if((b = t.closest('.mk button[data-th]'))){ V.th = b.getAttribute('data-th'); sync(); return; }
  if((b = t.closest('.mk button[data-scr]'))){ V.scr = b.getAttribute('data-scr'); V.pinFor = null; V.locked = false; V.swLogin = false; V.menu = true; V.an = V.scr === 'switch'; draw();
    var hd = $('.chs [data-hd="' + { login: 'lay', switch: 'sw', admin: 'model' }[V.scr] + '"]'), chs = $('.chs'); if(hd && chs && chs.scrollHeight > chs.clientHeight + 4) chs.scrollTop = hd.offsetTop - chs.offsetTop - 4; else if(hd && window.innerWidth <= 1180) hd.scrollIntoView({ block: 'start' }); return; }
  if((b = t.closest('.mk button[data-dev]'))){ V.dev = b.getAttribute('data-dev'); draw(); return; }
  if(t.closest('#pk-open')){ V.picks = !V.picks; pkDraw(); return; }
  if((b = t.closest('[data-pk]'))){ var a = b.getAttribute('data-pk'); if(a === 'x'){ V.picks = false; pkDraw(); }
    if(a === 'copy'){ var tx = pkText(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(function(){ toast('Copied — paste it in the chat.'); }, function(){ var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try{ D.execCommand('copy'); toast('Copied — paste it in the chat.'); }catch(er){} ta.remove(); }); }
    return; }
  if((b = t.closest('[data-ch]'))){ var k2 = b.getAttribute('data-ch'), v = b.getAttribute('data-v'), c = CH.filter(function(x){ return x[1] === k2; })[0];
    if(c[5]) V[k2][v] = V[k2][v] ? 0 : 1; else V[k2] = v;
    if(k2 === 'check'){ V.pin = ''; V.pinSt = ''; V.pinMsg = ''; }
    if(k2 === 'sw'){ V.menu = true; V.swLogin = false; }
    draw(); return; }
  if((b = t.closest('[data-who]'))){ openPin(b.getAttribute('data-who')); return; }
  if((b = t.closest('[data-pad]'))){ padKey(b.getAttribute('data-pad')); return; }
  if(t.closest('[data-pinx]')){ V.pinFor = null; draw(); return; }
  if(t.matches && t.matches('[data-pinbg]')){ V.pinFor = null; draw(); return; }
  if(t.closest('[data-pw]')){ var pi = $('#pwin'), p0 = pBy(V.locked ? ME : V.pinFor); if(pi && pi.value === 'parsec') signedIn(p0); else { V.pinSt = 'bad'; V.pinMsg = 'That’s not it — try again'; draw(); } return; }
  if(t.closest('[data-faceall]')){ V.faceAll = !V.faceAll; draw(); return; }
  if(t.closest('[data-scanbox]')){ toast('Badge read — Dana Kowalski'); setTimeout(function(){ openPin('dana'); }, 500); return; }
  if(t.closest('[data-me]')){ V.menu = !V.menu; V.an = V.menu; draw(); return; }
  if(t.closest('[data-step]')){ V.menu = false; V.an = true; V.locked = 'step'; V.pin = ''; V.pinSt = ''; V.pinMsg = ''; draw(); return; }
  if(t.closest('[data-unlockswitch]')){ V.locked = false; if(V.sw === 'quick'){ V.menu = true; } else V.swLogin = true; draw(); return; }
  if(t.closest('[data-signout]')){ V.menu = false; V.swLogin = true; toast('Signed out.' + (V.away.keep ? ' Your clock keeps running on RO 1356.' : '')); draw(); return; }
  if(t.closest('[data-swlogin]')){ V.menu = false; V.swLogin = true; draw(); return; }
  if(t.closest('[data-swback]')){ V.swLogin = false; V.menu = true; V.pinFor = null; draw(); return; }
  if((b = t.closest('[data-adt]'))){ V.adTab = b.getAttribute('data-adt'); draw(); return; }
  if((b = t.closest('[data-adp]'))){ V.adSel = b.getAttribute('data-adp'); draw(); return; }
  if((b = t.closest('[data-pgk]')) || (b = t.closest('[data-act]'))){
    var k3 = b.getAttribute('data-pgk') || b.getAttribute('data-act'), p3 = pBy(V.adSel);
    if(V.model === 'roleonly'){ toast('Set by the ' + p3.r + ' role — change it on the Roles tab.'); return; }
    if(p3.admin){ toast('The Admin always has everything.'); return; }
    var nv = !eff(p3, k3), o = V.ov[p3.id] = V.ov[p3.id] || {}; if(nv === rHas(p3.r, k3)) delete o[k3]; else o[k3] = nv ? 1 : -1; draw(); return; }
  if((b = t.closest('[data-lvl]'))){ var p4 = pBy(V.adSel); if(V.model === 'roleonly'){ toast('Set by the role — change it on the Roles tab.'); return; } if(p4.admin){ toast('The Admin always has everything.'); return; } var kk = p4.id + '|' + b.getAttribute('data-lvl'), lv0 = b.getAttribute('data-v'); delete V.lv[kk]; if(V.ov[p4.id]) delete V.ov[p4.id][b.getAttribute('data-lvl')]; if(lvl(p4, b.getAttribute('data-lvl')) !== lv0) V.lv[kk] = lv0; draw(); return; }
  if(t.closest('[data-backrole]')){ var p5 = pBy(V.adSel); delete V.ov[p5.id]; Object.keys(V.lv).forEach(function(x){ if(x.indexOf(p5.id + '|') === 0) delete V.lv[x]; }); toast(p5.n + ' is back to the ' + p5.r + ' role.'); draw(); return; }
  if((b = t.closest('[data-rx]'))){ if(b.disabled) return; var rk = b.getAttribute('data-rx'), parts = rk.split('|'); V.roleX[rk] = !rHas(parts[0], parts[1]); draw(); return; }
  if((b = t.closest('[data-rset]'))){ V[b.getAttribute('data-rset')] = b.getAttribute('data-v'); draw(); return; }
  if((b = t.closest('[data-awayt]'))){ var ak = b.getAttribute('data-awayt'); V.away[ak] = V.away[ak] ? 0 : 1; draw(); return; }
  if((b = t.closest('[data-go]'))){ toast(b.getAttribute('data-go')); return; }
});
D.addEventListener('input', function(e){
  if(e.target.id === 'pk-note'){ V.note = e.target.value; var pre = $('#picks pre'); if(pre) pre.textContent = pkText(); return; }
  if(e.target.id === 'nm'){ V.typed = e.target.value; var q = V.typed.trim().toLowerCase(), L = q ? people().concat([pBy('admin')]).filter(function(p){ return p.n.toLowerCase().indexOf(q) >= 0 || ini(p.n).toLowerCase() === q; }) : RECENT.map(pBy); $('#sugg').innerHTML = suggHtml(L, q); }
});
D.addEventListener('keydown', function(e){
  if(e.target.id === 'nm' && e.key === 'Enter'){ var f = $('#sugg button[data-who]'); if(f) openPin(f.getAttribute('data-who')); return; }
  if(e.target.id === 'pwin' && e.key === 'Enter'){ var pb = $('[data-pw]'); if(pb) pb.click(); return; }
  var padOn = (V.pinFor || V.locked) && !(pBy(V.locked ? ME : V.pinFor) || {}).admin && !needsPw(pBy(V.locked ? ME : V.pinFor));
  if(padOn && /^[0-9]$/.test(e.key) && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); padKey(e.key); return; }
  if(padOn && e.key === 'Backspace' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ e.preventDefault(); padKey('del'); return; }
  if(e.key === 'Escape'){ if(V.picks){ V.picks = false; pkDraw(); } else if(V.pinFor){ V.pinFor = null; draw(); } else if(V.menu && V.scr === 'switch'){ V.menu = false; draw(); } }
  if((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L') && V.scr === 'switch' && V.away.lockbtn){ e.preventDefault(); V.menu = false; V.locked = 'step'; V.pin = ''; draw(); }
});
setInterval(function(){ if(V.scr !== 'admin' && !V.pinFor && V.side.clock){ var b = $('.ln-time b'); if(b){ var n = nowTxt(); b.firstChild.nodeValue = n.t; } } }, 20000);
draw();

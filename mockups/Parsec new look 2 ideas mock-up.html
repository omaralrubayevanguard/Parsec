<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Parsec Instrument Look</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300..700&family=Sofia+Sans+Extra+Condensed:wght@300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@300;400;500;600&family=Hanken+Grotesk:wght@400..600&display=swap">
<style>
/* Parsec · look two · the instrument panel. Colour lives only in what is lit; everything you press has travel. */
*,*::before,*::after{box-sizing:border-box}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}

/* ── every dial the Tune panel turns is a variable here ── */
:root{
  --nh:60;--nc:.006;--lb:.16;--ah:45;--ac:.15;--hw:85;--cs:1;
  --r:12px;--dp:1;--ol:1;--sp:1;--fs:14px;--ns:1;--dw:400;--mv:1;--ls:12px;--lg:.7;--bi:.6;--sb:6px;--iw:1.6;--tz:1;
  --f-t:"Barlow","Segoe UI",system-ui,sans-serif;--f-d:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;--f-l:"Barlow Semi Condensed","Barlow","Segoe UI",sans-serif;--dls:.01em;
  --e-out:cubic-bezier(.22,1,.36,1);--e-io:cubic-bezier(.65,0,.35,1);--e-pop:cubic-bezier(.3,1.4,.5,1);
  --l0:calc(.77 + var(--lb));--l1:calc(.805 + var(--lb));--l2:1;--lw:calc(.73 + var(--lb));
  --i1:.2;--i2:.37;--i3:.47;--i4:.6;--la:.5;--lon:.99;--lst:.56;--cst:.12;--k:.55;--hi:.95;--sh:.14;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --l0:var(--lb);--l1:calc(var(--lb) + .036);--l2:calc(var(--lb) + .08);--lw:calc(var(--lb) - .045);
    --i1:.94;--i2:.79;--i3:.65;--i4:.52;--la:.74;--lon:.16;--lst:.79;--cst:.13;--k:1;--hi:.085;--sh:.55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --l0:var(--lb);--l1:calc(var(--lb) + .036);--l2:calc(var(--lb) + .08);--lw:calc(var(--lb) - .045);
  --i1:.94;--i2:.79;--i3:.65;--i4:.52;--la:.74;--lon:.16;--lst:.79;--cst:.13;--k:1;--hi:.085;--sh:.55;
  color-scheme:dark;
}
:root,.sw3{
  --bg:oklch(var(--l0) calc(var(--nc)*var(--k)) var(--nh));
  --p1:oklch(var(--l1) calc(var(--nc)*var(--k)) var(--nh));
  --p2:oklch(var(--l2) calc(var(--nc)*var(--k)) var(--nh));
  --well:oklch(var(--lw) calc(var(--nc)*var(--k)) var(--nh));
  --ink:oklch(var(--i1) calc(var(--nc)*.8) var(--nh));
  --ink2:oklch(var(--i2) calc(var(--nc)*.8) var(--nh));
  --ink3:oklch(var(--i3) calc(var(--nc)*.8) var(--nh));
  --ink4:oklch(var(--i4) calc(var(--nc)*.8) var(--nh));
  --acc:oklch(var(--la) var(--ac) var(--ah));
  --acc-hi:oklch(calc(var(--la) + .06) var(--ac) var(--ah));
  --acc-d:oklch(var(--la) var(--ac) var(--ah) / .16);
  --glow:oklch(var(--la) var(--ac) var(--ah) / .6);
  --on:oklch(var(--lon) .012 var(--nh));
  --line:oklch(var(--i1) .01 var(--nh) / calc(.1*var(--ol)));
  --line2:oklch(var(--i1) .01 var(--nh) / calc(.2*var(--ol)));
  --hv:oklch(var(--i1) .01 var(--nh) / .065);
  --ok:oklch(var(--lst) calc(var(--cst)*var(--cs)) 150);
  --wait:oklch(var(--lst) calc(var(--cst)*var(--cs)) var(--hw));
  --cust:oklch(var(--lst) calc(var(--cst)*var(--cs)*.9) 240);
  --sup:oklch(var(--lst) calc(var(--cst)*var(--cs)*.9) 305);
  --bad:oklch(var(--lst) calc(var(--cst)*var(--cs)*1.2) 27);
  --bev:inset 0 1px 0 oklch(1 0 0 / calc(var(--hi)*var(--dp))),inset 0 -1px 0 oklch(0 0 0 / calc(.2*var(--dp)*var(--k)));
  --drop:0 1px 1px oklch(0 0 0 / calc(var(--sh)*.5)),0 calc(8px*var(--dp)) calc(18px*var(--dp)) calc(-9px*var(--dp)) oklch(0 0 0 / calc(var(--sh)*var(--dp)));
  --drop2:0 1px 1px oklch(0 0 0 / calc(var(--sh)*.5)),0 calc(16px*var(--dp) + 4px) calc(30px*var(--dp) + 6px) -12px oklch(0 0 0 / calc(var(--sh)*1.1));
  --sunk:inset 0 calc(1.5px*var(--dp)) calc(3px*var(--dp)) oklch(0 0 0 / calc(var(--sh)*.9*var(--dp))),inset 0 0 0 1px oklch(0 0 0 / calc(.12*var(--k) + .03)),0 1px 0 oklch(1 0 0 / calc(var(--hi)*.5*var(--dp)));
  --float:0 0 0 1px var(--line),0 26px 60px -18px oklch(0 0 0 / calc(var(--sh) + .12));
  --r1:calc(var(--r)*.6);--r2:var(--r);--r3:calc(var(--r)*1.4);--rp:calc(var(--r)*60);
}
:root[data-type="B"]{--f-t:"Sofia Sans","Segoe UI",system-ui,sans-serif;--f-d:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;--f-l:"Sofia Sans","Segoe UI",sans-serif;--dls:.015em}
:root[data-type="C"]{--f-t:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;--f-d:"Zilla Slab","Rockwell",Georgia,serif;--f-l:"Hanken Grotesk","Segoe UI",sans-serif;--dls:-.01em}

html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 var(--f-t);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
:focus{outline:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.d{font-family:var(--f-d);font-weight:var(--dw);letter-spacing:var(--dls)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:var(--iw);stroke-linecap:round;stroke-linejoin:round;transform:translate(var(--mx,0px),var(--my,0px));transition:transform calc(160ms*var(--mv)) var(--e-out)}
svg.i .f,svg.i .b{fill:currentColor;stroke:none}
:root[data-ico="A"] svg.du path:not(.nf),:root[data-ico="A"] svg.du circle:not(.b):not(.f),:root[data-ico="A"] svg.du rect{fill:currentColor;fill-opacity:.17}
.theming *,.theming *::before,.theming *::after{transition:background-color .6s ease,color .6s ease,fill .6s ease,stroke .6s ease,box-shadow .6s ease!important}
:root[data-den="A"] .xd{display:none!important}

/* ── the panel behind everything ── */
#bk{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg);overflow:hidden}
#bk i{position:absolute;inset:0;opacity:0;transition:opacity .8s}
:root[data-bg="A"] #bk .bk-a,:root[data-bg="B"] #bk .bk-b{opacity:var(--bi)}
.bk-a{background:radial-gradient(520px circle at var(--px,50%) var(--py,30%),oklch(1 0 0 / calc(.10*var(--k) + .5*(1 - var(--k)))),transparent 70%),radial-gradient(circle,oklch(0 0 0 / calc(.7*var(--k) - .22)) 0 1.3px,transparent 1.8px);background-size:auto,13px 13px}
.bk-a::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,transparent,oklch(1 0 0 / calc(.05*var(--k) + .35*(1 - var(--k)))),transparent);animation:pass 19s linear infinite}
@keyframes pass{to{transform:translateX(450%)}}
.bk-b{background:radial-gradient(circle at 50% 50%,transparent 44%,oklch(1 0 0 / calc(.05*var(--k) + .3*(1 - var(--k)))) 47% 50%,transparent 53%) 0 0/34px 34px,radial-gradient(circle at 50% 50%,transparent 44%,oklch(0 0 0 / calc(.3*var(--k) - .06)) 47% 50%,transparent 53%) 17px 17px/34px 34px}
.bk-b::after{content:"";position:absolute;inset:-50%;background:conic-gradient(from var(--ang) at 50% 50%,transparent 0 62%,oklch(1 0 0 / calc(.09*var(--k) + .5*(1 - var(--k)))) 74%,transparent 86%);animation:sheen 24s linear infinite}
@keyframes sheen{to{--ang:360deg}}

/* ── frame ── */
#app{position:relative;z-index:1;min-height:100dvh;--gx:calc(max(16px,env(safe-area-inset-left,0px)) + clamp(0px,2.2vw,30px));transition:margin calc(260ms*var(--mv)) var(--e-out),padding calc(260ms*var(--mv)) var(--e-out)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:10px var(--gx);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + clamp(0px,2.2vw,30px))}
#bar::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in oklch,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
#stage{padding:calc(22px*var(--sp)) var(--gx) 130px;padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + clamp(0px,2.2vw,30px));view-transition-name:stage;container:stage/inline-size}
:root{view-transition-name:none}
.logo{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px;border-radius:var(--r1)}
.logo svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.logo svg .n{stroke:var(--acc);transform-origin:12px 16px;transition:transform calc(500ms*var(--mv)) var(--e-pop)}
.logo:hover svg .n{transform:rotate(62deg)}
.logo b{font:500 calc(21px*var(--tz))/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase}

/* the selector: a recessed track, one key that slides to where you are */
.sel{position:relative;display:inline-flex;gap:2px;padding:3px;border-radius:calc(var(--r1) + 3px);background:var(--well);box-shadow:var(--sunk);max-width:100%}
.sel-i{position:relative;z-index:1;overflow:hidden;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:var(--r1);color:var(--ink3);font:500 calc(13.5px*var(--tz)) var(--f-l);letter-spacing:.01em;white-space:nowrap;transition:color calc(140ms*var(--mv)),transform calc(100ms*var(--mv)) var(--e-out)}
.sel-i svg{width:18px;height:18px}
.sel-i:hover,.sel-i.on{color:var(--ink)}
.mi-press .sel-i:active{transform:translateY(1px)}
.sel-k{position:absolute;left:0;top:0;width:40px;height:34px;border-radius:var(--r1);background:linear-gradient(180deg,var(--p2),var(--p1));box-shadow:var(--bev),0 1px 3px oklch(0 0 0 / calc(var(--sh)*.9));pointer-events:none;transition:transform calc(340ms*var(--mv)) var(--e-pop),width calc(340ms*var(--mv)) var(--e-pop),height calc(340ms*var(--mv)) var(--e-pop),opacity .2s}
.sel-k::after{content:"";position:absolute;left:50%;bottom:3px;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:var(--acc);box-shadow:0 0 7px var(--glow)}
:root[data-tab="B"] .sel{background:none;box-shadow:none}
:root[data-tab="B"] .sel-k{background:var(--acc);box-shadow:0 0 8px var(--glow);border-radius:2px}
:root[data-tab="B"] .sel-k::after,:root[data-tab="C"] .sel-k::after{display:none}
:root[data-tab="C"] .sel{background:none;box-shadow:none}
:root[data-tab="C"] .sel-k{border-radius:var(--rp);background:var(--acc-d);box-shadow:inset 0 0 0 1px var(--acc)}
.ct{display:inline-block;margin-left:7px;font:500 calc(12px*var(--tz)) var(--f-l);color:var(--ink3)}
[data-ct]{display:inline-block}
.mi-bump [data-ct].bump{animation:bump calc(420ms*var(--mv)) var(--e-pop)}
@keyframes bump{35%{transform:scale(1.5);color:var(--acc)}}

/* navigation, three ways (and the phone's bar) */
#nav{justify-self:center}
:root[data-nav="B"] #app{padding-left:86px}
:root[data-nav="B"] #nav{position:fixed;left:0;top:0;bottom:0;z-index:35;width:86px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) 8px 12px;border-radius:0;background:var(--p1);box-shadow:var(--bev),1px 0 0 var(--line)}
:root[data-nav="B"] .nv{flex-direction:column;justify-content:center;gap:4px;height:56px;padding:0;font-size:calc(11px*var(--tz))}
:root[data-nav="B"] .nv svg{width:21px;height:21px}
:root[data-nav="C"] #nav,:root[data-nav="P"] #nav{position:fixed;z-index:40;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:color-mix(in oklch,var(--p1) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--bev),var(--float)}
:root[data-nav="C"] .nv span,:root[data-nav="P"] .nv span{display:none}
:root[data-nav="C"] .nv,:root[data-nav="P"] .nv{width:46px;height:42px;padding:0;justify-content:center}
:root[data-nav="C"] .nv svg,:root[data-nav="P"] .nv svg{width:21px;height:21px}
:root[data-nav="P"] #nav{left:10px;right:10px;transform:none;justify-content:space-between;max-width:none}
:root[data-nav="P"] .nv{flex:1}
/* the bar gives way in steps when the room runs out: names, then the search words, the wordmark, the small hour meter */
:root[data-nav="A"]:not([data-fit="0"]) .nv:not(.on) span{display:none}
:root[data-nav="A"]:not([data-fit="0"]) .nv:not(.on){padding:0 10px}
:root:is([data-fit="2"],[data-fit="3"],[data-fit="4"]) :is(.srch span,.srch kbd,.clk small){display:none}
:root:is([data-fit="3"],[data-fit="4"]) .logo b{display:none}
:root[data-fit="4"] .clk .hm{display:none}

/* the cluster on the right of the bar */
.clu{display:flex;align-items:center;gap:6px;grid-column-end:-1;justify-self:end}
.clk{display:flex;align-items:center;gap:10px;margin-right:6px}
.clk small{display:block;font:500 calc(11px*var(--tz)) var(--f-l);color:var(--ink3);line-height:1.2;margin-top:2px}
.ib,.ibt{position:relative;display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:var(--r1);color:var(--ink2);overflow:hidden;transition:color calc(120ms*var(--mv)),background-color calc(120ms*var(--mv)),transform calc(90ms*var(--mv)) var(--e-out)}
.ibt{width:30px;height:30px}
.ibt svg{width:17px;height:17px}
.ib:hover,.ibt:hover{color:var(--ink);background:var(--hv)}
.mi-press .ib:active,.mi-press .ibt:active{transform:translateY(1px) scale(.95)}
.ib .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 1.5px var(--bg),0 0 7px var(--glow)}
.ib .dot.new{animation:ping 1.1s ease-out 2}

.srch{display:flex;width:auto;gap:8px;padding:0 10px 0 9px;color:var(--ink3);font:500 calc(13px*var(--tz)) var(--f-l)}
kbd{font:500 calc(11px*var(--tz)) var(--f-l);color:var(--ink3);padding:1px 6px;border-radius:calc(var(--r)*.35);background:var(--well);box-shadow:var(--sunk)}
.av{width:34px;height:34px;margin-left:4px;border-radius:50%;display:grid;place-items:center;font:600 calc(12px*var(--tz)) var(--f-l);background:linear-gradient(180deg,var(--p2),var(--p1));box-shadow:var(--bev),0 0 0 1px oklch(0 0 0 / calc(.3*var(--k))),0 0 0 3px var(--well);transition:transform calc(120ms*var(--mv)) var(--e-pop)}
.av:hover{transform:scale(1.08)}

/* ── page heading ── */
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:calc(20px*var(--sp))}
.hd h1{font-size:calc(44px*var(--ns));line-height:.95;view-transition-name:ttl}
.hd p{margin-top:6px;color:var(--ink3);font-size:calc(13px*var(--tz))}
.hd-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;margin:0 0 10px -8px;border-radius:var(--r1);color:var(--ink3);font:500 calc(13px*var(--tz)) var(--f-l)}
.back:hover{color:var(--ink);background:var(--hv)}
.back:hover svg{--mx:-3px}
.h3{display:flex;align-items:baseline;gap:9px;margin:calc(22px*var(--sp)) 0 8px;font:600 calc(13px*var(--tz)) var(--f-l);letter-spacing:.02em;color:var(--ink2)}
.h3 small{font-weight:500;color:var(--ink3)}

/* ── keys ── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--r1);overflow:hidden;font:500 calc(13.5px*var(--tz)) var(--f-l);letter-spacing:.01em;white-space:nowrap;color:var(--ink);background:linear-gradient(180deg,var(--p2),var(--p1));box-shadow:var(--bev),0 0 0 1px oklch(0 0 0 / calc(.34*var(--k) + .06)),0 2px 3px -1px oklch(0 0 0 / var(--sh));transition:transform calc(90ms*var(--mv)) var(--e-out),box-shadow calc(120ms*var(--mv)),filter calc(120ms*var(--mv)),background-color calc(120ms*var(--mv)),color calc(120ms*var(--mv))}

.btn:hover{filter:brightness(1.1)}

.btn.q{background:none;box-shadow:none;color:var(--ink2)}

.btn.p{padding-bottom:4px}
.btn.p::before{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--glow);transition:left calc(200ms*var(--mv)) var(--e-pop),right calc(200ms*var(--mv)) var(--e-pop)}
.btn.p:hover::before{left:6px;right:6px}
:root[data-pri="B"] .btn.p{padding-bottom:0;background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:var(--on);box-shadow:inset 0 1px 0 oklch(1 0 0 / .3),0 0 0 1px oklch(0 0 0 / .25),0 6px 14px -8px var(--acc)}
:root[data-pri="C"] .btn.p{padding-bottom:0;background:none;color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
:root[data-pri="B"] .btn.p::before,:root[data-pri="C"] .btn.p::before{display:none}

@keyframes rp{to{transform:scale(26);opacity:0}}

/* ── status lamps ── */

  ul.addEventListener('click', () => closeWin(), true); draw();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'), hb = e.target.closest('[data-hold]');
  if(hb && Date.now() - S.held < 500) return;
  if(hb && !hb.dataset.a){ tipHide(); tipShow(hb); return; }
  if(!a) return;
  const f = ACT[a.dataset.a]; if(f) f(a, e);
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); if(WIN && WIN.el.classList.contains('cmd')) closeWin(); else cmdOpen(document.activeElement); return; }
  if(e.key === 'Escape'){ if(POP) closePop(true); else if(WIN) closeWin(); else if(root.dataset.tune === '1') ACT.tune(); else if(typing) e.target.blur(); return; }
  if(POP && /^Arrow(Down|Up)$/.test(e.key)){ const m = $$('.mi', POP.el); if(m.length){ const i = m.indexOf(document.activeElement); m[(i + (e.key === 'ArrowDown' ? 1 : m.length - 1) + (i < 0 && e.key === 'ArrowUp' ? 1 : 0)) % m.length].focus(); e.preventDefault(); } return; }
  if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('tl')){ ACT.open(e.target); return; }
  if(e.key === 'Enter' && typing && e.target.isContentEditable){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('pointerdown', e => { if(POP && !POP.el.contains(e.target) && !(POP.a && POP.a.contains(e.target))) closePop(); tipHide(); }, true);
/* press and hold: the ring fills, then it happens */
let HOLD = null;
const holdEnd = done => { if(!HOLD) return; const h = HOLD; HOLD = null; clearTimeout(h.t); h.el.classList.remove('dn'); if(done){ S.held = Date.now(); (ACT[h.el.dataset.hold] || clockOut)(h.el); } else if(Date.now() - h.at > 220){ S.held = Date.now(); tipHide(); tipShow(h.el); } };
const holdStart = el => { if(HOLD) return; const ms = still() ? 350 : 850; el.style.setProperty('--hold', ms + 'ms'); el.classList.add('dn'); HOLD = { el, at: Date.now(), t: setTimeout(() => holdEnd(true), ms) }; };
ACT.clockout = clockOut;
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-hold]'); if(b && !(e.button > 0)) holdStart(b); });
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => holdEnd(false)));
document.addEventListener('pointerout', e => { if(HOLD && !HOLD.el.contains(e.relatedTarget) && HOLD.el.contains(e.target)) holdEnd(false); });
document.addEventListener('keydown', e => { if((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.dataset && e.target.dataset.hold){ e.preventDefault(); holdStart(e.target); } });
document.addEventListener('keyup', e => { if(HOLD && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); const el = HOLD.el, quick = Date.now() - HOLD.at <= 220; holdEnd(false); if(quick && el.dataset.a) ACT[el.dataset.a](el); } });
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-hold]')) e.preventDefault(); });
/* tips, and the light that follows the pointer when Motion is Lively */
document.addEventListener('mouseover', e => { const a = e.target.closest('[data-tip]'); if(!a || a.contains(e.relatedTarget)) return; clearTimeout(tipT); tipT = setTimeout(() => { tipHide(); tipShow(a); }, Date.now() - tipAt < 400 ? 60 : 480); });
document.addEventListener('mouseout', e => { const a = e.target.closest('[data-tip]'); if(a && !a.contains(e.relatedTarget)) tipHide(); });
document.addEventListener('focusin', e => { const a = e.target.closest && e.target.closest('[data-tip]'); if(a && a.matches(':focus-visible')){ tipHide(); tipShow(a); } });
document.addEventListener('focusout', tipHide);
document.addEventListener('input', e => { if(e.target.id === 'tm'){ S.tov = +e.target.value; $('#tm-v').textContent = fmtT(S.tov); light(); tick(); if(P('mode') === 'D') light(); } else if(e.target.id === 'nt'){ S.notes = e.target.value; save(); $('#pk').textContent = picks(); } });
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const n = innerWidth < 760 ? 'P' : P('nav'); if(root.dataset.nav !== n) root.dataset.nav = n; closePop(); marks(); }, 80); });
addEventListener('scroll', () => { tipHide(); }, { passive: true });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { light(); clu(); });

/* ── the small moves: ripple, magnet, tilt, light, drag, slide ── */
document.addEventListener('click', e => { if(Date.now() - S.dragged < 350){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !POP && !WIN && root.dataset.tune !== '1' && S.pan){ ACT.closepan(); e.stopPropagation(); return; }
  const s = e.target.closest && e.target.closest('.sl'); if(s && (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === ' ')){ e.preventDefault(); s.classList.add('back'); s.style.setProperty('--x', (s.offsetWidth - 54) + 'px'); setTimeout(() => { const f = ACT[s.dataset.slide]; s.style.setProperty('--x', '0px'); if(f) f(s); }, still() ? 0 : 430); }
}, true);
document.addEventListener('pointerdown', e => {
  if(e.button > 0) return;
  const sl = e.target.closest('.sl'); if(sl){ sl.classList.remove('back'); SLD = { s: sl, x0: e.clientX - (parseFloat(sl.style.getPropertyValue('--x')) || 0), max: sl.offsetWidth - 54 }; e.preventDefault(); return; }
  const dg = e.target.closest('[data-drag]'); if(dg && e.pointerType !== 'touch' && !e.target.closest('.ni-a')) DR = { el: dg, no: dg.dataset.drag, x: e.clientX, y: e.clientY, g: null, over: null };
  if(!on('ripple') || still()) return;
  const el = e.target.closest('.btn,.ib,.ibt,.tl,.to,.sel-i,.mi,.bt,.ni'); if(!el || el.disabled) return;
  const r = el.getBoundingClientRect(), s = document.createElement('span'); s.className = 'rp'; s.style.setProperty('--x', (e.clientX - r.left) + 'px'); s.style.setProperty('--y', (e.clientY - r.top) + 'px'); el.appendChild(s); setTimeout(() => s.remove(), 700);
});
let DR = null, SLD = null, raf = 0, lastE = null, hot = null;
function moved(){
  raf = 0; const e = lastE; if(!e) return;
  if(SLD){ const x = clamp(e.clientX - SLD.x0, 0, SLD.max); SLD.s.style.setProperty('--x', x + 'px'); SLD.s.setAttribute('aria-valuenow', Math.round(x / SLD.max * 100)); return; }
  if(DR){
    const dx = e.clientX - DR.x, dy = e.clientY - DR.y;
    if(!DR.g){ if(Math.hypot(dx, dy) < 7) return; const b = DR.el.getBoundingClientRect(), g = DR.el.cloneNode(true); g.classList.add('ghost'); g.style.width = b.width + 'px'; g.style.height = b.height + 'px'; g.style.margin = '0'; DR.ox = b.left; DR.oy = b.top; document.body.appendChild(g); DR.g = g; DR.el.classList.add('dragging'); root.classList.add('drag-on'); tipHide(); if(peekEl){ peekEl.remove(); peekEl = null; } }
    DR.g.style.setProperty('--gx0', (DR.ox + dx) + 'px'); DR.g.style.setProperty('--gy0', (DR.oy + dy) + 'px');
    const t = document.elementFromPoint(e.clientX, e.clientY), d = t && t.closest('[data-drop]'); if(d !== DR.over){ if(DR.over) DR.over.classList.remove('over'); DR.over = d; if(d) d.classList.add('over'); }
    return;
  }
  if(e.pointerType === 'touch') return;
  const bk = $('#bk'); bk.style.setProperty('--px', e.clientX + 'px'); bk.style.setProperty('--py', e.clientY + 'px');
  const t = e.target.closest ? e.target.closest('.tl,.ib,.ibt,.nv') : null;
  if(hot && hot !== t){ ['--rx', '--ry', '--px', '--py'].forEach(k => hot.style.removeProperty(k)); const s = $('svg.i', hot); if(s){ s.style.removeProperty('--mx'); s.style.removeProperty('--my'); } }
  hot = t; if(!t) return; const r = t.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if(t.classList.contains('tl')){ t.style.setProperty('--px', x + 'px'); t.style.setProperty('--py', y + 'px'); if(on('tilt') && !still()){ t.style.setProperty('--rx', ((.5 - y / r.height) * 7).toFixed(2) + 'deg'); t.style.setProperty('--ry', ((x / r.width - .5) * 7).toFixed(2) + 'deg'); } }
  else if(on('mag') && !still()){ const s = $('svg.i', t); if(s){ s.style.setProperty('--mx', clamp((x - r.width / 2) * .3, -4, 4).toFixed(1) + 'px'); s.style.setProperty('--my', clamp((y - r.height / 2) * .3, -4, 4).toFixed(1) + 'px'); } }
}
document.addEventListener('pointermove', e => { lastE = e; if(!raf) raf = requestAnimationFrame(moved); });
function dropEnd(){
  if(SLD){ const d = SLD; SLD = null; const x = parseFloat(d.s.style.getPropertyValue('--x')) || 0; d.s.classList.add('back'); d.s.style.setProperty('--x', '0px'); if(x > d.max * .9){ S.dragged = Date.now(); const f = ACT[d.s.dataset.slide]; if(f) f(d.s); } return; }
  if(!DR) return; const d = DR; DR = null; if(!d.g) return;
  S.dragged = Date.now(); root.classList.remove('drag-on'); d.el.classList.remove('dragging');
  if(d.over){ d.over.classList.remove('over'); d.g.remove(); const kv = d.over.dataset.drop.split(':'); if(kv[0] === 'tech') assignTo(d.no, kv[1]); else if(kv[0] === 'bay') toBay(d.no, +kv[1]); else toYard(d.no); }
  else { d.g.classList.add('home'); d.g.style.setProperty('--gx0', d.ox + 'px'); d.g.style.setProperty('--gy0', d.oy + 'px'); setTimeout(() => d.g.remove(), 380); }
}
document.addEventListener('pointerup', dropEnd); document.addEventListener('pointercancel', dropEnd);
/* a bay's truck: point at it for the customer, the complaint and who has it */
let peekEl = null;
document.addEventListener('mouseover', e => {
  const a = e.target.closest('[data-peek]'); if(!a || a.contains(e.relatedTarget) || DR) return; const r = ro(a.dataset.peek); if(!r) return;
  if(peekEl) peekEl.remove(); const el = document.createElement('div'); el.className = 'peek';
  el.innerHTML = `<b>${esc(r.cust)}</b><small>${esc(r.truck)}, unit ${r.unit}</small><p>${esc(JOB[r.ops[curOp(r)][0]][0])}</p><small>${r.tech ? 'With ' + PPL[r.tech] : 'No one has it yet'}, ready ${esc(r.ready)}</small>`;
  layer.appendChild(el); const b = a.getBoundingClientRect(); el.style.left = clamp(b.left, 8, innerWidth - 240) + 'px'; el.style.top = (b.bottom + 8 + el.offsetHeight > innerHeight ? b.top - el.offsetHeight - 8 : b.bottom + 8) + 'px'; requestAnimationFrame(() => el.classList.add('in')); peekEl = el;
});
document.addEventListener('mouseout', e => { const a = e.target.closest('[data-peek]'); if(a && !a.contains(e.relatedTarget) && peekEl){ peekEl.remove(); peekEl = null; } });
/* sliders: drag to tune, double-click the name to put it back */
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.s; if(!k) return; const d = IDX[k]; S.s[k] = d.inv ? +(d.s[0] + d.s[1] - e.target.value).toFixed(4) : +e.target.value; save(); apply(); tuneSync(); requestAnimationFrame(marks); });
let rz2 = 0; addEventListener('resize', () => { clearTimeout(rz2); rz2 = setTimeout(() => { fit(); marks(); }, 110); });
document.addEventListener('dblclick', e => { const l = e.target.closest('.tm'); if(!l) return; const k = $('[data-s]', l).dataset.s; if(S.s[k] == null) return; delete S.s[k]; save(); apply(); tuneSync(); requestAnimationFrame(marks); });

/* the shop keeps moving: two things arrive by themselves */
function arrive(n){
  if(POP || WIN || HOLD || DR || SLD || (document.activeElement && document.activeElement.isContentEditable)){ setTimeout(() => arrive(n), 5000); return; }
  const r = ro(n ? '3503' : '4460'); if(!r || r.st !== (n ? 'Waiting – Customer' : 'Waiting – Parts')) return;
  if(n){ r.st = 'Waiting – Parts'; r.ops[0][1] = 'Complete'; r.next = 'Order the NOx sensor'; r.who = 'Ben'; r.stage = 3; r.part = .3; MSG.unshift(['customer', 'Customer approved RO 3503', 'Jenna Cho, just now', '3503']); }
  else { r.st = 'Hold Tech'; r.ops[0][1] = 'Hold Tech'; r.next = 'Start Op 1'; r.who = 'Mike'; r.stage = 4; r.part = .05; MSG.unshift(['done', 'Parts are in for RO 4460', 'Ben Okafor, just now', '4460']); }
  S.unread++; S.fresh = true; clu(); S.fresh = false; render(); toast(MSG[0][1], { tone: MSG[0][0] });
}
setTimeout(() => arrive(0), 24000); setTimeout(() => arrive(1), 64000);

/* ── start ── */
$('#tune-b').innerHTML = ic('sliders') + 'Tune the look';
$('#tune').innerHTML = tuneHtml(); $('#nt').value = S.notes;
nav(); apply(); clu(); render(); boot();
setInterval(tick, 1000);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(marks); setTimeout(marks, 700);
if(/[?&]tune=1/.test(location.search)) ACT.tune();
})();

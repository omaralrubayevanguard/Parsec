<!doctype html>
<html lang="en" data-th="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec · Data storage</title>
<style>
/* ---------- tokens: two themes (rename to the app's own, e.g. Ivory / Graphite) ---------- */
:root,[data-th="light"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--warn:#AD7210;--bad:#C0503F;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light}
[data-th="dark"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--warn:#E2A84C;--bad:#EC7F6C;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{--sans:"Inter","Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
/* ---------- the frame (prefix ip- so the drawn visuals' classes can't collide) ---------- */
.ip-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.ip-bar h1{margin:0 auto 0 0;display:flex;align-items:baseline;gap:10px;font:500 19px/24px var(--serif)}
.ip-bar h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ip-jump{display:flex;gap:2px;flex-wrap:wrap} .ip-jump a{padding:4px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);text-decoration:none} .ip-jump a:hover{background:var(--fill)}
.ip-seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.ip-seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)} .ip-seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.ip-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12.5px/1 var(--sans)}
.ip-btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .ip-btn em{font-style:normal;opacity:.7;font-size:11px}
.ip-btn:focus-visible,.ip-opt:focus-visible,.ip-seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ip-wrap{max-width:1500px;margin:0 auto;padding:18px 16px 120px}
.ip-now{margin:0 0 20px;padding:14px 16px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)} .ip-now h2{margin:0 0 8px;font:500 15px/1 var(--serif)}
.ip-lead{margin:0 2px 18px;color:var(--ink2)}
.ip-sec{margin:0 0 26px;scroll-margin-top:64px} .ip-sec h2{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font:500 22px/28px var(--serif)} .ip-sec h2 small{font:400 12.5px var(--sans);color:var(--ink3)}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px} @media (max-width:980px){.ip-grid{grid-template-columns:1fr}}
.ip-idea{min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.ip-idea.picked{box-shadow:0 0 0 1.5px var(--accl),var(--shadow)}
.ip-idea h3{margin:0;font:600 15px/20px var(--sans)} .ip-idea header p{margin:3px 0 0;font-size:12.5px;line-height:17px;color:var(--ink3)}
.ip-vis{position:relative;min-height:96px;padding:12px;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hair);font-size:12.5px;overflow:hidden}
.ip-replay{all:unset;cursor:pointer;position:absolute;right:8px;bottom:8px;z-index:5;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--ink3);font-size:11px}
.ip-ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px}
.ip-opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:16px;color:var(--ink2)}
.ip-opt:hover{background:var(--fill)} .ip-opt i{width:14px;height:14px;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)}
.ip-opt b{display:block;font-weight:500;color:var(--ink)} .ip-opt small{display:block;font-size:11.5px;color:var(--ink3)}
.ip-opt[aria-pressed="true"]{background:var(--acct)} .ip-opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)}
#ip-picks{position:fixed;z-index:85;right:16px;top:62px;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#ip-picks[hidden]{display:none}
#ip-picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);white-space:pre-wrap}
#ip-picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font-size:13px;resize:vertical;outline:none}
.ip-ph{display:flex;align-items:center;font:500 18px/1 var(--serif)} .ip-ph b{flex:1;font-weight:500} .ip-ph button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.ip-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;padding:10px 14px;border-radius:10px;background:var(--primary);color:var(--onprimary);font-size:13px;box-shadow:var(--raise)}
@media (max-width:640px){ .ip-grid{grid-template-columns:1fr} #ip-picks{left:16px;right:16px;width:auto} .ip-bar h1 small{display:none} }

/* ---------- the drawn visuals (v-) · each stage animates with [data-step] on .ip-vis ---------- */
.ip-vis{padding:0}
.v-st{position:relative;height:230px;padding:12px;overflow:hidden;font-size:12px}
.v-st.h-s{height:190px} .v-st.h-l{height:270px} .v-st.h-xl{height:300px}
.v-cur{position:absolute;left:calc(100% - 30px);top:calc(100% - 26px);width:14px;height:14px;z-index:20;pointer-events:none;transition:left .55s cubic-bezier(.2,.75,.25,1),top .55s cubic-bezier(.2,.75,.25,1)}
.v-cur::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,0 100%,30% 72%,52% 100%,64% 94%,44% 66%,80% 66%);background:var(--ink);filter:drop-shadow(0 0 1px var(--raised))}
.v-cur::after{content:"";position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(.3)}
[data-step^="c-"] .v-cur::after{animation:v-ripple .45s ease-out}
@keyframes v-ripple{0%{opacity:.4;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.v-note{position:absolute;left:12px;bottom:10px;z-index:6;max-width:calc(100% - 60px);padding:3px 8px;border-radius:999px;background:var(--acct);color:var(--acc);font-size:11px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.v-note.bad{background:color-mix(in srgb,var(--bad) 12%,var(--panel));color:var(--bad)}
.v-note.good{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)}
.v-b{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 12px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.v-b.pri{background:var(--primary);color:var(--onprimary);box-shadow:none}
.v-ic{width:13px;height:13px;flex:none}
.v-mono{font-family:var(--mono)}
.v-ok{color:var(--good);font-weight:700} .v-no{color:var(--bad);font-weight:700}
/* chips (1) */
.v-cols{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;align-items:start}
.v-chips{display:flex;flex-wrap:wrap;gap:5px}
.v-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:11px;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.v-chip i{font-style:normal;font-weight:700;width:10px;text-align:center;opacity:0;transition:opacity .2s}
.v-fold{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:14px;font-size:11px;color:var(--ink3);text-align:center}
.v-fold svg{width:56px;height:46px;color:var(--acc)}
[data-step="now"] .v-chip.miss,[data-step="flow"] .v-chip.miss{box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
[data-step="flow"] .v-chip i,[data-step="fix"] .v-chip i,[data-step="lint"] .v-chip i{opacity:1}
[data-step="flow"] .v-chip:not(.miss){background:color-mix(in srgb,var(--good) 12%,var(--panel))} [data-step="flow"] .v-chip:not(.miss) i::before{content:"✓";color:var(--good)} [data-step="flow"] .v-chip.miss i::before{content:"✕"}
[data-step="fix"] .v-chip,[data-step="lint"] .v-chip{background:color-mix(in srgb,var(--good) 12%,var(--panel))} [data-step="fix"] .v-chip i::before,[data-step="lint"] .v-chip i::before{content:"✓";color:var(--good)}
.v-log{margin-top:10px;padding:6px 9px;border-radius:7px;background:var(--primary);color:var(--onprimary);font:500 11px/1.4 var(--mono);opacity:0;transition:opacity .3s}
[data-step="lint"] .v-log{opacity:1}
[data-step="now"] .v-n1,[data-step="flow"] .v-n1{opacity:1;transform:none}
/* computers + folder (2) */
.v-net{display:grid;grid-template-columns:1fr 96px 1fr;gap:10px;align-items:center}
.v-box{padding:8px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:11.5px;line-height:16px}
.v-box b{display:block;font-size:12px;margin-bottom:2px}
.v-chg{display:block;padding:3px 6px;border-radius:6px;background:var(--acct);color:var(--acc);font-size:11px;transition:opacity .3s,text-decoration .3s}
.v-mid{text-align:center;color:var(--ink3);font-size:11px} .v-mid svg{width:44px;height:38px;color:var(--acc)}
.v-dlg{position:absolute;left:12px;right:12px;top:100px;padding:8px 10px;border-radius:10px;background:var(--raised);box-shadow:var(--raise);font-size:11.5px;opacity:0;transition:opacity .3s}
.v-dlg b{display:block;margin-bottom:6px}
.v-dlg .v-r{display:flex;gap:6px}
.v-res{position:absolute;left:12px;right:12px;top:100px;padding:8px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:11.5px;line-height:18px;opacity:0;transition:opacity .3s}
[data-step="now"] .v-dlg{opacity:1}
[data-step="now"] .v-lost{text-decoration:line-through;opacity:.5}
[data-step="merge"] .v-res{opacity:1}
[data-step="now"] .v-n2b{opacity:1;transform:none} [data-step="merge"] .v-n2g{opacity:1;transform:none}
/* backups timeline (3) */
.v-tl{position:relative;height:56px;margin:22px 0 8px}
.v-trk{position:absolute;left:0;right:0;top:18px;height:20px;border-radius:6px;background:var(--fill)}
.v-work{position:absolute;left:4%;top:3px;bottom:3px;width:92%;border-radius:4px;background:#8A6A3E;opacity:.75}
.v-gap{position:absolute;left:7%;right:4%;top:0;bottom:0;border-radius:6px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 30%,transparent) 0 5px,transparent 5px 10px);opacity:0;transition:opacity .3s}
.v-mk{position:absolute;top:10px;width:0;height:36px;border-left:2px solid var(--ink);transition:opacity .3s} .v-mk em{position:absolute;bottom:100%;left:-2px;font-size:10px;font-style:normal;white-space:nowrap;color:var(--ink2);background:var(--canvas);padding:0 3px}
.v-mk.new{border-color:var(--good);opacity:0} .v-mk.new em{color:var(--good)}
.v-ax{position:absolute;left:0;right:0;bottom:-4px;display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--ink3)}
[data-step="gap"] .v-gap{opacity:1}
[data-step="new"] .v-mk.new,[data-step="list"] .v-mk.new{opacity:1} [data-step="new"] .v-mk.old,[data-step="list"] .v-mk.old{opacity:.25}
.v-files{display:flex;flex-direction:column;gap:3px;margin-top:6px;opacity:0;transition:opacity .3s}
[data-step="list"] .v-files{opacity:1}
.v-file{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--ink2)} .v-file svg{width:13px;height:13px;color:var(--ink3)} .v-file small{margin-left:auto;font-family:var(--sans);color:var(--ink3)}
[data-step="gap"] .v-n3{opacity:1;transform:none}
/* clean values (4) */
.v-tbl{display:flex;flex-direction:column;border-radius:9px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.v-tr{display:grid;grid-template-columns:96px minmax(0,1fr) 16px minmax(0,1fr);gap:6px;align-items:center;min-height:30px;padding:0 9px;box-shadow:inset 0 -1px 0 var(--hair);font-size:11.5px}
.v-tr:last-child{box-shadow:none}
.v-tr .k{color:var(--ink3)} .v-tr .a{font-family:var(--mono);font-size:11px;color:var(--bad);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v-tr .z{font-family:var(--mono);font-size:11px;color:var(--good);opacity:0;transition:opacity .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .v-tr .ar{color:var(--ink3);opacity:0;transition:opacity .3s}
[data-step="r1"] .v-tr:nth-child(-n+1) .z,[data-step="r2"] .v-tr:nth-child(-n+2) .z,[data-step="r3"] .v-tr:nth-child(-n+3) .z,[data-step="r4"] .v-tr:nth-child(-n+4) .z,[data-step="r5"] .v-tr .z{opacity:1}
[data-step="r1"] .v-tr:nth-child(-n+1) .ar,[data-step="r2"] .v-tr:nth-child(-n+2) .ar,[data-step="r3"] .v-tr:nth-child(-n+3) .ar,[data-step="r4"] .v-tr:nth-child(-n+4) .ar,[data-step="r5"] .v-tr .ar{opacity:1}
[data-step="r5"] .v-n4{opacity:1;transform:none}
/* folder trees (5, 6, 7) */
.v-tree{display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.v-tn{display:flex;align-items:center;gap:6px;height:22px;white-space:nowrap;transition:opacity .35s,background .3s;border-radius:5px;padding-right:6px}
.v-tn svg{width:14px;height:14px;flex:none;color:var(--acc)} .v-tn.f svg{color:var(--ink3)}
.v-tn small{color:var(--ink3);margin-left:4px;font-size:10.5px}
.v-l1{padding-left:16px} .v-l2{padding-left:32px} .v-l3{padding-left:48px} .v-l4{padding-left:64px}
.v-tn.moved{opacity:0;height:0;overflow:hidden}
[data-step="close"] .v-tn.mv1{background:var(--acct)}
[data-step="moved"] .v-tn.mv1,[data-step="hold"] .v-tn.mv1{opacity:0;height:0;overflow:hidden}
[data-step="moved"] .v-tn.moved,[data-step="hold"] .v-tn.moved{opacity:1;height:22px;background:var(--acct)}
.v-pillst{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:999px;background:var(--fill);font-size:10.5px;font-weight:600;color:var(--ink2);transition:background .3s,color .3s}
[data-step="close"] .v-pillst,[data-step="moved"] .v-pillst,[data-step="hold"] .v-pillst{background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)}
.v-pillst .t2{display:none} [data-step="close"] .v-pillst .t1,[data-step="moved"] .v-pillst .t1,[data-step="hold"] .v-pillst .t1{display:none} [data-step="close"] .v-pillst .t2,[data-step="moved"] .v-pillst .t2,[data-step="hold"] .v-pillst .t2{display:inline}
.v-name{display:flex;flex-direction:column;gap:8px}
.v-nm{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center;font-size:11.5px} .v-nm>small{color:var(--ink3)}
.v-nm .v-tn{background:var(--panel);box-shadow:var(--shadow);padding:0 8px;height:26px}
.v-cust{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:11.5px}
.v-cust .t2,.v-nm .t2{display:none}
[data-step="edit"] .v-cust,[data-step="today"] .v-cust,[data-step="stay"] .v-cust{box-shadow:inset 0 0 0 2px var(--acc)}
[data-step="edit"] .v-cust .t1,[data-step="today"] .v-cust .t1,[data-step="stay"] .v-cust .t1{display:none} [data-step="edit"] .v-cust .t2,[data-step="today"] .v-cust .t2,[data-step="stay"] .v-cust .t2{display:inline}
[data-step="today"] .v-nm.nowr .t1,[data-step="stay"] .v-nm.nowr .t1{display:none} [data-step="today"] .v-nm.nowr .t2,[data-step="stay"] .v-nm.nowr .t2{display:inline}
[data-step="today"] .v-nm.nowr .v-tn{box-shadow:inset 0 0 0 1.5px var(--bad)}
[data-step="stay"] .v-nm.newr .v-tn{box-shadow:inset 0 0 0 1.5px var(--good)}
[data-step="today"] .v-n6b{opacity:1;transform:none} [data-step="stay"] .v-n6g{opacity:1;transform:none}
.v-in{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.v-in h6{margin:0 0 6px;font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.v-in .v-new .v-tn{opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}
[data-step="split"] .v-in .v-new .v-tn,[data-step="hold"] .v-in .v-new .v-tn{opacity:1;transform:none}
[data-step="split"] .v-in .v-new .v-tn:nth-child(3){transition-delay:.15s} [data-step="split"] .v-in .v-new .v-tn:nth-child(4){transition-delay:.3s}
.v-hid{font-size:10.5px;color:var(--bad);margin:4px 0 0 20px}
/* shop split (8) */
.v-shop{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:start}
.v-big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);font-size:11.5px;text-align:center;transition:opacity .35s,transform .35s}
.v-big svg{width:34px;height:40px;color:var(--ink3)} .v-big small{color:var(--ink3)}
[data-step="split"] .v-big,[data-step="hold"] .v-big{opacity:.35;transform:scale(.94)}
[data-step="crack"] .v-big{box-shadow:inset 0 0 0 2px var(--acc)}
.v-parts{display:flex;flex-direction:column;gap:2px}
.v-parts .v-tn{opacity:0;transform:translateX(-10px);transition:opacity .25s,transform .25s}
[data-step="split"] .v-parts .v-tn,[data-step="hold"] .v-parts .v-tn{opacity:1;transform:none}
.v-parts .v-tn:nth-child(2){transition-delay:.06s}.v-parts .v-tn:nth-child(3){transition-delay:.12s}.v-parts .v-tn:nth-child(4){transition-delay:.18s}.v-parts .v-tn:nth-child(5){transition-delay:.24s}.v-parts .v-tn:nth-child(6){transition-delay:.3s}.v-parts .v-tn:nth-child(7){transition-delay:.36s}.v-parts .v-tn:nth-child(8){transition-delay:.42s}.v-parts .v-tn:nth-child(9){transition-delay:.48s}
/* document → tables (9) */
.v-doc{position:absolute;left:12px;top:12px;width:180px;padding:8px 10px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font:500 10.5px/1.5 var(--mono);color:var(--ink2);transition:opacity .4s,transform .4s}
.v-doc b{color:var(--ink)}
[data-step="tables"] .v-doc,[data-step="hold"] .v-doc{opacity:.25;transform:scale(.92)}
.v-tabs{position:absolute;left:206px;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.v-tab{border-radius:8px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateX(12px);transition:opacity .3s,transform .3s}

        '<div class="v-chk"><div><i>✓</i>Data version<span>v15</span></div><div><i>✓</i>Repair orders<span>148</span></div><div><i>✓</i>Operations · parts<span>321 · 408</span></div><div><i>✓</i>Punches · day clocks<span>369 · 249</span></div><div><i>✓</i>Attachments<span>every file</span></div><div><i>✓</i>Checksums match<span>sha-256</span></div></div>' +
        '<span class="v-note good v-n10">Arrived complete — or it refuses and says what’s missing</span></div>',
      steps: [['pack', 900], ['send', 1100], ['t1', 700], ['t2', 700], ['done', 2000]],
      opts: [['full', 'A list, counts and checksums — refuse on a mismatch', ''], ['counts', 'Counts only', ''], ['none', 'Skip the list', '']] },
    { k: 'changes', t: 'Send changes, not copies', why: 'Every record says when it last changed, and a delete is marked instead of erased — so a sync sends only what changed, deletes included.',
      vis: '<div class="v-st h-s"><div class="v-recs"><div class="v-rec e1"><span class="id">pn_7xk</span><span class="w">Punch · 2253 · 09:30–11:40</span><span class="m"><span class="t1">changed 08:02</span><span class="t2">changed 14:52</span></span></div>' +
        '<div class="v-rec e2"><span class="id">pn_2ab</span><span class="w">Punch · 7156 · 12:30–13:10</span><span class="m"><span class="t1">changed 12:30</span><span class="t2">deleted 15:01 · kept</span></span></div>' +
        '<div class="v-rec"><span class="id">pn_9qd</span><span class="w">Punch · 7156 · 13:10–14:52</span><span class="m">changed 14:52</span></div></div>' +
        '<div class="v-syn"><span>2 changes</span><span class="v-lane"><i class="v-dot"></i></span><span>the server</span></div></div>',
      steps: [['idle', 900], ['edit', 1100], ['del', 1100], ['sync', 1900]],
      opts: [['marks', 'Changed-at and deleted marks on every record', 'deleted marks are cleared after the server has them'], ['full', 'Send a full copy each time', '']] },
    { k: 'export', t: 'One button: Export for the server', why: 'A single package with the data, the photos and the list — and a check that reads it back.',
      vis: '<div class="v-st h-s"><div class="v-exp"><div class="v-brow"><span class="v-b pri v-b1">' + I_PKG.replace('<svg', '<svg class="v-ic"') + 'Export for the server</span><span class="v-b v-b2">Round-trip check</span></div><div class="v-prog"><i></i></div>' +
        '<div class="v-file v-made">' + I_FL + 'Parsec export 2026-10-30.zip<small>data 77 KB + the photos</small></div>' +
        '<div class="v-rt"><span class="v-ok">✓</span> Exported and read back into an empty copy — identical, 0 differences</div></div>' + CUR + '</div>',
      steps: [['idle', 700], ['p-exp', 600], ['c-exp', 1000], ['made', 900], ['p-rt', 600], ['c-rt', 500], ['ok', 1800]],
      opts: [['both', 'Export + a round-trip check', 'on the Settings page, for the manager and admin'], ['exp', 'Export only', '']] }
  ]},
  { group: 'Smaller files', items: [
    { k: 'gzip', t: 'Compress what isn’t opened every day', why: 'Built into the browser — no installs. Numbers from the 148-RO sample.',
      vis: '<div class="v-st h-s"><div class="v-bars"><div class="v-bar"><span>Everything saved</span><span class="tr"><i></i></span><span class="n"><span class="t1">703 KB</span><span class="t2">77 KB</span></span></div>' +
        '<div class="v-bar"><span>A daily backup</span><span class="tr"><i></i></span><span class="n"><span class="t1">1.06 MB</span><span class="t2">86 KB</span></span></div>' +
        '<div class="v-bar"><span>A closed RO</span><span class="tr"><i></i></span><span class="n"><span class="t1">3.3 KB</span><span class="t2">1.2 KB</span></span></div></div>' +
        '<span class="v-note good v-n13">About 9–12× smaller</span></div>',
      steps: [['raw', 1300], ['zip', 2200]],
      opts: [['cold', 'Backups and Closed years compressed', 'open ROs stay plain, so anyone can open them'], ['all', 'Everything compressed', ''], ['none', 'No compression', '']] },
    { k: 'slim', t: 'Save less of the same thing', why: 'The Completed ROs record copies whole ROs — 114 KB of the 278 KB shop data. A phone photo is often 3–5 MB.',
      vis: '<div class="v-st h-s"><div class="v-bars"><div class="v-bar"><span>Completed ROs</span><span class="tr"><i></i></span><span class="n"><span class="t1">114 KB</span><span class="t2">31 KB</span></span></div>' +
        '<div class="v-bar"><span>One phone photo</span><span class="tr"><i></i></span><span class="n"><span class="t1">4.8 MB</span><span class="t2">420 KB</span></span></div></div>' +
        '<span class="v-note good v-n14">IDs and hours only · photos to 1600 px wide</span></div>',
      steps: [['raw', 1300], ['slim', 2200]],
      opts: [['both', 'Slim the Completed record + shrink big photos', 'the full copy of a deleted RO is still kept'], ['rec', 'Slim the Completed record only', ''], ['as', 'As now', '']] }
  ]}
];
var NOW = '<div class="v-now"><div class="bad"><b>9</b>kinds of data never reach the folder — permissions, time-fix asks, air reasons, Completed ROs…</div><div><b>50</b>kinds of things in one Shop.html (278 KB in the sample), rewritten on almost every click</div><div class="bad"><b>1</b>backup a day, at the first save — the day’s work isn’t in it</div><div><b>5</b>ways of writing a date · money kept as text</div><div><b>148</b>ROs → 148 folders in one place, open and closed together</div><div><b>9×</b>smaller if compressed — 703 KB → 77 KB</div></div>';

document.getElementById('ip-nowx').innerHTML = NOW;

/* ---------- the page ---------- */
var D = document, $ = function (s, r) { return (r || D).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || D).querySelectorAll(s)); };
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var V = { th: 'light', open: false, v: {}, note: '' };
try { var sv = JSON.parse(localStorage.getItem(KEY) || '{}'); if (sv.v) V.v = sv.v; if (sv.note) V.note = sv.note; if (sv.th) V.th = sv.th; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: V.v, note: V.note, th: V.th })); } catch (e) {} }
var total = IDEAS.reduce(function (a, g) { return a + g.items.length; }, 0);
$('#ip-lead').textContent = total + ' idea' + (total === 1 ? '' : 's') + ' for how Parsec saves its data — what’s wrong today, the fixes, a layout ready for the server. Pick an option on each, or Skip, then copy Your picks into the chat.';
$('#ip-jump').innerHTML = IDEAS.map(function (g, i) { return '<a href="#ip-s' + i + '">' + esc(g.group) + '</a>'; }).join('');
$('#ip-secs').innerHTML = IDEAS.map(function (g, i) {
  return '<section class="ip-sec" id="ip-s' + i + '"><h2>' + esc(g.group) + ' <small>' + g.items.length + ' idea' + (g.items.length > 1 ? 's' : '') + '</small></h2><div class="ip-grid">' + g.items.map(function (it) {
    var o = it.opts.concat([['skip', 'Skip', '']]);
    return '<article class="ip-idea" data-k="' + it.k + '"><header><h3>' + esc(it.t) + '</h3><p>' + esc(it.why) + '</p></header><div class="ip-vis" data-step="' + (it.steps ? it.steps[0][0] : '') + '">' + it.vis + (it.steps ? '<button class="ip-replay" aria-label="Play it again" title="Play it again">↻</button>' : '') + '</div><div class="ip-ol">' +
      o.map(function (x) { return '<button class="ip-opt" data-k="' + it.k + '" data-v="' + x[0] + '" aria-pressed="false"><i></i><span><b>' + esc(x[1]) + '</b>' + (x[2] ? '<small>' + esc(x[2]) + '</small>' : '') + '</span></button>'; }).join('') + '</div></article>';
  }).join('') + '</div></section>';
}).join('');
/* ---------- the animations: each visual plays its action, step by step, then loops ---------- */
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function find(k) { var r = null; IDEAS.forEach(function (g) { g.items.forEach(function (it) { if (it.k === k) r = it; }); }); return r; }
function play(vis, it) {
  clearTimeout(vis._t); if (!it.steps) return;
  if (RM) { vis.dataset.step = it.steps[it.steps.length - 1][0]; return; }   /* reduced motion: the end state, still */
  var i = 0; (function next() { var s = it.steps[i]; vis.dataset.step = s[0]; i = (i + 1) % it.steps.length; vis._t = setTimeout(next, s[1]); })();
}
var IO = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) { es.forEach(function (en) { var vis = en.target, it = find(vis.closest('.ip-idea').dataset.k); if (en.isIntersecting) play(vis, it); else clearTimeout(vis._t); }); }, { threshold: .2 }) : null;
$$('.ip-vis').forEach(function (vis) { var it = find(vis.closest('.ip-idea').dataset.k); if (IO) IO.observe(vis); else play(vis, it); });
/* ---------- Your picks ---------- */
function pkText() {
  var L = [APP + ' · ' + TOPIC + ' — my picks'];
  IDEAS.forEach(function (g) { var rows = []; g.items.forEach(function (it) { var v = V.v[it.k]; if (!v) return; var o = it.opts.filter(function (x) { return x[0] === v; })[0]; rows.push('· ' + it.t + ': ' + (v === 'skip' ? 'skip' : o ? o[1] : v)); }); if (rows.length) { L.push(g.group + ':'); L = L.concat(rows); } });
  var left = total - Object.keys(V.v).length; if (left) L.push('(not picked yet: ' + left + ')');
  if (V.note.trim()) L.push('Notes: ' + V.note.trim());
  return L.join('\n');
}
function sync() {
  D.documentElement.setAttribute('data-th', V.th);
  $$('.ip-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.th === V.th)); });
  $$('.ip-opt').forEach(function (b) { b.setAttribute('aria-pressed', String(V.v[b.dataset.k] === b.dataset.v)); });
  $$('.ip-idea').forEach(function (a) { a.classList.toggle('picked', !!V.v[a.dataset.k]); });
  var n = Object.keys(V.v).length; $('#ip-n').textContent = n ? n + '/' + total : '';
}
function draw() {
  var w = $('#ip-picks'); w.hidden = !V.open; if (!V.open) return;
  var ta = $('#ip-note'); if (ta && D.activeElement === ta) { $('#ip-picks pre').textContent = pkText(); return; }
  w.innerHTML = '<div class="ip-ph"><b>Your picks</b><button data-pk="x" aria-label="Close">✕</button></div><pre>' + esc(pkText()) + '</pre><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)">Anything else<textarea id="ip-note" placeholder="Anything to add or change">' + esc(V.note) + '</textarea></label><button class="ip-btn pri" data-pk="copy" style="justify-content:center;height:34px">Copy for the chat</button>';
}
function toast(m) { var t = $('.ip-toast'); if (t) t.remove(); t = D.createElement('div'); t.className = 'ip-toast'; t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function () { t.remove(); }, 2600); }
function copy(tx) {
  var fb = function () { var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try { D.execCommand('copy'); toast('Copied — paste it in the chat.'); } catch (e) { toast('Select the text and copy it.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Copied — paste it in the chat.'); }, fb); else fb();
}
D.addEventListener('click', function (ev) {
  var t = ev.target, b;
  if ((b = t.closest('.ip-seg button'))) { V.th = b.dataset.th; save(); sync(); return; }
  if (t.closest('#ip-open')) { V.open = !V.open; draw(); return; }
  if ((b = t.closest('[data-pk]'))) { if (b.dataset.pk === 'x') { V.open = false; draw(); } else copy(pkText()); return; }
  if ((b = t.closest('.ip-replay'))) { var vis = b.closest('.ip-vis'); play(vis, find(vis.closest('.ip-idea').dataset.k)); return; }
  if ((b = t.closest('.ip-opt'))) { var k = b.dataset.k, v = b.dataset.v; if (V.v[k] === v) delete V.v[k]; else V.v[k] = v; save(); sync(); draw(); }
});
D.addEventListener('input', function (ev) { if (ev.target.id === 'ip-note') { V.note = ev.target.value; save(); var p = $('#ip-picks pre'); if (p) p.textContent = pkText(); } });
D.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && V.open) { V.open = false; draw(); } });
sync();
</script>

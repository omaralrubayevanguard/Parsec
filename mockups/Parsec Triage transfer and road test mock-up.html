<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec Triage transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{all:unset;cursor:pointer;height:26px;line-height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)} .chips button[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Parsec · Triage — transfer, road test and truck checks (mock-up) */
.wrap{max-width:1440px;margin:0 auto;padding:16px 20px 110px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.mu{font-size:12px;color:var(--ink3)}
/* the Triage frame */
.tf{position:relative;border-radius:18px;background:var(--panel);box-shadow:var(--raise);overflow:hidden;min-width:0;display:flex;flex-direction:column;min-height:760px}
.th{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px;box-shadow:inset 0 -1px 0 var(--hair);flex:none}
.th h1{margin:0;font:500 22px/28px var(--serif);letter-spacing:-.01em}
.th .fx{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0}
.th .fx b{color:var(--ink2);font-weight:600} .th .fx i{font-style:normal;color:var(--ink4)}
.th .tabs{margin-left:auto;display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.th .tabs span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;font-size:12px;color:var(--ink3)} .th .tabs span.on{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
.th .tabs .ic{width:13px;height:13px}
.tb{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:0}
/* Needs action */
.na{box-shadow:inset -1px 0 0 var(--hair);padding:10px 8px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.na-h{display:flex;align-items:baseline;gap:6px;padding:4px 10px 8px;font:500 16px/22px var(--serif)} .na-h small{font:500 12px/1 var(--sans);color:var(--ink3)}
.ngh{display:flex;align-items:center;gap:6px;padding:10px 10px 4px;font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.ngh .n{font-weight:500;color:var(--ink4)} .ngh.new::after{content:"NEW";margin-left:4px;font:700 8.5px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;font-size:12.5px;width:100%}
.it:hover{background:var(--fill)} .it.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--acc)}
.it img{width:54px;height:30px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.14))}
.it .t{min-width:0} .it .t b{display:block;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .it .t b em{font:600 11.5px/1 var(--mono);font-style:normal;color:var(--ink3);margin-right:6px}
.it .t small{display:block;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.it .go{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);color:var(--ink);white-space:nowrap}
.it .go.pri{background:var(--primary);color:var(--onprimary);box-shadow:none}
.cd{font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px;background:var(--fill);color:var(--ink2);white-space:nowrap} .cd.w{background:var(--warn-t);color:var(--warn)} .cd.b{background:var(--bad-t);color:var(--bad)}
/* the selected RO */
.pn{position:relative;min-width:0;display:flex;flex-direction:column}
.ph2{padding:16px 22px 14px;box-shadow:inset 0 -1px 0 var(--hair);display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 16px;align-items:start}
.ph2 .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)} .ph2 .r1 .no{font:600 12.5px/1 var(--mono);color:var(--ink2)}
.ph2 h2{margin:2px 0 0;font:500 24px/30px var(--serif);letter-spacing:-.01em}
.ph2 .r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}
.ph2 .trk{grid-row:1 / span 3;grid-column:2;width:170px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16));align-self:center}
.ph2 .acts{grid-column:1 / span 2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--fill);color:var(--ink2);white-space:nowrap}
.chip.g{background:var(--good-t);color:var(--good)} .chip.w{background:var(--warn-t);color:var(--warn)} .chip.b{background:var(--bad-t);color:var(--bad)} .chip.a{background:var(--acct);color:var(--acctx)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor} .chip .ic{width:12px;height:12px}
.btn.hl{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.btn.new{position:relative} .btn.new::after{content:"NEW";position:absolute;top:-7px;right:-6px;font:700 8px/1 var(--sans);letter-spacing:.06em;padding:2px 4px;border-radius:4px;background:var(--acc);color:var(--onprimary)}
.pb{padding:16px 22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border-radius:14px;background:var(--raised);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.card > .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.card > .h .ic{width:14px;height:14px} .card > .h .sp{flex:1} .card.new > .h::after{content:"NEW";font:700 8.5px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.who{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sel);color:var(--ink2);font:600 10.5px/1 var(--sans);flex:none}
.av.sm{width:22px;height:22px;font-size:9px}
.who b{font-weight:500} .who small{display:block;font-size:12px;color:var(--ink3)}
.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden} .bar i{display:block;height:100%;border-radius:3px;background:var(--good)} .bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}
.ck{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:28px;font-size:13px;color:var(--ink2)}
.ck .ic{width:15px;height:15px} .ck.ok .ic{color:var(--good)} .ck.no{color:var(--ink)} .ck.no .ic{color:var(--warn)}
.ck small{font-size:11.5px;color:var(--ink3)}
.tick{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:30px;padding:0 4px;border-radius:8px;font-size:13px;color:var(--ink2)}
.tick:hover{background:var(--fill)} .tick i{width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--border);display:grid;place-items:center}
.tick.on{color:var(--ink)} .tick.on i{background:var(--acc);box-shadow:none;color:var(--onprimary)} .tick i .ic{width:11px;height:11px}
.tick .x{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;color:var(--ink3)} .tick .x:hover{background:var(--bad-t);color:var(--bad)}
.addl{display:flex;gap:6px} .addl input{flex:1;min-width:0;height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--fill);font:400 13px/1 var(--sans);color:var(--ink);outline:none}
.sec-l{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em;margin-top:4px}
/* pop-overs, sheet, the dropdown row */
.pop{position:absolute;z-index:30;width:430px;max-width:calc(100% - 24px);border-radius:16px;background:var(--raised);box-shadow:var(--raise);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pop .ph{display:flex;align-items:center;gap:8px} .pop .ph b{font:500 17px/22px var(--serif)} .pop .ph small{font-size:12px;color:var(--ink3)}
.steps{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.steps button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;color:var(--ink3);white-space:nowrap}
.steps button.on{background:var(--acct);color:var(--acctx);font-weight:600} .steps button.dn{color:var(--ink)} .steps button.dn em{color:var(--good)}
.steps button em{font-style:normal;font-weight:600} .steps i{font-style:normal;color:var(--ink4)}
.steps button:disabled{cursor:default;opacity:.5}
.opts{display:flex;flex-direction:column;gap:4px}
.o{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;padding:6px 10px;border-radius:10px;font-size:13px}
.o:hover{background:var(--fill)} .o.on{background:var(--acct);box-shadow:inset 0 0 0 1px var(--accl)}
.o .ab{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--fill);font:600 10.5px/1 var(--sans);color:var(--ink2)}
.o b{display:block;font-weight:500;color:var(--ink)} .o small{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.o .r{font-size:11.5px;color:var(--ink3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink4);display:inline-block} .dot.dot-g{background:var(--good)} .dot.dot-w{background:var(--warn)} .dot.dot-o{background:var(--ink4)}
.cs{display:flex;flex-wrap:wrap;gap:6px}
.c{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;background:var(--fill);font-size:12.5px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair);white-space:nowrap}
.c:hover{color:var(--ink)} .c.on{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc);font-weight:500} .c small{color:var(--ink3);font-weight:400}
.c.bad.on{background:var(--bad-t);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)} .c.good.on{background:var(--good-t);color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.inp{height:32px;padding:0 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1 var(--sans);color:var(--ink);outline:none;min-width:0;box-shadow:inset 0 0 0 1px var(--hair)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--acc)} .inp.w{width:100%}
.lbl{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.goal{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)} .goal .ic{width:13px;height:13px}
.pf{display:flex;align-items:center;gap:8px;margin-top:2px} .pf .sp{flex:1}
.btn[disabled]{opacity:.45;cursor:default}
.sheet{position:absolute;z-index:30;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;box-shadow:inset 0 -1px 0 var(--hair)} .sheet .sh b{font:500 18px/24px var(--serif)}
.sheet .sb{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px 16px;box-shadow:inset 0 1px 0 var(--hair);display:flex;align-items:center;gap:8px}
.sheet .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acct);color:var(--acctx);font:600 11px/1 var(--sans);margin-right:6px}
.drow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;padding:12px 22px;box-shadow:inset 0 -1px 0 var(--hair);background:var(--canvas)}
.dd{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.dd > button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:9px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font-size:13px;color:var(--ink);min-width:0}
.dd > button span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dd > button.ph0 span{color:var(--ink3)} .dd > button:disabled{opacity:.45;cursor:default}
.dd > button .ic{width:12px;height:12px;color:var(--ink3)}
.menu{position:absolute;z-index:31;top:calc(100% + 4px);left:0;width:280px;max-height:340px;overflow:auto;border-radius:12px;background:var(--raised);box-shadow:var(--raise);padding:6px;display:flex;flex-direction:column;gap:2px}
.dd:nth-child(4) .menu{left:auto;right:0}
.menu .o{min-height:36px}
.done-b{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--good-t);color:var(--good);font-size:12.5px;font-weight:500}
.done-b.w{background:var(--warn-t);color:var(--warn)} .done-b.b{background:var(--bad-t);color:var(--bad)}
.done-b button{all:unset;cursor:pointer;margin-left:auto;font-weight:600;text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:flex;flex-direction:column;gap:4px}
/* choices */
.chs{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 76px);overflow:auto;padding-bottom:6px}
.ch{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ch > b{font-size:13.5px;font-weight:600} .ch > small{font-size:12px;line-height:17px;color:var(--ink3);margin-top:-3px}
.ch .hd{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acctx);text-transform:uppercase;margin:4px 2px -2px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:17px;color:var(--ink2)}
.opt:hover{background:var(--fill)} .opt i{width:14px;height:14px;margin-top:1.5px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)} .opt b{display:block;font-weight:500;color:var(--ink)}
.opt.sq i{border-radius:4px}
.opt[aria-pressed="true"]{background:var(--acct)} .opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)} .opt.sq[aria-pressed="true"] i{box-shadow:none;background:var(--acc)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.opt em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--acctx);margin-left:4px}
.fl{display:flex;flex-direction:column;gap:4px}
.mk .seg button:disabled{opacity:.4}
@media (max-width:1180px){.two{grid-template-columns:1fr}.chs{position:static;max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.wrap{padding:12px 12px 100px}.tb{grid-template-columns:1fr}.na{box-shadow:inset 0 -1px 0 var(--hair)}.na .it:not(.on){display:none}.na .ngh{display:none}.na .na-h{display:none}
  .th{height:auto;flex-wrap:wrap;padding:12px 14px}.th .fx{display:none}.th .tabs{margin-left:0}
  .ph2{grid-template-columns:1fr;padding:14px}.ph2 .trk{grid-row:auto;grid-column:auto;width:150px;justify-self:end;margin-top:-6px}.ph2 .acts{grid-column:auto}
  .pb{padding:12px 14px 20px}.pop{position:relative;top:auto !important;right:auto !important;left:auto;width:auto;max-width:none;margin:12px 14px 0}.sheet{width:100%}.tf{min-height:0}.tb{grid-template-rows:auto auto}
  .drow{grid-template-columns:1fr 1fr;padding:12px 14px}.menu{width:min(280px,calc(100vw - 48px))}.dd:nth-child(2n) .menu{left:auto;right:0}
  .chs{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}#picks{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:72vh}.mk{gap:8px}}
</style></head>

  if((b = t.closest('[data-xw]'))){ X.who = b.getAttribute('data-xw'); X.menu = null; if(V.P.xPres === 'steps') X.step = 2; draw(); return; }
  if((b = t.closest('[data-xy]'))){ X.why = b.getAttribute('data-xy'); X.menu = null; if(V.P.xPres === 'steps') X.step = 3; draw(); return; }
  if((b = t.closest('[data-xb]'))){ X.back = b.getAttribute('data-xb'); if(X.back !== 'pick') X.menu = null; draw(); return; }
  if((b = t.closest('[data-xs]'))){ X.step = +b.getAttribute('data-xs'); draw(); return; }
  if((b = t.closest('[data-xm]'))){ var mi = +b.getAttribute('data-xm'); X.menu = X.menu === mi ? null : mi; draw(); return; }
  if((b = t.closest('[data-x]'))){ var x = b.getAttribute('data-x');
    if(x === 'xopen'){ V.flow = 'xfer'; if(!X.open || V.sent){ var s0 = V.sent; xNew(); if(s0 && s0.id === V.sel) V.sent = null; } X = V.X; X.open = true; draw(); return; }
    if(x === 'xclose'){ X.open = false; draw(); return; }
    if(x === 'xgo'){ if(!xReady()) return; var bk = BACK.filter(function(z){ return z[0] === X.back; })[0], g = DBY[X.dept][4], gk = g === 1 ? '1h' : g === 2 ? '2h' : g === 4 ? '4h' : 'eod', bb = X.back === 'goal' ? BACK.filter(function(z){ return z[0] === gk; })[0] : bk;
      var backT = X.back === 'none' ? '' : X.back === 'pick' ? (X.time || '15:30') : bb[1] + ' · ' + bb[2], left = X.back === 'none' ? '' : (X.back === '1h' || gk === '1h' && X.back === 'goal') ? '1:00 left' : X.back === 'eod' ? '3:20 left' : X.back === 'tom' ? 'tomorrow 8:00' : X.back === 'pick' ? '1:50 left' : X.back === '4h' || (X.back === 'goal' && gk === '4h') ? '4:00 left' : '2:00 left';
      V.sent = { id: V.sel, dept: X.dept, who: X.who === '*' ? '' : X.who, whoF: X.who === '*' ? 'anyone in ' + DBY[X.dept][1] : X.who.split(' ')[0], why: X.why, note: X.note, back: X.back !== 'none', backT: backT.replace(/^In \d hours? · |^In 1 hour · /, ''), left: left, st: 'With ' + (X.who === '*' ? DBY[X.dept][1] : X.who.split(' ')[0]) };
      X.open = false; draw(); toast('RO ' + RO[V.sel].no + ' sent to ' + V.sent.whoF + (V.sent.back ? ' — back by ' + V.sent.backT : '') + '.'); return; }
    if(x === 'undo'){ V.sent = null; xNew(); draw(); toast('Transfer undone — it’s back with you.'); return; }
    /* road test */
    if(x === 'ropen' || x === 'rfocus'){ V.flow = 'road'; if(V.sel !== 'b' && V.sel !== 'g') V.sel = 'b'; R.open = true; draw(); return; }
    if(x === 'rgo'){ R.done = { m: 'send', who: R.who.split(' ')[0], when: R.when === 'now' ? 'now' : R.when === '1h' ? 'at 2:40 pm' : 'before 4:30 pm' }; R.open = false; draw(); toast(R.who.split(' ')[0] + ' is set to drive ' + R.done.when + ' — it’s in their Inbox.'); return; }
    if(x === 'rlog'){ R.done = { m: 'log', res: R.res, mi: R.mi, ck: Object.keys(R.ck).filter(function(k3){ return R.ck[k3]; }).join(', '), fw: R.fw }; draw(); toast(R.res === 'Pass' ? 'Road test logged — passed.' : 'Road test failed — back to ' + (V.P.rFail === 'tech' ? 'Mike' : 'Frank') + '.'); return; }
    if(x === 'rundo'){ R.done = null; R.open = true; draw(); return; }
    /* truck checks */
    if(x === 'qopen'){ V.flow = 'qc'; V.sel = V.sel === 'e' ? 'e' : 'c'; draw(); return; }
    if(x === 'qedit'){ Q.edit = !Q.edit; draw(); return; }
    if(x === 'qadd'){ var nv = Q.add.trim(); if(nv){ Q.walk.push(nv); Q.add = ''; } draw(); if(V.picks) pkDraw(); return; }
    if(x === 'qrel'){ Q.released = true; draw(); toast('RO ' + RO[V.sel].no + ' released.'); return; }
    if(x === 'qundo'){ Q.released = false; draw(); return; }
    return; }
  if((b = t.closest('[data-rm]'))){ R.m = b.getAttribute('data-rm'); R.open = true; draw(); return; }
  if((b = t.closest('[data-rw]'))){ R.who = b.getAttribute('data-rw'); draw(); return; }
  if((b = t.closest('[data-rt]'))){ R.when = b.getAttribute('data-rt'); draw(); return; }
  if((b = t.closest('[data-rr]'))){ R.res = b.getAttribute('data-rr'); draw(); return; }
  if((b = t.closest('[data-rc]'))){ var cc = b.getAttribute('data-rc'); R.ck[cc] = !R.ck[cc]; draw(); return; }
  if((b = t.closest('[data-rf]'))){ R.fw = b.getAttribute('data-rf'); draw(); return; }
  if((b = t.closest('[data-qx]'))){ e.stopPropagation(); var qi = +b.getAttribute('data-qx'), gone = Q.walk.splice(qi, 1)[0]; delete Q.ticks[gone]; draw(); if(V.picks) pkDraw(); return; }
  if((b = t.closest('[data-qt]'))){ if(Q.edit) return; var w = b.getAttribute('data-qt'); Q.ticks[w] = !Q.ticks[w]; draw(); return; }
});
D.addEventListener('input', function(e){ var t = e.target;
  if(t.id === 'pk-note'){ V.note = t.value; var p = $('#picks pre'); if(p) p.textContent = pkText(); return; }
  if(t.hasAttribute('data-xn')) V.X.note = t.value;
  if(t.hasAttribute('data-xt')) V.X.time = t.value;
  if(t.hasAttribute('data-ri')) V.R[t.getAttribute('data-ri')] = t.value;
  if(t.hasAttribute('data-qa')) V.Q.add = t.value;
  if(t.hasAttribute('data-qw')){ V.Q.why = t.value; var rb = D.querySelector('[data-x="qrel"]'); if(rb) rb.disabled = !t.value.trim() && V.Q.walk.some(function(x){ return !V.Q.ticks[x]; }); }
});
D.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ if(V.picks){ V.picks = false; pkDraw(); } else if(V.X.menu != null){ V.X.menu = null; draw(); } else if(V.X.open && V.flow === 'xfer'){ V.X.open = false; draw(); } }
  if(e.key === 'Enter' && e.target.hasAttribute && e.target.hasAttribute('data-qa')){ e.preventDefault(); var nv = V.Q.add.trim(); if(nv){ V.Q.walk.push(nv); V.Q.add = ''; draw(); var i = D.querySelector('[data-qa]'); if(i) i.focus(); } } });
draw();
</script>

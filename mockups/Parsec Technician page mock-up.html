<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec Technician page</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}
/* page header */
.ph{position:sticky;top:53px;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:60px;padding:10px 24px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--hair)}
.ph h1{margin:0;font:500 24px/30px var(--serif);letter-spacing:-.01em}
.me{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair);font:600 9.5px/1 var(--sans);flex:none}
.facts{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);white-space:nowrap} .facts b{color:var(--ink);font-weight:600} .facts i{font-style:normal;color:var(--ink4)}
.tp{display:inline-flex;align-items:center;gap:4px;padding:2px;border-radius:999px;background:var(--fill);position:relative}
.tp button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;font-size:12.5px;color:var(--ink2)}
.tp button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
.find{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:9px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);color:var(--ink3);position:relative}
.find input{width:150px;border:0;outline:0;background:transparent;font:400 13px/1 var(--sans);color:var(--ink)}
.find:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
.clockp{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;white-space:nowrap;border-radius:9px;background:var(--fill);font-size:12.5px;color:var(--ink2);position:relative} .clockp i{width:7px;height:7px;border-radius:50%;background:var(--good)} .clockp b{color:var(--ink)} .clockp small{color:var(--ink3)}
.body{flex:1;min-height:0;padding:18px 24px 40px}
/* shared bits */
.stp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink2)} .stp i{width:7px;height:7px;border-radius:50%;background:var(--ink4)}
.stp.work i{background:var(--good)} .stp.work{color:var(--good)} .stp.wait i{background:var(--warn)} .stp.wait{color:var(--warn)} .stp.done i{background:var(--acc)} .stp.hold i{background:var(--ink3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink4);flex:none} .dot.work{background:var(--good)} .dot.next{background:var(--ink3)} .dot.wait{background:var(--warn)} .dot.done{background:var(--acc)}
.age{display:inline-flex;align-items:center;height:17px;padding:0 5px;margin-right:6px;border-radius:5px;background:var(--fill);color:var(--ink2);font:600 10.5px/1 var(--mono);vertical-align:1px}
.age.w{background:var(--warn-t);color:var(--warn)} .age.b{background:var(--bad-t);color:var(--bad)}
.hb{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);min-width:120px} .hb .bar{flex:1;height:5px;border-radius:3px;background:var(--hair);overflow:hidden;min-width:50px} .hb .bar i{display:block;height:100%;background:var(--ink3);border-radius:3px} .hb.over .bar i{background:var(--bad)} .hb.over .mono{color:var(--bad)}
.none{margin:6px 2px;font-size:12.5px;color:var(--ink3)}
.src{display:none;position:absolute;z-index:6;right:-4px;top:-9px;font:600 9px/1 var(--sans);font-style:normal;letter-spacing:.04em;padding:3px 6px;border-radius:5px;background:var(--primary);color:var(--onprimary);white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.show-src .src{display:block}
.ph .src{top:auto;bottom:-10px} .ls-h .src{top:6px;right:8px}
/* A · lanes */
.lanes{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.lanes > .src{top:-14px;right:0}
.ln{border-radius:14px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair);min-height:200px;transition:box-shadow .16s var(--ease),background-color .16s}
.dragging .ln{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)} .ln.over{background:var(--acct);box-shadow:inset 0 0 0 2px var(--acc)}
.ln-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-size:13px} .ln-h .n{font-size:12px;color:var(--ink3)} .ln-h small{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.ln-b{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px}
.cd{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:0 0 0 1px var(--hair),0 2px 6px -3px rgba(0,0,0,.1);cursor:pointer;outline:none;transition:box-shadow .16s var(--ease),transform .16s var(--ease)}
.cd:hover{box-shadow:0 0 0 1px var(--border),0 6px 14px -8px rgba(0,0,0,.25)}
.cd.on{box-shadow:inset 0 0 0 1.5px var(--acc)} .cd:focus-visible{outline:2px solid var(--acc);outline-offset:2px} .cd.lift{opacity:.4}
.cd-h{display:flex;gap:10px;align-items:center} .cd-pic{width:64px;height:38px;display:grid;place-items:center;flex:none} .cd-pic img{max-width:64px;max-height:38px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.cd-t{min-width:0} .cd-t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cd-t b .mono{color:var(--ink3);font-weight:500;margin-right:2px} .cd-t small{font-size:11.5px;color:var(--ink3)}
.cd-c{font-size:12.5px;color:var(--ink2);line-height:17px} .cd-c .more{font-size:11px;color:var(--ink3)}
.cd-w{font-size:11.5px;color:var(--warn)} .cd-w.ok{color:var(--good)}
.cd-f{display:flex;align-items:center;gap:8px} .cd-f .hb{min-width:0;flex:1} .dn{font-size:11px;color:var(--ink3)} .eff{font-size:12px;color:var(--good);font-weight:600}
.cd-run{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--good)} .cd-run i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
/* B · list + RO */
.split{display:grid;grid-template-columns:400px minmax(0,1fr);gap:0;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--hair);overflow:hidden;min-height:calc(100vh - 200px)}
.ls{display:flex;flex-direction:column;box-shadow:inset -1px 0 0 var(--hair);min-width:0;position:relative}
.ls-h{position:relative;display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-size:14px} .ls-h .n{font-size:12px;color:var(--ink3)}
.ls-b{flex:1;overflow:auto;padding:0 8px 10px}
.gh{margin:12px 10px 4px;font-size:12px;color:var(--ink3)} .gh span{color:var(--ink4)}
.rw{display:grid;grid-template-columns:auto 60px minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:8px 10px;border-radius:10px;cursor:pointer;outline:none;transition:background-color .16s var(--ease)}
.rw:hover{background:var(--fill)} .rw.on{background:var(--acct);box-shadow:inset 2px 0 0 var(--acc)} .rw:focus-visible{box-shadow:inset 0 0 0 1.5px var(--acc)}
.ord{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:5px;background:var(--fill);font:600 10.5px/1 var(--mono);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)}
.rw:not(:has(.ord)){grid-template-columns:60px minmax(0,1fr) auto}
.rw-pic{width:60px;height:34px;display:grid;place-items:center} .rw-pic img{max-width:58px;max-height:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.14))}
.rw-t{min-width:0} .rw-t b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .rw-t b .mono{color:var(--ink3);margin-right:2px} .rw-t small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-m{text-align:right;font-size:12px;color:var(--ink2)} .rw-m small{display:block;font-size:11px;color:var(--ink3)} .rw-m .run{color:var(--good)}
.keys{display:flex;gap:12px;flex-wrap:wrap;padding:9px 16px;box-shadow:inset 0 1px 0 var(--hair);font-size:11.5px;color:var(--ink3)}
kbd{display:inline-block;min-width:16px;padding:2px 4px;margin-right:2px;border-radius:4px;background:var(--fill);box-shadow:inset 0 -1px 0 var(--border);font:500 10.5px/1 var(--mono);color:var(--ink2);text-align:center}
.rp{min-width:0;overflow:auto}
/* the RO pane (list layout, and the drawer) */
.pn{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.pn.empty{display:grid;place-items:center;min-height:300px;color:var(--ink3)}
.band{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:end;gap:16px;padding:18px 20px 0;border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--fill));box-shadow:inset 0 0 0 1px var(--hair)}
.band-t{padding-bottom:16px;min-width:0} .eb{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink3)} .eb i{font-style:normal;color:var(--ink4)} .eb .mono{color:var(--ink2)}
.band h2{margin:4px 0 2px;font:500 26px/31px var(--serif);letter-spacing:-.015em} .sub{font-size:13px;color:var(--ink2)}
.srow{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px} .srow .k{font-size:12px;color:var(--ink3)}
.stbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border)} .stbtn:hover{background:var(--fill)} .stbtn .ic{width:12px;height:12px;color:var(--ink3)}
.band-p{position:relative;align-self:end;line-height:0} .band-p img{width:100%;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.cam{all:unset;cursor:pointer;position:absolute;right:-4px;bottom:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--border),0 2px 8px -2px rgba(0,0,0,.3)} .cam .ic{width:14px;height:14px}
.nb{all:unset;cursor:pointer;position:absolute;left:6px;bottom:10px;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--raised) 88%,transparent);box-shadow:inset 0 0 0 1px var(--border);font:500 11.5px/16px var(--sans);color:var(--ink)}
.acts{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wbox{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--warn-t);color:var(--warn);font-size:12.5px} .wbox b{font-weight:600} .wbox span{flex:1;min-width:180px;color:var(--ink2)}
.stg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px} .stg span{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink3)} .stg i{height:4px;border-radius:2px;background:var(--hair)} .stg .d i{background:var(--ink2)} .stg .n i{background:var(--acc)} .stg .n{color:var(--ink);font-weight:600}
.sec{position:relative;border-radius:14px;background:var(--raised);box-shadow:0 0 0 1px var(--hair);padding:10px 14px 12px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:13.5px} .sh span{font-size:12px;color:var(--ink3)}
.op{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 34px;align-items:center;gap:10px;padding:8px 0;box-shadow:inset 0 -1px 0 var(--hair)} .op:last-child{box-shadow:none}
.op.run{background:linear-gradient(90deg,var(--good-t),transparent 70%);margin:0 -14px;padding:8px 14px} .op.done .oc{color:var(--ink3)}
.ty{display:inline-grid;place-items:center;height:18px;border-radius:5px;font:600 10px/1 var(--sans);letter-spacing:.04em;background:var(--acct);color:var(--acctx)} .ty.t-diag{background:var(--warn-t);color:var(--warn)} .ty.t-pm{background:var(--good-t);color:var(--good)}
.oc{font-size:13px} .op .hb{min-width:0}
.ib{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--ink2)} .ib:hover{background:var(--sel);color:var(--ink)} .ib.on{background:var(--good);color:#fff}

  else if((e.ctrlKey || e.metaKey) && e.key === "z"){ e.preventDefault(); undo(); }
});
/* lanes: drag a card to another lane — Working starts the clock, Waiting asks why, Done finishes it */
D.addEventListener("dragstart", function(e){ var c = e.target.closest && e.target.closest(".cd[data-sel]"); if(!c) return; e.dataTransfer.setData("text/plain", c.getAttribute("data-sel")); e.dataTransfer.effectAllowed = "move"; setTimeout(function(){ c.classList.add("lift"); D.body.classList.add("dragging"); }, 0); });

D.addEventListener("drop", function(e){ var l = e.target.closest && e.target.closest(".ln[data-lane]"); if(!l) return; e.preventDefault(); var id = e.dataTransfer.getData("text/plain"), r = ro(id), to = l.getAttribute("data-lane"); D.body.classList.remove("dragging"); if(!r || r.lane === to) { draw(); return; }
  if(to === "work") start(id); else if(to === "done") finish(id); else if(to === "next") stop(id); else { var a = l.getBoundingClientRect(); V.sel = id; V.menu = { k: "status", id: id, at: { left: a.left + 20, top: a.top + 60, bottom: a.top + 60 } }; draw(); } });
/* the clock ticks */
setInterval(function(){ V.tick++; $$("[data-tk]").forEach(function(n){ n.textContent = clk(V.tick); }); }, 1000);

/* ---------- the mock-up's own controls, and your picks ---------- */
var PICKS = [
  ["layout", "Layout", [["lanes", "Lanes"], ["list", "List + RO"], ["today", "Today first"]]],

];
function segSync(){ $$("[data-lay]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lay") === V.layout); }); $$("[data-view]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-view") === V.viewer); }); var th = D.documentElement.getAttribute("data-th"); $$("button[data-th]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-th") === th); }); }
function pkText(){ return "Parsec · Technician page — my picks\n" + PICKS.map(function(p){ var v = V.picks[p[0]], o = p[2].filter(function(x){ return x[0] === v; })[0]; return "· " + p[1] + ": " + (o ? o[1] : "—"); }).join("\n") + (V.note.trim() ? "\n· Notes: " + V.note.trim() : ""); }
function pkDraw(){ var w = $("#picks"); if(w.hidden) return;
  w.innerHTML = '<div class="pk-h"><b>Your picks</b><button class="x" id="pk-x" aria-label="Close">' + ic("x") + "</button></div>" + PICKS.map(function(p){ return '<div class="pk-r"><span>' + p[1] + '</span><div class="seg wrap">' + p[2].map(function(o){ return '<button data-pk="' + p[0] + '" data-v="' + o[0] + '" aria-pressed="' + (V.picks[p[0]] === o[0]) + '">' + o[1] + "</button>"; }).join("") + "</div></div>"; }).join("")
    + '<textarea data-pk-note placeholder="Anything to add or change?">' + esc(V.note) + '</textarea><button class="btn pri" id="pk-copy">' + ic("copy") + "Copy — paste it in the chat</button>"; }
D.addEventListener("click", function(e){ var b = e.target.closest("[data-pk]"); if(b){ var k = b.getAttribute("data-pk"), v = b.getAttribute("data-v"); V.picks[k] = V.picks[k] === v ? null : v; if(k === "layout" && V.picks[k]){ V.layout = v; segSync(); draw(); } if(k === "done" && V.picks[k]){ V.range = v; draw(); } if(k === "who" && V.picks[k]){ V.viewer = v === "all" ? "fore" : "tech"; segSync(); draw(); } pkDraw(); return; }
  if(e.target.closest("#pk-x")){ $("#picks").hidden = true; return; }
  if(e.target.closest("#pk-copy")){ var t = pkText(); try{ navigator.clipboard.writeText(t).then(function(){ toast("Copied — paste it in the chat."); }, function(){ toast(esc(t).replace(/\n/g, "<br>")); }); }catch(x){ toast(esc(t).replace(/\n/g, "<br>")); } } }, true);
window.addEventListener("resize", placeMenu);
segSync(); draw();

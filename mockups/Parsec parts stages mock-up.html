<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec parts stages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Parsec · parts stages on the Parts and Foreman pages (mock-up) */
:root,[data-th="white"]{--s-hold:#6b7280;--s-sup:#5b57c9;--s-cus:#1f7f8f;--s-acc:var(--acc);--s-good:var(--good)}
[data-th="ivory"]{--s-hold:#857F75;--s-sup:#6C69C8;--s-cus:#2F8795;--s-acc:#86643A;--s-good:#3A8C60}
[data-th="graphite"]{--s-hold:#8D897F;--s-sup:#9E9DF0;--s-cus:#58B3C0;--s-acc:#D1B184;--s-good:#5BBE8B}
[data-th="black"]{--s-hold:#8b93a1;--s-sup:#a5a0ff;--s-cus:#5cc0cf;--s-acc:#8aafff;--s-good:#7ac79c}
.wrap{max-width:1560px;margin:0 auto;padding:16px 20px 110px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:16px;align-items:start}
.chs{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 76px);overflow:auto;padding-bottom:6px}
.ch{padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.ch > b{font-size:13.5px;font-weight:600} .ch > small{font-size:12px;line-height:17px;color:var(--ink3);margin-top:-3px}
.hd{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--acctx);text-transform:uppercase;margin:6px 4px -4px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:9px;font-size:12.5px;line-height:17px;color:var(--ink2)}
.opt:hover{background:var(--fill)} .opt i{width:14px;height:14px;margin-top:1.5px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border)} .opt b{display:block;font-weight:500;color:var(--ink)}
.opt.sq i{border-radius:4px}
.opt[aria-pressed="true"]{background:var(--acct)} .opt[aria-pressed="true"] i{box-shadow:inset 0 0 0 4.5px var(--acc)} .opt.sq[aria-pressed="true"] i{box-shadow:none;background:var(--acc)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.opt em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--acctx);margin-left:4px}
.ol{display:flex;flex-direction:column;gap:4px}
/* the page preview */
.pv{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.pvh{grid-column:1 / -1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;box-shadow:inset 0 -1px 0 var(--hair)}
.pvh h3{margin:0;font:500 24px/30px var(--serif);letter-spacing:-.01em}
.pvh .sum{font-size:13px;color:var(--ink3)} .pvh .sum b{font-weight:500;color:var(--ink2)} .pvh .sum .w{color:var(--warn)}
.pvh .tabs{margin-left:auto}
.na{box-shadow:inset -1px 0 0 var(--hair);padding:10px 0 16px;min-width:0}
.na h4{display:flex;align-items:baseline;gap:8px;margin:10px 20px 6px;font:500 13px/18px var(--sans);color:var(--ink2)} .na h4 em{font-style:normal;color:var(--ink3)}
.na .nah{margin:2px 20px 4px;font:600 15px/22px var(--sans)} .na .nah em{font-style:normal;font-weight:400;color:var(--ink3);margin-left:6px}
.it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 16px 8px 20px;position:relative}
.it:hover{background:var(--fill)} .it.on{background:var(--sel)} .it.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.it .tk{width:52px;height:30px;display:grid;place-items:center;color:var(--ink4)} .it .tk svg{width:46px;height:26px}
.it .t{min-width:0} .it .t b{display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;overflow:hidden} .it .t b .no{font:500 12.5px/1 var(--mono);color:var(--ink2);flex:none} .it .t b .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.it .t small{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px} .it .t small.w{color:var(--warn)} .it .t small.r{color:var(--bad)}
.it .btn{height:28px;padding:0 10px;font-size:12.5px}
.ro{padding:16px 24px 24px;min-width:0;container-type:inline-size}
.eb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);min-height:32px}
.eb .no{font:500 12.5px/1 var(--mono);color:var(--ink2)} .eb .sp{flex:1}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font:700 10px/1 var(--sans);letter-spacing:.05em;background:color-mix(in srgb,var(--s-cus) 14%,transparent);color:var(--s-cus)}
.stt{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)} .stt i{width:8px;height:8px;border-radius:2px;background:var(--s-good)}
.ro h2{margin:2px 0 8px;font:500 28px/34px var(--serif);letter-spacing:-.01em}
.rtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.rtop .pic{width:150px;height:84px;color:var(--ink4)} .rtop .pic svg{width:150px;height:84px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 16px;padding-bottom:16px}
.dets small{display:block;font-size:12px;color:var(--ink3)} .dets b{display:block;font-weight:400;font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .dets b.mono{font-size:12.5px}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);padding-bottom:14px}
.frow .sp2{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;background:var(--fill);font:500 11.5px/1 var(--mono);color:var(--ink2)}
.frow .av{width:22px;height:22px;border-radius:50%;background:var(--sel);display:inline-grid;place-items:center;font:600 9.5px/1 var(--sans);color:var(--ink2);margin-right:-6px}
.frow .hrs{font:500 12.5px/1 var(--mono);color:var(--ink3)}
.frow .stt i{border-radius:50%}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;margin:14px 0 14px;border-radius:14px;background:var(--acct);box-shadow:inset 0 0 0 1px var(--accl)}
.next > em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--acctx)} .next > span{flex:1;font-size:14px;font-weight:500}
.next .btn.pri{height:30px}
.next.inn{flex-wrap:wrap} .next.inn .pst{flex-basis:100%;margin:6px 0 0;padding-top:10px;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accl) 70%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;opacity:.55}
.kpis div{padding:12px;border-radius:12px;background:var(--fill)} .kpis small{display:block;font-size:12px;color:var(--ink3)} .kpis b{display:block;font:500 20px/28px var(--serif)}
.opc{border-radius:14px;background:var(--raised);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.oph{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap} .oph .n{font:500 13px/1 var(--mono);color:var(--ink3)} .oph b{font-weight:500;flex:1;min-width:140px}
.oph .ih{font-size:12.5px;color:var(--ink3)} .oph .mb{width:90px;height:4px;border-radius:2px;background:var(--hair);overflow:hidden} .oph .mb i{display:block;height:100%;background:var(--s-good)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-weight:400;font-size:12.5px;color:var(--ink3);padding:8px 10px;box-shadow:inset 0 1px 0 var(--hair),inset 0 -1px 0 var(--hair)}
.tb td{padding:9px 10px;box-shadow:inset 0 -1px 0 var(--hair);vertical-align:middle}
.tb tr:last-child td{box-shadow:none} .tb td.r,.tb th.r{text-align:right} .tb .mono{font-size:12.5px}
.tb th:first-child,.tb td:first-child{padding-left:16px} .tb th:last-child,.tb td:last-child{padding-right:16px}
.tb td small{display:block;font-size:12px;color:var(--ink3)}
.tb tr.hl td{background:color-mix(in srgb,var(--sc) 8%,transparent)} .tb tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--sc),inset 0 -1px 0 var(--hair)}
.tb tr.hl .hold{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--sc);text-transform:uppercase}
.tb tr.gone{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:color-mix(in srgb,var(--sc) 13%,transparent);color:color-mix(in srgb,var(--sc) 80%,var(--ink))}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--sc)}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12.5px;color:var(--ink2);background:var(--fill)} .fbar button{all:unset;cursor:pointer;color:var(--acctx);font-weight:500}
.none{padding:14px 16px;font-size:13px;color:var(--ink3)}
/* the parts stage */
.pst{margin:2px 0 6px;--line:var(--hair)}
.pst-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--ink2)}
.pst-h > b{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)} .pst-h .lbl{font-weight:600;color:var(--sc)} .pst-h .sp{flex:1}
.pst-pr{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)} .pst-pr b{font-weight:600;color:var(--ink)} .pst-pr .ic{width:13px;height:13px;color:var(--ink3)} .pst-pr.r b{color:var(--bad)}
.pst-q{font-size:13px;color:var(--ink3);padding:4px 0 10px} .pst-q b{font-weight:500;color:var(--ink2)}
/* steps, like the Warranty page */
.pst-t{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.pst-t li{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pst-t li::before{content:"";position:absolute;top:7px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.pst-t li:first-child::before{display:none}
.pst-t li.d::before,.pst-t li.c::before{background:var(--ink)}
.pst-t .stp{all:unset;box-sizing:border-box;cursor:pointer;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 2px 2px;border-radius:8px;max-width:100%}
.pst-t .stp:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pst-t .dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--border);transition:transform .15s var(--ease)}
.pst-t .stp:hover .dot{transform:scale(1.12)}

  if(flt != null) h += '<div class="opc"><div class="fbar">Showing <b>' + esc(S.L[flt][1]) + '</b> · ' + S.at[flt].length + ' part' + (S.at[flt].length === 1 ? '' : 's') + '<span style="flex:1"></span><button data-clr>Show all</button></div></div>';
  ro.ops.forEach(function(o){
    var P = ro.parts.filter(function(p){ return p.op === o.n; }), ih = P.filter(function(p){ return STS.indexOf(p.st) >= 3; }).length;
    var mini = ''; if(V.xt.opmini && P.length){ var S2 = mkS(P, steps(), function(p){ return STS.indexOf(p.st); }, function(p){ return p.st; }, scv, 'part'); mini = '<span class="opmini" style="--sc:' + (S2.done ? 'var(--s-good)' : curCol(S2)) + '"><i></i>' + esc(S2.done ? 'Installed' : S2.L[S2.ci][1]) + '</span>'; }
    h += '<div class="opc"><div class="oph"><span class="n">' + o.n + '</span>' + (o.t ? '<span class="tag">' + o.t + '</span>' : '') + '<b>' + esc(o.c) + '</b>' + mini + (P.length ? '<span class="ih">' + ih + ' of ' + P.length + ' in hand</span><span class="mb"><i style="width:' + (ih / P.length * 100) + '%"></i></span>' : '') + '</div>';
    if(!P.length){ h += '<div class="none">No parts on this operation.</div></div>'; return; }
    h += '<table class="tb"><thead><tr><th>Status</th><th>Part</th><th>Part #</th><th class="r">Qty</th><th>Where</th><th class="r">Each</th></tr></thead><tbody>' + P.map(function(p){
      var hl = V.call.row && S && !S.done && S.least.indexOf(p) >= 0, gone = flt != null && stepOf(p.st, S.L) !== flt;
      return '<tr class="' + (hl ? 'hl' : '') + (gone ? ' gone' : '') + '" style="--sc:' + scv(p.st) + '"><td><span class="chip"><i></i>' + esc(sname(p.st)) + '</span>' + (hl ? '<span class="hold">holds the stage</span>' : '') + '</td><td>' + esc(p.d) + '</td><td class="mono">' + p.pn + '</td><td class="r">' + p.q + '</td><td>' + esc(p.w) + (p.w2 ? '<small>' + esc(p.w2) + '</small>' : '') + '</td><td class="r mono">$' + p.price.toFixed(2) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  });
  return '<div class="ro" data-ro="' + ro.no + '">' + h + '</div>';
}
function nextHtml(nx, tr){ if(!nx[0]) return ''; return '<div class="next' + (tr ? ' inn' : '') + '"><em>Next</em><span>' + esc(nx[0]) + '</span>' + (nx[1] ? '<button class="btn sm pri" data-go="' + esc(nx[1]) + '">' + esc(nx[1]) + '</button>' : '') + tr + '</div>'; }
function fmRo(ro){
  var f = ro.fm, Sp = partsS(ro), So = opsS(ro), where = V.where;
  var tr = (V.fm !== 'ops' ? trackHtml(ro, Sp, 'p', 'Parts') : '') + (V.fm !== 'parts' ? trackHtml(ro, So, 'o', 'Operations') : '');
  var h = '<div class="eb"><span class="no">' + ro.ron + '</span><span class="stt"><i style="background:var(' + f.stt[1] + ')"></i>' + esc(f.eyb) + '</span><span>· ' + esc(ro.ops[0].c) + '</span><span class="sp"></span><button class="btn sm">' + ic('swap') + 'Transfer…</button><button class="btn sm">Move truck</button><button class="btn sm">Open RO</button></div>';
  h += '<div class="rtop"><div><h2>' + esc(ro.cust) + '</h2><div class="acts"><button class="btn sm">' + ic('unit') + 'Road test</button><button class="btn sm">' + ic('check') + 'Truck checks</button></div></div><div class="pic">' + TRUCK + '</div></div>';
  if(where === 'top') h += tr;
  h += '<div class="frow"><span class="sp2">' + esc(f.spot) + '</span><span class="stt"><i style="background:var(' + f.stt[1] + ')"></i>' + esc(f.stt[0]) + '</span><span><span class="av">' + f.ini + '</span> ' + esc(ro.tech) + '</span><span class="hrs">' + f.hrs + '</span></div>';
  if(where === 'below') h += tr;
  h += nextHtml([f.nx, f.btn], where === 'next' ? tr : '');
  var flt = V.filter && V.filter.k === 'p' && Sp ? V.filter.i : null;
  if(flt != null) h += '<div class="opc"><div class="fbar">Parts at <b>' + esc(Sp.L[flt][1]) + '</b><span style="flex:1"></span><button data-clr>Close</button></div><table class="tb"><tbody>' + Sp.at[flt].map(function(p){ return '<tr style="--sc:' + scv(p.st) + '"><td><span class="chip"><i></i>' + esc(sname(p.st)) + '</span></td><td>' + esc(p.d) + '</td><td>' + esc(p.w) + '</td></tr>'; }).join('') + (Sp.at[flt].length ? '' : '<tr><td class="none">Nothing here.</td></tr>') + '</tbody></table></div>';
  h += '<div class="kpis"><div><small>Lined up for today</small><b>12.1 h</b></div><div><small>Clocked today</small><b>0.0 h</b></div><div><small>Flagged today</small><b>0.0 h</b></div><div><small>Bays</small><b>0 / 19</b></div></div>';
  return '<div class="ro">' + h + '</div>';
}
/* ---------- the page ---------- */
function listHtml(){
  var pg = V.page, sel = V.sel[pg], h = '<div class="nah">Needs action<em>' + (pg === 'parts' ? 7 : 7) + '</em></div>';
  if(pg === 'parts') LISTS.parts.forEach(function(g){ h += '<h4>' + g[0] + '<em>' + g[1].length + '</em></h4>' + g[1].map(function(x){ var ro = ROS[x[0]];
      return '<button class="it' + (sel === x[0] ? ' on' : '') + '" data-sel="' + x[0] + '"><span class="tk">' + ic('parts', 18) + '</span><span class="t"><b><span class="no">' + ro.no + '</span><span class="nm">' + esc(ro.cust) + '</span>' + (V.rows.parts ? rowPill(ro) : '') + '</b><small class="' + (x[3] || '') + '">' + esc(x[1]) + '</small></span>' + (x[2] ? '<span class="btn">' + esc(x[2]) + '</span>' : '<span></span>') + '</button>'; }).join(''); });
  else LISTS.fm.forEach(function(g){ h += '<h4>' + g[0] + '<em>' + g[1].length + '</em></h4>' + g[1].map(function(id){ var ro = ROS[id], f = ro.fm;
      return '<button class="it' + (sel === id ? ' on' : '') + '" data-sel="' + id + '"><span class="tk">' + TRUCK + '</span><span class="t"><b><span class="no">' + ro.no + '</span><span class="nm">' + esc(ro.cust) + '</span>' + (V.rows.fm ? rowPill(ro) : '') + '</b><small class="' + (f.g === 'clocks' ? 'w' : '') + '">' + esc(f.sub) + '</small></span><span class="btn' + (f.btn === 'Decide' || f.btn === 'Bring in' ? ' pri' : '') + '">' + esc(f.btn) + '</span></button>'; }).join(''); });
  return h;
}
function howHtml(){
  var L = steps();
  return '<div class="how"><b>How the stage is picked</b>' + STS.map(function(s, i){ return (i ? '<span class="ar">›</span>' : '') + '<span class="chip" style="--sc:' + scv(s) + '"><i></i>' + esc(sname(s)) + '</span>'; }).join('') + '<span>— the RO sits where its furthest-behind part is (Returned parts don’t count).</span></div>';
}
function draw(){
  var y = window.scrollY, pg = V.page, ro = ROS[V.sel[pg]];
  var sec = pg === 'parts' ? partsRo(ro) : fmRo(ro), prev;
  if(V.dev === 'phone') prev = '<div class="phw"><div class="phone"><div class="scr"><div class="pbar"><b>' + (pg === 'parts' ? 'Parts' : 'Foreman') + '</b><span>· tap an RO</span></div><div class="rsel">' + Object.keys(ROS).map(function(id){ return '<button data-sel="' + id + '" aria-pressed="' + (V.sel[pg] === id) + '">' + ROS[id].no + '</button>'; }).join('') + '</div>' + sec + '</div></div>'
    + '<div class="phnote">At phone width the steps keep their dots and labels; only the current stage keeps its line under it.</div></div>';
  else prev = '<div class="pv"><div class="pvh"><h3>' + (pg === 'parts' ? 'Parts' : 'Foreman') + '</h3><span class="sum">' + (pg === 'parts' ? '<b>1</b> to order · <span class="w">1 late</span>' : '<b>0/19</b> bays · 1 waiting on you · <span class="w">1 late</span>') + '</span><div class="seg tabs">'
    + (pg === 'parts' ? ['Desk', 'On order', 'Shelf', 'Returns', 'Catalog'] : ['Floor', 'Techs', 'Yard', 'Tomorrow']).map(function(t, i){ return '<button aria-pressed="' + (i === 0) + '">' + t + '</button>'; }).join('') + '</div></div><div class="na">' + listHtml() + '</div>' + sec + '</div>';
  $('#pg').innerHTML = '<div class="wrap"><div class="two"><div>' + prev + howHtml() + '</div>' + chsHtml() + '</div></div>';
  window.scrollTo(0, y); sync(); pkDraw();
}
function sync(){
  $$('.mk button[data-th]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-th') === V.th)); });
  $$('.mk button[data-page]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-page') === V.page)); });
  $$('.mk button[data-dev]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-dev') === V.dev)); });
  D.documentElement.setAttribute('data-th', V.th);
}
function chsHtml(){
  return '<div class="chs">' + CH.map(function(c){ var k = c[1], multi = c[5];
    return (c[0] ? '<div class="hd">' + c[0] + '</div>' : '') + '<div class="ch"><b>' + c[2] + '</b>' + (c[3] ? '<small>' + c[3] + '</small>' : '') + '<div class="ol">' + c[4].map(function(o){ var on = multi ? !!V[k][o[0]] : V[k] === o[0];
      return '<button class="opt' + (multi ? ' sq' : '') + '" data-ch="' + k + '" data-v="' + o[0] + '" aria-pressed="' + on + '"><i></i><span><b>' + o[1] + (o[4] ? '<em>SUGGESTED</em>' : '') + '</b>' + (o[2] || '') + '</span></button>'; }).join('') + '</div></div>'; }).join('') + '</div>';
}
function pkText(){
  var L = ['Parsec · Parts stages on the Parts and Foreman pages — my picks'];
  CH.forEach(function(c){ var k = c[1], lab = c[2], vals;
    if(c[5]) vals = c[4].filter(function(o){ return V[k][o[0]]; }).map(function(o){ return o[1]; }).join(', ') || 'none';
    else vals = c[4].filter(function(o){ return o[0] === V[k]; })[0][1];
    L.push('· ' + (c[0] === 'FOREMAN' || k === 'rows' ? lab : lab) + ': ' + vals); });
  if(V.note.trim()) L.push('· Notes: ' + V.note.trim());
  return L.join('\n');
}
function pkDraw(){ var w = $('#picks'); w.hidden = !V.picks; if(!V.picks) return;
  var ta = $('#pk-note'), keep = ta && D.activeElement === ta;
  if(keep){ var pre = $('#picks pre'); if(pre) pre.textContent = pkText(); return; }
  w.innerHTML = '<div class="pk-h"><b>Your picks</b><button class="x" data-pk="x" aria-label="Close">' + ic('x', 15) + '</button></div><pre>' + esc(pkText()) + '</pre><div class="pk-r"><span>Anything else</span><textarea id="pk-note" placeholder="e.g. hide Staged on the Foreman page">' + esc(V.note) + '</textarea></div><button class="btn pri" data-pk="copy">' + ic('copy') + 'Copy for the chat</button>'; }
function toast(m){ var t = $('.toast'); if(t) t.remove(); t = D.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; D.body.appendChild(t); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.remove(); }, 2600); }
D.addEventListener('click', function(e){
  var t = e.target, b;
  if((b = t.closest('.mk button[data-th]'))){ V.th = b.getAttribute('data-th'); sync(); return; }
  if((b = t.closest('.mk button[data-page]'))){ V.page = b.getAttribute('data-page'); V.filter = null; draw(); return; }
  if((b = t.closest('.mk button[data-dev]'))){ V.dev = b.getAttribute('data-dev'); draw(); return; }
  if((b = t.closest('[data-sel]'))){ V.sel[V.page] = b.getAttribute('data-sel'); V.filter = null; draw(); return; }
  if((b = t.closest('[data-step]'))){ if(!V.call.filter){ toast('Turn on “Click a stage to show only its parts” to filter.'); return; } var k = b.getAttribute('data-tk'), i = +b.getAttribute('data-step');
    if(k !== 'p'){ toast('Operations: the Foreman page opens that operation.'); return; }
    V.filter = V.filter && V.filter.k === k && V.filter.i === i ? null : { k: k, i: i }; draw(); return; }
  if(t.closest('[data-clr]')){ V.filter = null; draw(); return; }
  if((b = t.closest('[data-go]'))){ toast(b.getAttribute('data-go') + ' — in the app this opens the same pop-over as today.'); return; }
  if((b = t.closest('[data-ch]'))){ var k2 = b.getAttribute('data-ch'), v = b.getAttribute('data-v'), c = CH.filter(function(x){ return x[1] === k2; })[0];
    if(c[5]) V[k2][v] = V[k2][v] ? 0 : 1; else V[k2] = v;
    if(k2 === 'list' || k2 === 'bo') V.filter = null; draw(); return; }
  if((b = t.closest('[data-pk]'))){ var a = b.getAttribute('data-pk'); if(a === 'x'){ V.picks = false; pkDraw(); }
    if(a === 'copy'){ var tx = pkText(); (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(function(){ toast('Copied — paste it in the chat.'); }, function(){ var ta = D.createElement('textarea'); ta.value = tx; D.body.appendChild(ta); ta.select(); try{ D.execCommand('copy'); toast('Copied — paste it in the chat.'); }catch(er){} ta.remove(); }); }
    return; }
  if(t.closest('#pk-open')){ V.picks = !V.picks; pkDraw(); return; }
});
D.addEventListener('input', function(e){ if(e.target.id === 'pk-note'){ V.note = e.target.value; var pre = $('#picks pre'); if(pre) pre.textContent = pkText(); } });
D.addEventListener('keydown', function(e){ if(e.key !== 'Escape') return; if(V.picks){ V.picks = false; pkDraw(); } else if(V.filter){ V.filter = null; draw(); } });
draw();
</script>

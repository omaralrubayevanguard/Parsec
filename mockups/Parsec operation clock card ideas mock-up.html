<!doctype html>
<html lang="en" data-th="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parsec operation clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>:root,[data-th="white"]{--canvas:#f5f6f8;--panel:#fff;--raised:#fff;--fill:#f0f2f5;--sel:#e7ecf4;--hair:#e5e8ed;--border:#cdd3dc;--ink:#171c24;--ink2:#4d5766;--ink3:#667182;--ink4:#86909e;--acc:#245cdb;--acct:#edf3ff;--accl:#a9c1f5;--acctx:#234fb1;--primary:#171c24;--onprimary:#fff;--good:#23764a;--good-t:#eaf5ee;--warn:#94610c;--warn-t:#faf1df;--bad:#b94238;--bad-t:#fbedeb;--shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,40,.04);--raise:0 0 0 1px var(--border),0 18px 44px -14px rgba(16,24,40,.28);color-scheme:light;--stage:linear-gradient(180deg,#fff,#f0f2f5)}
[data-th="black"]{--canvas:#0b0d10;--panel:#111418;--raised:#191d23;--fill:#20252c;--sel:#293242;--hair:#252b34;--border:#3c4553;--ink:#edf1f7;--ink2:#bbc4d1;--ink3:#95a1b2;--ink4:#717e90;--acc:#8aafff;--acct:#1c2a44;--accl:#425f94;--acctx:#a9c4ff;--primary:#edf1f7;--onprimary:#111418;--good:#7ac79c;--good-t:#172d24;--warn:#e4b564;--warn-t:#30271a;--bad:#f38c80;--bad-t:#351e22;--shadow:0 0 0 1px var(--hair);--raise:0 0 0 1px var(--border),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#151a20,#0e1115)}
[data-th="ivory"]{--canvas:#F2F0EA;--panel:#FBFAF7;--raised:#fff;--fill:#F0EDE6;--sel:#E8E4DA;--hair:#E6E2D8;--border:#D6D0C3;--ink:#1D1C1A;--ink2:#57534B;--ink3:#67625A;--ink4:#A8A398;--acc:#86643A;--acct:#F4EDE1;--accl:#D9C5A3;--acctx:#7A5A32;--primary:#1D1C1A;--onprimary:#FBFAF7;--good:#3A8C60;--good-t:#E7F1EA;--warn:#AD7210;--warn-t:#F8EEDC;--bad:#C0503F;--bad-t:#F8E9E5;--shadow:0 0 0 1px rgba(29,28,26,.06),0 1px 3px rgba(29,28,26,.04);--raise:0 0 0 1px rgba(29,28,26,.08),0 18px 44px -14px rgba(29,28,26,.28);color-scheme:light;--stage:linear-gradient(180deg,#FBFAF7,#F0EDE6)}
[data-th="graphite"]{--canvas:#0E0E0D;--panel:#151514;--raised:#1D1D1B;--fill:#222220;--sel:#2A2A27;--hair:#262624;--border:#363532;--ink:#EDEBE6;--ink2:#B0ACA3;--ink3:#9A968D;--ink4:#5E5B55;--acc:#D1B184;--acct:#2A241B;--accl:#6B5A40;--acctx:#D6B88D;--primary:#EDEBE6;--onprimary:#151514;--good:#5BBE8B;--good-t:#16261E;--warn:#E2A84C;--warn-t:#2A2114;--bad:#EC7F6C;--bad-t:#2D1916;--shadow:0 0 0 1px rgba(255,255,255,.06);--raise:0 0 0 1px rgba(255,255,255,.08),0 20px 50px -14px rgba(0,0,0,.7);color-scheme:dark;--stage:linear-gradient(180deg,#1a1a18,#121211)}
:root{--sans:"Geist","Inter","Segoe UI",system-ui,sans-serif;--serif:"Newsreader","Iowan Old Style",Georgia,serif;--mono:"Geist Mono","Cascadia Mono",Consolas,monospace;--ease:cubic-bezier(.2,.75,.25,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp{flex:1}
/* the mock-up's own bar */
.mk{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:var(--canvas);box-shadow:inset 0 -1px 0 var(--hair)}
.mk h1{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;font:500 19px/24px var(--serif);letter-spacing:-.01em}
.mk h1 svg{width:20px;height:20px} .mk h1 svg circle{fill:var(--ink)} .mk h1 svg .o{fill:var(--ink3)} .mk h1 svg .c{fill:#22c55e}
.mk h1 small{font:500 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.mk .lb{font-size:11.5px;color:var(--ink3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hair)}
.seg.wrap{flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font:500 12.5px/16px var(--sans);color:var(--ink3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.tg i{position:relative;width:30px;height:18px;border-radius:9px;background:var(--border);transition:background .16s}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .16s var(--ease)}
.tg[aria-pressed="true"] i{background:var(--acc)} .tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--sans);color:var(--ink);white-space:nowrap;transition:background-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover{background:var(--fill)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--primary);color:var(--onprimary);box-shadow:none} .btn.pri:hover{filter:brightness(1.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px} .btn.gh{background:transparent;box-shadow:none;color:var(--ink2)} .btn.gh:hover{background:var(--fill)}
.btn .ic{width:14px;height:14px}
/* the app frame: rail + page */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
.rail{position:sticky;top:53px;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:2px;padding:14px 10px;box-shadow:inset -1px 0 0 var(--hair);overflow:auto}
.rl-b{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;font:500 18px/1 var(--serif)} .rl-b svg{width:18px;height:18px} .rl-b svg circle{fill:var(--ink)} .rl-b svg .o{fill:var(--ink3)} .rl-b svg .c{fill:#22c55e}
.ri{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:13.5px;color:var(--ink2);position:relative}
.ri .ic{width:16px;height:16px} .ri em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink3)}
.ri.on{background:var(--sel);color:var(--ink);font-weight:500}
.ri.new::after{content:"NEW";position:absolute;right:8px;font:600 9px/1 var(--sans);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--acct);color:var(--acctx)}
.rclk{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 6px;border-radius:9px;font-size:13px} .rclk i{width:8px;height:8px;border-radius:50%;background:var(--good)} .rclk small{display:block;font-size:11.5px;color:var(--ink3)}
.rh{margin:10px 10px 4px;font-size:11.5px;color:var(--ink3)}
.rsep{height:1px;margin:6px 10px;background:var(--hair)}
.pg{min-width:0;display:flex;flex-direction:column}

#picks{position:fixed;z-index:85;right:16px;top:62px;width:420px;max-height:calc(100vh - 80px);overflow:auto;padding:12px 14px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
#picks[hidden]{display:none} .pk-h{display:flex;align-items:center;font:500 18px/1 var(--serif)}
.x{all:unset;cursor:pointer;margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)} .x:hover{background:var(--fill)}
.pk-r{display:flex;flex-direction:column;gap:6px} .pk-r > span{font-size:12px;font-weight:600;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips button{all:unset;cursor:pointer;height:26px;line-height:26px;padding:0 10px;border-radius:999px;background:var(--fill);font-size:12.5px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)} .chips button[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--acc)}
#picks pre{margin:0;padding:10px 12px;border-radius:10px;background:var(--fill);font:400 12px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap}
#picks textarea{min-height:60px;padding:8px 10px;border:0;border-radius:9px;background:var(--fill);font:400 13px/1.4 var(--sans);color:var(--ink);outline:none;resize:vertical}
.toast{position:fixed;left:50%;bottom:118px;z-index:90;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--canvas);font-size:13px;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);transform:translateX(-50%);animation:tin .18s var(--ease)}
.toast button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;font-weight:600;background:color-mix(in srgb,var(--canvas) 16%,transparent)}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* Parsec · the operation clock card — 10 ideas with live micro animations (mock-up) */
:root{--r-diag:#3D6FD9;--r-rep:#3A8C60;--r-insp:#6C69C8;--r-wparts:#AD7210;--r-done:#23764A;--over:#C0503F;--over-t:#F8E9E5}
[data-th="graphite"],[data-th="black"]{--r-diag:#7FA2F5;--r-rep:#5BBE8B;--r-insp:#9E9DF0;--r-wparts:#E2A84C;--r-done:#4FB582;--over:#EC7F6C;--over-t:#2D1916}
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 110px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.yc{padding:16px 18px;border-radius:18px;background:var(--panel);box-shadow:var(--raise);display:flex;flex-direction:column;gap:10px}
.yc h2{margin:0;font:500 20px/1 var(--serif)} .yc .sub{font-size:12.5px;color:var(--ink3)}
.yc .now{font-size:12px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px}
.yc .now span{padding:2px 8px;border-radius:999px;background:var(--acct);color:var(--acctx);font-weight:500}
.ids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.idc{padding:14px 16px 16px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s var(--ease)}
.idc.on{box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.idh{display:flex;align-items:flex-start;gap:10px}
.idh .n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--fill);display:grid;place-items:center;font:600 11.5px/1 var(--sans);color:var(--ink2)}
.idh b{display:block;font-size:14px;font-weight:600} .idh small{display:block;font-size:12.5px;line-height:17px;color:var(--ink3);margin-top:2px}
.idh .use{margin-left:auto;flex:none}
.use{all:unset;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font:500 12.5px/1 var(--sans);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--border);background:var(--raised)}
.use .bx{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--border);display:grid;place-items:center}
.use[aria-pressed="true"]{background:var(--acct);color:var(--acctx);box-shadow:inset 0 0 0 1px var(--accl)} .use[aria-pressed="true"] .bx{background:var(--acc);box-shadow:none}
.use[aria-pressed="true"] .bx::after{content:"";width:7px;height:4px;border:solid #fff;border-width:0 0 1.6px 1.6px;transform:translateY(-1px) rotate(-45deg)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink3)}
.ctl .seg button{padding:3px 8px;font-size:12px}
/* the clock card */
.cc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:16px 18px 14px;border-radius:14px;background:var(--raised);box-shadow:var(--shadow);transition:box-shadow .4s var(--ease),background-color .4s var(--ease)}
.cc .tm{display:flex;align-items:baseline;gap:8px;min-width:0}
.cc .big{font:500 32px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);cursor:default;display:inline-flex}
.cc .big.tap{cursor:pointer}
.cc .lbl{font-size:12px;color:var(--ink3)} .cc .lbl b{font-weight:600;color:var(--ink2)}
.cc .side{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:8px}
.cc .bar{grid-column:1 / -1;position:relative;height:6px;margin:8px 0 2px;border-radius:3px;background:var(--hair);overflow:visible}
.cc .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2);transition:width .5s linear}
.cc .bar .segs{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:2px;border-radius:3px}
.cc .bar .segs i{height:100%;background:var(--c);flex:none;border-radius:2px;transition:width .5s linear}
.cc .bar .segs i.live{position:relative}
.cc.run .bar .segs i.live::after{content:"";position:absolute;right:-3px;top:-3px;width:6px;height:12px;border-radius:3px;background:var(--c);box-shadow:0 0 0 0 var(--c);animation:edge 1.6s ease-out infinite}
@keyframes edge{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 6px transparent}}
.cc .bar .qt{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink)}
.cc .bar .ov{position:absolute;top:0;bottom:0;border-radius:0 3px 3px 0;background:repeating-linear-gradient(-45deg,var(--over) 0 5px,color-mix(in srgb,var(--over) 55%,transparent) 5px 10px);background-size:14px 14px;transition:width .5s linear}
.cc.run .bar .ov{animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:14px 0}}
.cc .bar .gh{position:absolute;top:0;bottom:0;border-radius:3px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink3) 30%,transparent) 0 4px,transparent 4px 7px);transition:left .5s linear,width .5s linear}
.cc .bar .ms{position:absolute;top:-3px;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--ink4)}
.cc .bar .ms.hit{box-shadow:inset 0 0 0 1.5px var(--good);background:var(--good)}
.cc .bar .ms.pop{animation:mspop .9s var(--ease)}
@keyframes mspop{0%{transform:scale(1)}30%{transform:scale(1.9,1.5)}100%{transform:scale(1)}}
.cc .kv{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cc .kv small{display:block;font-size:12px;color:var(--ink3);margin-bottom:3px} .cc .kv b{font:500 17px/1 var(--sans);font-variant-numeric:tabular-nums} .cc .kv b em{font-style:normal;font-size:12px;color:var(--ink3);margin-left:2px}
.cc .kv .g{color:var(--good)} .cc .kv .r{color:var(--over)}
.cc .extra{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-height:0}
.cc .extra:empty{display:none}
/* the start / stop button, with or without its ring */
.pb{all:unset;cursor:pointer;position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--onprimary);transition:transform .15s var(--ease),background-color .3s}
.pb:active{transform:scale(.94)}
.pb svg.ico{width:15px;height:15px;fill:currentColor;stroke:none}
.pb .ico path{transition:d .25s var(--ease)}
.rg{position:relative;width:52px;height:52px;display:grid;place-items:center}
.rg svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.rg .ring circle{fill:none;stroke-width:3.5}
.rg .ring .t{stroke:var(--hair)} .rg .ring .p{stroke:var(--rc,var(--good));stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .5s}
.rg .ring .h{stroke:var(--ink);stroke-linecap:round;opacity:0;transition:none}
.rg.holding .ring .h{opacity:1;animation:holdfill var(--hold,700ms) linear forwards}
@keyframes holdfill{from{stroke-dashoffset:var(--hc)}to{stroke-dashoffset:0}}
.hint{font-size:11px;color:var(--ink3);white-space:nowrap}
/* rolling digits */
.rd{display:inline-flex;align-items:baseline}
.rd .d{display:inline-block;height:1em;overflow:hidden;line-height:1em;vertical-align:baseline}
.rd .d > span{display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.rd .d > span > span{height:1em;line-height:1em}
.rd .c{display:inline-block;width:.32em;text-align:center}
.cc.run .rd .c.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
/* flips */
.flip{display:inline-block;animation:flipin .45s var(--ease)}
@keyframes flipin{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.cc .big.fl{animation:flipin .4s var(--ease)}
/* over quoted */
.cc.over{box-shadow:0 0 0 1.5px var(--over),var(--shadow)}
.cc .ovl{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--over-t);color:var(--over);font:600 12px/1 var(--mono);animation:flipin .45s var(--ease)}
/* the card breathes */
.cc.st-run{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 25%,transparent),0 0 0 0 color-mix(in srgb,var(--good) 0%,transparent),var(--shadow)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 55%,transparent),0 0 18px 2px color-mix(in srgb,var(--good) 22%,transparent),var(--shadow)}}
.cc.st-wait{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--r-wparts) 70%,transparent),var(--shadow);background:color-mix(in srgb,var(--r-wparts) 5%,var(--raised))}
.cc.st-done{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--r-done) 60%,transparent),var(--shadow)}
.ck{width:40px;height:40px;border-radius:50%;background:var(--r-done);display:grid;place-items:center}
.ck svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ck path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.wt{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--r-wparts);display:grid;place-items:center;color:var(--r-wparts);font:600 10px/1 var(--sans)}
/* stop reasons slide in */
.rsn{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;overflow:hidden}
.rsn button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,var(--raised));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent);font-size:12.5px;opacity:0;transform:translateY(6px);animation:chip .3s var(--ease) forwards}
.rsn button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rsn button:hover{background:color-mix(in srgb,var(--c) 22%,var(--raised))}
@keyframes chip{to{opacity:1;transform:none}}
/* who's on the clock */
.who{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 4px;border-radius:999px;background:var(--fill);font-size:12.5px}
.who .av{position:relative;width:20px;height:20px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font:600 9px/1 var(--sans);color:var(--ink2)}
.who .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 1.5px var(--fill)}
.cc.run .who .av::after{animation:livedot 1.8s ease-out infinite}
